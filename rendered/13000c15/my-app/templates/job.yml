apiVersion: batch/v1
kind: Job
metadata:
  name: test-my-app
  namespace: "test"
  labels:
    app.kubernetes.io/name: my-app
    helm.sh/chart: my-app-21.1.0
    app.kubernetes.io/instance: test-my-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "6.2.0"
    app: test-my-app
  annotations:
    configmap-hash: 1129e97254d84f196776cc7d2bebc44b7258bfde2ba88fafafd47b673b645e81
spec:
  template:
    metadata:
      annotations:
        configmap-hash: 1129e97254d84f196776cc7d2bebc44b7258bfde2ba88fafafd47b673b645e81
        
        vault.hashicorp.com/agent-cache-enable: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-run-as-same-user: "true"
        vault.hashicorp.com/tls-skip-verify: "false"
        vault.hashicorp.com/role: "test-my-app"
        vault.hashicorp.com/ca-cert: "/vault/tls/ca.crt"
        vault.hashicorp.com/tls-secret: "vault-tls"
        vault.hashicorp.com/service: "https://vault.example.com:8200"
        vault.hashicorp.com/tls-server-name: "vault.example.com"
        helm.sh/revision: "1"
      labels:
        app.kubernetes.io/name: my-app
        helm.sh/chart: my-app-21.1.0
        app.kubernetes.io/instance: test-my-app
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "6.2.0"
        app: test-my-app
    spec:
      securityContext:
        fsGroup: 1000
      shareProcessNamespace: false
      restartPolicy: Never
      serviceAccountName: test-my-app
      containers:
        - name: test-my-app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          image: docker.io/busybox:latest
          imagePullPolicy: Always
          command: ["sh","-c"]
          args: ["if [ -d \"/vault/secrets\" ]; then for f in /vault/secrets/*; do if [ -f \"$f\" ]; then . \"$f\"; fi; done; fi; /usr/local/bin/sleep 100000000;"]
          env:
            - name: _CONFIG_YAML
              value: /etc/config.yaml
          volumeMounts:
            - mountPath: /etc/config.yaml
              name: config
              readOnly: true
              subPath: config.yaml
      volumes:
          - configMap:
              items:
              - key: config
                path: config.yaml
              name: test-my-app
            name: config
