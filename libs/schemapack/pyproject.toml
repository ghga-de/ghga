[build-system]
requires = [
    "setuptools>=82",
]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
authors = [
    { name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 1 - Planning",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
name = "schemapack"
version = "4.3.0"
description = "Make your JSON Schemas sociable and create linked data models."
dependencies = [
    "pydantic >=2, <3",
    "pydantic_settings >=2, <3",
    "ruamel.yaml ~=0.18.6",
    "jsonschema >=4.19.2, <5",
    "ghga-arcticfreeze >=1.0, <2",
    "rich >13, <15",
    "typer >= 0.16.0",
]

[project.license]
text = "Apache 2.0"

[project.optional-dependencies]
schema-comparison = [
    "ghga-jsonsubschema >= 0.1.0",
]

[project.urls]
Repository = "https://github.com/ghga-de/schemapack"

[project.scripts]
schemapack = "schemapack.__main__:cli"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.paths]
source = [
    "src",
    "/workspace/src",
    "**/lib/python*/site-packages",
]

[tool.uv.sources]
ghga-arcticfreeze = { workspace = true }
ghga-jsonsubschema = { workspace = true }
