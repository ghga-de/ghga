schemapack: 4.0.0
description: a schemapack with a many-to-many relation that is mandatory at both ends # <-
classes:
  A:
    id:
      propertyName: alias
    content: ../../content_schemas/AnyObject.schema.json
    relations:
      b:
        description: the relation from A to B # <-
        targetClass: B
        mandatory:
          origin: true
          target: true
        multiple:
          origin: true
          target: true
  B:
    id:
      propertyName: alias
    content: ../../content_schemas/AnyObject.schema.json
