schemapack: 4.0.0
description: a schemapack with a type list annotation for property 'a'
classes:
  A:
    id:
      propertyName: alias
    content:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "additionalProperties": false,
        "description": "Matching any object.",
        "type": "object",
        "properties": { "a": { "type": ["string", "integer", "boolean"] } }, # <-
      }
    relations:
      b:
        targetClass: B
        mandatory:
          origin: false
          target: true
        multiple:
          origin: true
          target: false
  B:
    id:
      propertyName: alias
    content: ../../content_schemas/AnyObject.schema.json
