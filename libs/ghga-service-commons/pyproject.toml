[build-system]
requires = [
    "setuptools>=82",
]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
authors = [
    { name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
name = "ghga_service_commons"
version = "8.2.0"
description = "A library that contains common functionality used in services of GHGA"
dependencies = [
    "pydantic >=2, <3",
]

[project.license]
text = "Apache 2.0"

[project.optional-dependencies]
api = [
    "fastapi>=0.128, <1",
    "uvicorn[standard]>=0.40, <1",
    "ghga-service-commons[http,objectstorage]",
]
http = [
    "httpx2>=2.9.1, <3",
]
auth = [
    "jwcrypto>=1.5.6, <2",
    "pydantic[email]>=2, <3",
]
crypt = [
    "pynacl>=1.6.2, <2",
    "crypt4gh>=1.8.6, <2",
]
dev = [
    "requests>=2.32, <3",
]
objectstorage = [
    "hexkit[s3]>=8",
]
transports = [
    "tenacity >=9.1.2, <10",
    "ghga-service-commons[http]",
]
all = [
    "ghga-service-commons[api,auth,crypt,dev,http,objectstorage,transports]",
]

[project.urls]
Repository = "https://github.com/ghga-de/ghga"
"Release Notes" = "https://github.com/ghga-de/ghga/releases"
"Issue Tracker" = "https://github.com/ghga-de/ghga/issues"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.paths]
source = [
    "src",
    "/workspace/src",
    "**/lib/python*/site-packages",
]

[tool.tox]
legacy_tox_ini = """
    [tox]
    env_list = py3{10,11,12,13}

    [gh-actions]
    python =
        3.10: py310
        3.11: py311
        3.12: py312
        3.13: py313

    [testenv]
    pass_env =
        TC_HOST
        DOCKER_HOST
    deps =
        --no-deps -r ./lock/requirements-dev.txt
    commands =
        py310: pip install --no-deps backports.asyncio.runner==1.2.0 exceptiongroup==1.3.1 tomli==2.4.0
        pytest {posargs}
"""

[tool.uv.sources]
hexkit = { workspace = true }
