[build-system]
requires = [
    "setuptools>=80.9",
]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
authors = [
    { name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
name = "metldata"
version = "4.2.0"
description = "metldata - A framework for handling metadata based on ETL, CQRS, and event sourcing."
dependencies = [
    "hexkit[akafka,mongodb] >= 8.2, < 9",
    "ghga-service-commons[api,auth] >= 7.0, < 8",
    "ghga-event-schemas ~= 13.0.0",
    "typer >= 0.25",
    "linkml >= 1.8",
    "linkml-runtime >= 1.8",
    "linkml-validator >= 0.4.5",
    "curies == 0.13.0",
    "cryptography >= 48",
    "pydantic >= 2.13",
]

[project.license]
text = "Apache 2.0"

[project.urls]
Repository = "https://github.com/ghga-de/metldata"

[project.scripts]
metldata = "metldata.__main__:run"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.pytest.ini_options]
minversion = "8.4"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.paths]
source = [
    "src",
    "/workspace/src",
    "**/lib/python*/site-packages",
]

[tool.uv.sources]
ghga-event-schemas = { workspace = true }
ghga-service-commons = { workspace = true }
hexkit = { workspace = true }

[tool.ghga]
# Source-coupled library for the workspace, but also deployed as a service
# (submission/artifact APIs) — opt in to the platform image matrix (ADR-0014).
release = "platform"
image = true
