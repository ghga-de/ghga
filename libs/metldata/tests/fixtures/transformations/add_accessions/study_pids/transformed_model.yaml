id: https://w3id.org/Minimal-Model
name: Minimal-Model
version: 0.9.0
prefixes:
  linkml: https://w3id.org/linkml/
imports:
  - linkml:types

default_range: string

classes:
  Study:
    description: >-
      A study that the other entities of the submission belong to.
    slots:
      - alias
      - title
      - accession
    slot_usage:
      accession:
        required: true
        identifier: true
      alias:
        required: true
        identifier: false
      title:
        required: true

  File:
    description: >-
      A file is an object that contains information generated from a process, either an
      Experiment or an Analysis.
    slots:
      - alias
      - filename
      - format
      - size
      - checksum
      - accession
    slot_usage:
      accession:
        required: true
        identifier: true
      alias:
        required: true
        identifier: false
      filename:
        required: true
      format:
        required: true
      checksum:
        required: true
      size:
        required: true

  Dataset:
    description: >-
      A Dataset is a collection of Files.
    slots:
      - alias
      - study
      - files
      - accession
    slot_usage:
      accession:
        required: true
        identifier: true
      alias:
        required: true
        identifier: false
      study:
        required: true
        multivalued: false
        inlined: false
      files:
        required: true
        multivalued: true
        inlined: false

  Sample:
    description: >-
      A sample that was used to generate Files containing experiment data.
    slots:
      - alias
      - description
      - files
      - accession
    slot_usage:
      accession:
        required: true
        identifier: true
      alias:
        required: true
        identifier: false
      description:
        required: true
      files:
        required: true
        multivalued: true
        inlined: false

  Experiment:
    description: >-
      An experiment containing one or multiple samples.
    slots:
      - alias
      - description
      - samples
      - accession
    slot_usage:
      accession:
        required: true
        identifier: true
      alias:
        required: true
        identifier: false
      description:
        required: true
      samples:
        required: true
        multivalued: true
        inlined: false

  Submission:
    tree_root: true
    description: >-
      A grouping entity that represents information about one or more entities.
      A submission can be considered as a set of inter-related (and inter-connected)
      entities that represent a data submission to GHGA.
    slots:
      - studies
      - files
      - datasets
      - samples
      - experiments
    slot_usage:
      studies:
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      files:
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      datasets:
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      samples:
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      experiments:
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true

slots:
  accession:
    description: The accession for an entity.

  alias:
    description: The alias for an entity.

  title:
    description: The title of a study.

  description:
    description: Description of an entity.

  study:
    description: >-
      The study associated with an entity.
    range: Study

  studies:
    description: >-
      The studies associated with an entity.
    range: Study

  files:
    description: >-
      The file associated with an entity.
    range: File

  datasets:
    description: >-
      The dataset associated with an entity.
    range: Dataset

  samples:
    description: >-
      The sample associated with an entity.
    range: Sample

  experiments:
    description: >-
      The experiment associated with an entity.
    range: Experiment

  filename:
    description: >-
      The given filename.

  format:
    description: >-
      The format of the file: BAM, SAM, CRAM, BAI, etc.
    range: file format enum

  size:
    description: The size of a file in bytes.
    range: integer

  checksum:
    description: >-
      A computed value which depends on the contents of a block of data, used to
      detect corruption of the data.

enums:
  file format enum:
    description: >-
      Enum to capture file types.
    permissible_values:
      bam:
        description: BAM File
      fastq:
        description: FastQ File
