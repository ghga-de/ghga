id: https://w3id.org/Minimal-Model-With-Study
name: Minimal-Model-With-Study
version: 0.9.0
prefixes:
  linkml: https://w3id.org/linkml/
imports:
  - linkml:types

default_range: string

classes:
  AliasMixin:
    mixin: true
    slots:
      - alias
    slot_usage:
      alias:
        required: true
        identifier: true

  Study:
    description: >-
      A Study is the scope of a submission.
    mixins: AliasMixin

  File:
    description: >-
      A file is an object that contains information generated from a process.
    mixins: AliasMixin
    slots:
      - filename
      - dataset
    slot_usage:
      filename:
        required: true
      dataset:
        required: true

  Dataset:
    description: >-
      A dataset is a collection of files governed by one data access policy.
    mixins: AliasMixin
    slots:
      - data_access_policy
    slot_usage:
      data_access_policy:
        required: true

  DataAccessPolicy:
    description: >-
      A data access policy states the conditions under which a dataset is shared.
    mixins: AliasMixin
    slots:
      - data_access_committee
    slot_usage:
      data_access_committee:
        required: true

  DataAccessCommittee:
    description: >-
      A data access committee decides on access to the datasets of its policies.
    mixins: AliasMixin

  Submission:
    tree_root: true
    description: >-
      A grouping entity that represents the data submission of exactly one study.
    slots:
      - studies
      - files
      - datasets
      - data_access_policies
      - data_access_committees

    slot_usage:
      studies:
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
        maximum_cardinality: 1
      files:
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      datasets:
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      data_access_policies:
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      data_access_committees:
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true

slots:
  alias:
    description: The alias for an entity.

  studies:
    description: The study associated with an entity.
    range: Study

  files:
    description: The file associated with an entity.
    range: File

  datasets:
    description: The datasets associated with an entity.
    range: Dataset

  data_access_policies:
    description: The data access policies associated with an entity.
    range: DataAccessPolicy

  data_access_committees:
    description: The data access committees associated with an entity.
    range: DataAccessCommittee

  filename:
    description: The given filename.

  dataset:
    description: The dataset the file belongs to.
    range: Dataset

  data_access_policy:
    description: The data access policy of the dataset.
    range: DataAccessPolicy

  data_access_committee:
    description: The data access committee of the data access policy.
    range: DataAccessCommittee
