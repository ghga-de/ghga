[general]
root = "."
page-fallback = "./index.html"

# Where several entries match a request, the last one wins for each header it sets, so
# the catch-all comes first. Pragma and Expires stay unset, as an entry cannot remove a
# header and the hashed files would otherwise keep them beside their Cache-Control.

# No cache for HTML pages, SPA routes and every file without a content hash in its name:
# config.js and the verbatim copies under assets/ can change with any deployment
[[advanced.headers]]
source = "**"
[advanced.headers.headers]
Cache-Control = "no-cache, no-store, must-revalidate, proxy-revalidate"

# Cache the build output whose names carry a content hash for 1 year (immutable)
[[advanced.headers]]
source = "/{main,polyfills,chunk,styles}-*.{js,css}"
[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"

[[advanced.headers]]
source = "/media/*"
[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"
