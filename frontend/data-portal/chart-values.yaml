# Chart values for this member (deployment knowledge only).
# Derived facts — image, executable, configPrefix, command style — are stamped
# by the chart generator from workspace metadata (deploy/src/create_charts.py).
apiBasePath: /

# Service parameters
config:
  host: 0.0.0.0
  oidc_use_discovery: false
  root_files: {}

configMap:
  # mountPath: /home/appuser/data-portal.yaml
  # DHI
  mountPath: /app/data-portal.yaml

containerSecurityContext:
  readOnlyRootFilesystem: false
  # In Data-Portal-UI, node is user 1000 and appuser is user 1001
  # runAsUser: 1001
  # For the DHI images
  runAsUser: 1000
