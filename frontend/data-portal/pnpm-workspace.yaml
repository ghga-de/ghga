allowedDeprecatedVersions:
  # ngx-mat-input-tel declares the deprecated @angular/platform-browser-dynamic as a
  # peer dep but never imports it; silence the install-time deprecation warning.
  '@angular/platform-browser-dynamic': '*'
  # Deep dev-only transitive dep (@compodoc/compodoc > cheerio > encoding-sniffer);
  # deprecated in favour of @exodus/bytes but not something we depend on directly.
  whatwg-encoding: '*'
allowBuilds:
  '@compodoc/compodoc': true
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  msw: true
  unrs-resolver: true
# Versions exempted from the default 24 hour minimumReleaseAge quarantine.
# Entries can be dropped again once the versions are older than one day.
minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2201.2'
  - '@angular-devkit/core@22.1.2'
  - '@angular-devkit/schematics@22.1.2'
  - '@angular/build@22.1.2'
  - '@angular/cli@22.1.2'
  - '@playwright/test@1.62.1'
  - '@schematics/angular@22.1.2'
  - playwright@1.62.1
  - playwright-core@1.62.1
