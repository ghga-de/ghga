<header class="flex items-center justify-between gap-2">
  <h1>Upload Box Manager</h1>
  @if (!reordering()) {
    <div class="flex items-center gap-2">
      <button
        #changeOrderButton
        mat-raised-button
        type="button"
        class="button-quaternary"
        [disabled]="!canChangePriority()"
        (click)="reordering.set(true)"
      >
        <mat-icon fontIcon="swap_vert"></mat-icon>
        Change order
      </button>
      <app-refresh-button
        what="the upload boxes"
        [loading]="isLoading()"
        umamiEvent="Upload Box Manager Refresh Clicked"
        (refresh)="refresh()"
      />
    </div>
  }
</header>

@if (reordering()) {
  <app-upload-box-priority-editor (done)="stopReordering()" />
} @else {
  <div class="flex flex-col gap-4">
    <app-upload-box-manager-filter></app-upload-box-manager-filter>
    <app-upload-box-manager-list></app-upload-box-manager-list>
    <button
      (click)="openCreateUploadBoxDialog()"
      mat-raised-button
      class="button-quaternary mt-4 self-start"
      aria-label="Create Upload Box"
    >
      <mat-icon fontIcon="add"></mat-icon>
      Create Upload Box
    </button>
  </div>
}
