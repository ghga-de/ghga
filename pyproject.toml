# GHGA monorepo — virtual `uv` workspace root.
#
# This root is intentionally NOT a package ([project] is omitted). It only defines the
# workspace membership, the shared dev/test toolchain, and repo-wide tool configuration.
# Members (libs/*, services/*, tools/*) each have their own pyproject.toml + version, and
# consume internal libraries from source via `[tool.uv.sources] <lib> = { workspace = true }`.
#
# See docs/architecture/overview.md and docs/adr/0002-uv-workspace-source-coupled-libs.md.

[tool.uv.workspace]
members = ["libs/*", "services/*", "tools/*"]

# Shared dev/test toolchain, installed into the workspace venv via `uv sync`.
# Pins mirror the GHGA service template conventions.
[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-httpx>=0.36",
    "pre-commit>=4.6",
    "mypy>=2.1",
    "ruff>=0.15.13",
    "httpx>=0.28.1",
    "tomli_w>=1.2",
    # per-member test deps recovered from the dropped lock/requirements-dev.in files.
    # testcontainers is needed by hexkit's provider testutils across most suites; make it a
    # first-class dev dep so container tests fail on the Docker daemon (not on import).
    "testcontainers>=4.14",
    "aiosmtpd>=1.4.6",
    "openapi-core>=0.19.5",
    "cryptography>=46",
    "logot>=1.3",
]

# ----------------------------------------------------------------------------------------
# Repo-wide tool configuration (single source of truth — replaces N per-repo copies).
# Rule sets are ported VERBATIM from the retired microservice-repository-template
# (.pyproject_generation/pyproject_template.toml). Only `src`/`exclude`, the per-file-ignore
# GLOBS, and the isort first-party list are adapted to the monorepo layout.
# ----------------------------------------------------------------------------------------
[tool.ruff]
line-length = 88
# monorepo: NO explicit target-version — members have different Python floors (libs
# published to PyPI reach down to 3.9). Left unset, ruff infers the target per file
# from the nearest [project] requires-python, so pyupgrade never suggests syntax a
# member's floor cannot run.
# monorepo: point first-party detection at each member's src/ (was a single "src" per repo)
src = ["libs/*/src", "services/*/src", "tools/*/src", "scripts"]
exclude = [
    ".git", ".devcontainer", "__pycache__", "build", "dist",
    # monorepo: never lint migration sources/scratch or the JS front end
    ".legacy_repos", ".migration-work", "frontend",
    # imported epic docs are historical artifacts; their ```python fences are not all
    # real Python, and ruff >= 0.16 would otherwise format code blocks in markdown
    "docs/epics",
    # same ruff >= 0.16 markdown behaviour: this README's ```python fence is upstream
    # content that ghga-de/ghga-jsonsubschema keeps unformatted. Reformatting it here
    # would diverge a file the one-way sync re-delivers (ADR-0010). Drop this once that
    # repo no longer syncs from mainline.
    "libs/ghga-jsonsubschema/README.md",
]

[tool.ruff.lint]
# --- ported verbatim from the template ---
fixable = ["UP", "I", "D", "RUF022"]
ignore = [
    "E111", "E114", "E116",  # indentation (formatter-managed)
    "PLW",                    # pylint warnings
    "RUF001",                 # ambiguous unicode character strings
    "RUF010",                 # explicit str/repr conversion (!s / !r)
    "RUF012",                 # mutable class default needs ClassVar
    "N818",                   # Error suffix on exception names
    "B008",                   # function call in argument defaults
    "PLR2004",                # magic-value comparison
    "D205", "D400", "D401", "D107", "D206", "D300",  # pydocstyle relaxations
    "UP040",                  # `type` statement (mypy support pending)
    "PLC0206",                # dict value extraction without `.items()`
    "PLR0917",                # too many positional arguments (stable since ruff 0.16)
]
select = ["C90", "F", "I", "S", "B", "N", "UP", "PL", "RUF", "SIM", "D"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# template per-file-ignore rule sets, globs widened for the monorepo layout
[tool.ruff.lint.per-file-ignores]
"**/scripts/**" = ["PL", "S", "SIM", "D"]
"**/tests/**" = ["S", "SIM", "PLR", "B011"]
"**/tests_*/**" = ["S", "SIM", "PLR", "B011"]
"**/examples/**" = ["S", "D"]
"**/__init__.py" = ["D"]
# tools/auth-km-jobs predates the shared code standard; relax the rules it does not yet meet
# (rather than retrofit docstrings etc.). Revisit if the tool is modernised.
"tools/auth-km-jobs/**" = ["D", "B904", "SIM115", "PLC0415"]
# libs/ghga-jsonsubschema is a fork of IBM/jsonsubschema, still synced from mainline
# (ADR-0010), so its code is not ours to restyle. These two entries reproduce the policy its
# own (now removed) [tool.ruff] carried, instead of churning upstream files:
#   D101-D103 - its pytest suite is bare `def test_x(): assert ...` functions, no docstrings
#   RUF100    - `# noqa: E501` markers on long literals; E501 is not selected at the root,
#               which makes those directives "unused" here but load-bearing upstream
"libs/ghga-jsonsubschema/tests/**" = ["D101", "D102", "D103", "RUF100"]

# monorepo: internal libraries are workspace *source* -> first-party, not PyPI third-party
[tool.ruff.lint.isort]
# `jsonsubschema` and `arcticfreeze` are the import names of the `ghga-jsonsubschema` and
# `ghga-arcticfreeze` dists (libs/ghga-jsonsubschema, libs/ghga-arcticfreeze).
known-first-party = ["hexkit", "ghga_service_commons", "ghga_event_schemas", "schemapack", "metldata", "jsonsubschema", "arcticfreeze"]

[tool.mypy]
# --- ported verbatim from the template ---
disable_error_code = "import"
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_site_packages = false
# monorepo addition (template predates mypy 2.x strictness): the pydantic plugin teaches
# mypy that BaseSettings configs load from env, so `Config()` is valid (no call-arg errors)
plugins = ["pydantic.mypy"]
# monorepo: exclude migration sources/scratch (regex)
exclude = ['build/lib/', '\.legacy_repos/', '\.migration-work/']

# Assigning to a method is a bug in production code and routine monkeypatching in a
# test, so `method-assign` is off for the test packages only. Without this the pattern
# costs a suppression comment per patch site -- there were 47 across 14 files.
# mypy only accepts `*` as a WHOLE module component, so `tests_*` is rejected and the
# members whose test package is named after them have to be listed one by one.
[[tool.mypy.overrides]]
module = [
    "tests",
    "tests.*",
    "tests_dcs",
    "tests_dcs.*",
    "tests_ekss",
    "tests_ekss.*",
    "tests_fis",
    "tests_fis.*",
    "tests_ifrs",
    "tests_ifrs.*",
    "tests_pcs",
    "tests_pcs.*",
    "tests_ucs",
    "tests_ucs.*",
]
disable_error_code = ["method-assign"]

[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
