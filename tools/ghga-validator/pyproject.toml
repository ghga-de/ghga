[build-system]
requires = [
    "setuptools>=67.7.2",
]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
authors = [
    { name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Utilities",
    "Intended Audience :: Science/Research",
]
name = "ghga_validator"
# 1.2.1 is spent on TestPyPI: a pypi-publish.yaml rehearsal uploaded it there.
version = "1.2.2"
description = "GHGA Validator - A Python library and command line utility to validate metadata"
dependencies = [
    "typer >= 0.9.0",
    "pydantic >=2, <3",
    "linkml>=1.8",
    "linkml-runtime>=1.8",
    "linkml-validator>=0.4.5",
]

[project.license]
text = "Apache 2.0"

[project.urls]
Repository = "https://github.com/ghga-de/ghga"
"Release Notes" = "https://github.com/ghga-de/ghga/releases"
"Issue Tracker" = "https://github.com/ghga-de/ghga/issues"

[project.scripts]
ghga_validator = "ghga_validator.__main__:run"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.pytest.ini_options]
minversion = "7.1"
asyncio_mode = "strict"

[tool.coverage.paths]
source = [
    "src",
    "/workspace/src",
    "**/lib/python*/site-packages",
]

# Capability markers (ADR-0014): public CLI, no internal deps -> PyPI release lane.
[tool.ghga]
release = "pypi"
pypi = true
cli = true
