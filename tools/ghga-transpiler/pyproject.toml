[build-system]
requires = [
    "setuptools>=69",
]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
authors = [
    { name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 1 - Planning",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
name = "ghga_transpiler"
version = "2.4.1"
description = "GHGA-Transpiler - excel to JSON converter"
dependencies = [
    "typer >= 0.12",
    "openpyxl >= 3.1.2, == 3.*",
    "defusedxml >= 0.7, == 0.*",
    "pydantic >=2.6, <3",
    "PyYAML ~= 6.0",
    "semver == 3.*",
    "click ~= 8.1.0",
]

[project.license]
text = "Apache 2.0"

[project.urls]
Repository = "https://github.com/ghga-de/ghga-transpiler"

[project.scripts]
ghga-transpiler = "ghga_transpiler.__main__:run"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.setuptools.package-data]
"ghga_transpiler.configs" = [
    "*.yaml",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "strict"

[tool.coverage.paths]
source = [
    "src",
    "/workspace/src",
    "**/lib/python*/site-packages",
]
