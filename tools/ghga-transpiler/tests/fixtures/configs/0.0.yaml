ghga_metadata_version: 0.0.0
default_settings:
  header_row: 1
  start_row: 2
  start_column: 1
  end_column: 3
worksheets:
  - sheet_name: books
    settings:
      end_column: 6
      name: books
      transformations:
        genre:
          !!python/object/apply:ghga_transpiler.transformations.to_snake_case_list []
        set_in:
          !!python/object/apply:ghga_transpiler.transformations.to_snake_case []
        happy_ending: !!python/name:ghga_transpiler.transformations.to_boolean
  - sheet_name: publisher
    settings:
      name: publisher
      transformations:
        publisher_names:
          !!python/object/apply:ghga_transpiler.transformations.to_list []
        attributes:
          !!python/object/apply:ghga_transpiler.transformations.to_attributes []
