[build-system]
requires = ["setuptools>=80.9"]
build-backend = "setuptools.build_meta"

[project]
version = "0.2.1"
name = "auth-km-jobs"
description = "GHGA Auth Key Management Jobs - manages JWT signing keys used by GHGA and re-encrypts all user TOTP tokens stored in the auth database; runs as a Kubernetes Job, either regularly or on demand."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.13"
license = {text = "Apache-2.0"}
authors = [
  {name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de"}
]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "typer>=0.21",
  "pydantic~=2.12",
  "pydantic-settings~=2.12",
  "pymongo~=4.16",
  "httpx>=0.28.1,<0.29",
  "jwcrypto~=1.5.6",
  "pynacl~=1.6.2",
  "hvac~=2.4.0",
  "crypt4gh~=1.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  # test-only: ephemeral Vault + MongoDB via hexkit's provider testcontainers fixtures
  "hexkit[mongodb, vault]>=8.3",
  "testcontainers>=4.14,<5",
]

[tool.uv.sources]
hexkit = { workspace = true }

[project.scripts]
auth-km-jobs = "auth_km_jobs.__main__:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.setuptools.package-data]
auth_km_jobs = ["py.typed"]

# Capability markers (ADR-0014): K8s-deployed job -> platform release lane.
# Relocation to services/ is planned for cutover (ADR-0004).
[tool.ghga]
release = "platform"
image = true
