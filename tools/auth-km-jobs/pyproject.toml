[build-system]
requires = ["setuptools>=80.9"]
build-backend = "setuptools.build_meta"

[project]
version = "0.2.0"
name = "auth_km_jobs"
description = "GHGA Auth Key Management Jobs"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
  {name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de"}
]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
]
# Dependencies migrated from setup.cfg install_requires
dependencies = [
  "typer>=0.19,<0.20",
  "pydantic~=2.12",
  "pydantic-settings~=2.11",
  "pymongo~=4.15",
  "httpx>=0.28.1,<0.29",
  "jwcrypto~=1.5.6",
  "pynacl~=1.6.0",
  "hvac~=2.3.0",
  "crypt4gh~=1.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
run = "auth_km_jobs.__main__:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.setuptools.package-data]
auth_km_jobs = ["py.typed"]

