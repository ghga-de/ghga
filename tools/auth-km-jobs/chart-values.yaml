# Chart values for this member (deployment knowledge only).
# Derived facts — image, executable, configPrefix, command style — are stamped
# by the chart generator from workspace metadata (deploy/src/create_charts.py).
cronjob:
  enabled: true

deployment:
  enabled: false

service:
  enabled: false

cronSchedule: "0 0 1 1 0"

executableArgs:
- refresh-int-keys
configMap:
  enabled: false
  envVar:
    enabled: false

envVars:
- name: AUTH_KM_JOBS_TOKEN
  value: ""
- name: AUTH_KM_JOBS_VAULT_ADDR
  value: https://hashicorp-vault.vault:8200
- name: AUTH_KM_JOBS_VAULT_NAMESPACE
  value: vault
- name: AUTH_KM_JOBS_VAULT_ROLE
  value: auth-km-jobs-role
