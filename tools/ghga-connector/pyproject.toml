[build-system]
requires = [
    "setuptools>=80.3",
]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
authors = [
    { name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Utilities",
    "Intended Audience :: Science/Research",
]
name = "ghga_connector"
version = "4.0.0"
description = "GHGA Connector - A CLI client application for interacting with the GHGA system."
dependencies = [
    "typer~=0.19",
    "crypt4gh>=1.8.6, <2",
    "ghga-service-commons[api, crypt, transports]==8.1.0",
    "httpx2>=2.9.1, <3",
    "hexkit[s3]==9.0.1",
    "rich>=14.0, <15",
    "async-lru >= 2.1.0, <3",
    "prompt_toolkit>=3.0, <4",
]

[project.license]
text = "Apache 2.0"

[project.urls]
Repository = "https://github.com/ghga-de/ghga"
"Release Notes" = "https://github.com/ghga-de/ghga/releases"
"Issue Tracker" = "https://github.com/ghga-de/ghga/issues"

[project.scripts]
ghga-connector = "ghga_connector.__main__:run"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.pytest.ini_options]
minversion = "8.3"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"

[tool.coverage.paths]
source = [
    "src",
    "/workspace/src",
    "**/lib/python*/site-packages",
]

[tool.tox]
legacy_tox_ini = """
    [tox]
    env_list = py3{10,11,12,13}

    [gh-actions]
    python =
        3.10: py310
        3.11: py311
        3.12: py312
        3.13: py313

    [testenv]
    pass_env =
        TC_HOST
        DOCKER_HOST
    deps =
        --no-deps -r ./lock/requirements-dev.txt
    commands =
        py3{10}: pip install --no-deps backports.asyncio.runner==1.2.0 exceptiongroup==1.3.0 tomli==2.2.1 websockets<17
        pytest {posargs}
"""

[tool.uv.sources]
ghga-service-commons = { workspace = true }
hexkit = { workspace = true }

# Capability markers (ADR-0014): public end-user CLI -> PyPI release lane with
# the closure-train rule (co-release changed internal deps, exact pins; ADR-0004).
[tool.ghga]
release = "pypi"
pypi = true
cli = true
