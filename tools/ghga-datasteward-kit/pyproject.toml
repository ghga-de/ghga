[build-system]
requires = [
    "setuptools>=80.9",
]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
authors = [
    { name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
name = "ghga_datasteward_kit"
version = "5.4.2"
description = "GHGA Data Steward Kit - A utils package for GHGA data stewards."
dependencies = [
    "crypt4gh >=1.8.6, <2",
    "hexkit[s3] >=9.0.0",
    "ghga-transpiler >=2.1.2, <3",
    "metldata >=4.2.1, <5",
    "ghga-service-commons[transports,crypt] >=8.0.0, <9",
]

[project.license]
text = "Apache 2.0"

[project.urls]
Repository = "https://github.com/ghga-de/ghga-datasteward-kit"

[project.scripts]
ghga-datasteward-kit = "ghga_datasteward_kit.__main__:run"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.pytest.ini_options]
minversion = "8.4"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.paths]
source = [
    "src",
    "/workspace/src",
    "**/lib/python*/site-packages",
]

[tool.uv.sources]
ghga-service-commons = { workspace = true }
ghga-transpiler = { workspace = true }
hexkit = { workspace = true }
metldata = { workspace = true }

# Capability markers (ADR-0014): internal transitional tool -> platform release
# lane, distributed run-from-repo at the release tag (no image, no PyPI; ADR-0004).
[tool.ghga]
release = "platform"
image = false
cli = true
