schema_version: "1.1"
name: q09-release-candidate
description: 'Q9, an answer spread over the release docs and an ADR.'
tags: [two-files]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: 'You work in a clone of the GHGA monorepo. Its instructions are in AGENTS.md at the root and in the AGENTS.md of each area; read the root file before you start, as a session here loads it.'
  prompt: |
    When a platform release candidate is tagged, what gets built, what version do services report, and how are the images signed?
graders:
  - name: fact-1
    type: regex
    pattern: 'all (the )?images|every image|all .{0,20}images'
    flags: 'i'
  - name: fact-2
    type: regex
    pattern: 'cosign'
    flags: 'i'
  - name: fact-3
    type: regex
    pattern: 'keyless'
    flags: 'i'
  - name: answer
    type: llm
    criteria: |
      The answer says a ghga/X.Y.Z-rc.N tag builds all images from the tagged commit, and the charts are packaged and stamped with the same version; services report the platform version through their dist-info (importlib.metadata), stamped by scripts/stamp_platform_version.py; images get keyless cosign signatures on the digest, with SBOM and provenance as signed attestations.
                It names docs/releases.md and ADR-0037 as sources.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    arm: 'with-only'
