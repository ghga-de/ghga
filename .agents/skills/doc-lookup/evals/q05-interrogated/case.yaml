schema_version: "1.1"
name: q05-interrogated
description: 'Q5, service behaviour in the architecture docs.'
tags: [architecture]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: 'You work in a clone of the GHGA monorepo. Its instructions are in AGENTS.md at the root and in the AGENTS.md of each area; read the root file before you start, as a session here loads it.'
  prompt: |
    In the file upload flow, which service sets a file to interrogated, and what triggers it?
graders:
  - name: fact-1
    type: regex
    pattern: '\bFIS\b|file ingest'
    flags: 'i'
  - name: fact-2
    type: regex
    pattern: 'interrogation ?report|\bDHFS\b|datahub'
    flags: 'i'
  - name: answer
    type: llm
    criteria: |
      The answer says FIS sets the upload to interrogated, after DHFS has re-encrypted the file and posted a successful interrogation report; FIS deposits the secret with EKSS and emits InterrogationSuccess, which UCS consumes.
                It names docs/architecture/metadata-and-file-journeys.md as the source.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    arm: 'with-only'
