schema_version: "1.1"
name: q06-dlq-requeue
description: 'Q6, an answer spread over a service README and an ADR.'
tags: [two-files]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: 'You work in a clone of the GHGA monorepo. Its instructions are in AGENTS.md at the root and in the AGENTS.md of each area; read the root file before you start, as a session here loads it.'
  prompt: |
    How does the DLQ service let an operator get a failed event re-consumed by the original service?
graders:
  - name: fact-1
    type: regex
    pattern: 'retry'
    flags: 'i'
  - name: fact-2
    type: regex
    pattern: 'REST|API|endpoint'
    flags: 'i'
  - name: answer
    type: llm
    criteria: |
      The answer says an operator uses the DLQ service's REST API to preview, discard, modify or requeue events for a service and topic, and that a requeued event is published to a retry topic derived from the original service's name, which that service consumes.
                It names the DLQ service README or ADR-0009 as a source, not an epic.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    arm: 'with-only'
