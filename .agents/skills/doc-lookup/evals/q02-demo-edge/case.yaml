schema_version: "1.1"
name: q02-demo-edge
description: 'Q2, a paraphrased ADR question.'
tags: [which-adr]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: 'You work in a clone of the GHGA monorepo. Its instructions are in AGENTS.md at the root and in the AGENTS.md of each area; read the root file before you start, as a session here loads it.'
  prompt: |
    Why doesn't the local demo run Istio at its edge like production does, and what does it use instead?
graders:
  - name: fact-1
    type: regex
    pattern: 'envoy gateway'
    flags: 'i'
  - name: fact-2
    type: regex
    pattern: 'adr-0032'
    flags: 'i'
  - name: answer
    type: llm
    criteria: |
      The answer says the demo uses Envoy Gateway as its edge, and gives the reason from ADR-0032: production registers ext-authz with a privileged job that patches the mesh configuration, and full Istio is heavy on a single-node cluster.
                It names ADR-0032 as the source.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    arm: 'with-only'
