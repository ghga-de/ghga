schema_version: "1.1"
name: q10-chart-value
description: 'Q10, a pointer question whose trap is the generated chart.'
tags: [pointer]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: 'You work in a clone of the GHGA monorepo. Its instructions are in AGENTS.md at the root and in the AGENTS.md of each area; read the root file before you start, as a session here loads it.'
  prompt: |
    I want to change an environment value in the Helm chart of one service. Which file do I edit and what do I run?
graders:
  - name: fact-1
    type: regex
    pattern: 'chart-values\.yaml'
    flags: 'i'
  - name: fact-2
    type: regex
    pattern: 'just charts'
    flags: 'i'
  - name: answer
    type: llm
    criteria: |
      The answer says the charts in deploy/charts/<service>/ are generated and must not be edited by hand; the value goes into the member's chart-values.yaml (or the generator), followed by `just charts`.
                Fail if it tells the user to edit a file under deploy/charts/<service>/ directly.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    arm: 'with-only'
