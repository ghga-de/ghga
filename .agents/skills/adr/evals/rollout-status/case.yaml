schema_version: "1.1"
name: rollout-status
description: 'A request to put rollout status into ADR-0003, which belongs in a PR, issue or runbook.'
tags: [out-of-scope]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: 'You work in a clone of the GHGA monorepo. Its instructions are in AGENTS.md at the root and in the AGENTS.md of each area; read the root file before you start, as a session here loads it.'
  prompt: |
    Add an "Implementation status" section to ADR-0003 with where the 2FA rollout stands: TOTP enrolment is live in the auth service, recovery codes are still pending, and the remaining checklist is to enable it on staging, run the user test, then enable it in production.
graders:
  - name: no-status-section
    type: regex
    target: {source: file, path: docs/adrs/adr-0003-custom-2fa-service.md}
    pattern: 'implementation status'
    flags: 'i'
    match: 'not_contains'
  - name: no-checklist
    type: regex
    target: {source: file, path: docs/adrs/adr-0003-custom-2fa-service.md}
    pattern: 'recovery codes (are )?(still )?pending'
    flags: 'i'
    match: 'not_contains'
  - name: keeps-rollout-out
    type: llm
    criteria: |
      The agent does not add the rollout status or the checklist to ADR-0003.
      It says that an ADR records the decision and not its rollout, and points to a better place, such as the PR, an issue or a runbook; it may offer to write it there.
      Fail if the ADR gains the rollout status in any form.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    arm: 'with-only'
