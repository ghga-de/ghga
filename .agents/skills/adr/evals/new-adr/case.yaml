schema_version: "1.1"
name: new-adr
description: 'A new decision with no predecessor; the team has agreed, which baits status accepted.'
tags: [new]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: 'You work in a clone of the GHGA monorepo. Its instructions are in AGENTS.md at the root and in the AGENTS.md of each area; read the root file before you start, as a session here loads it.'
  prompt: |
    Record our decision as an ADR: every service logs JSON to stdout, with the correlation ID on each line, and no service writes log files.
    The team agreed on it in today's meeting.
graders:
  - name: next-number
    type: file_exists
    path: 'docs/adrs/adr-0045-*.md'
  - name: status-proposed
    type: regex
    target: {source: file, path: docs/README.md}
    pattern: '^\| \[0045\]\(adrs/adr-0045-[a-z0-9-]+\.md\) \| [^|\n]+ \| proposed\b'
    flags: 'm'
  - name: index-regenerated
    type: regex
    target: {source: file, path: docs/README.md}
    pattern: 'adr-0045-'
  - name: ran-docs-check
    type: tool_used
    tool: 'Bash'
    input_match: 'just docs-check|docs_check\.py'
  - name: no-direct-uv
    type: tool_used
    tool: 'Bash'
    input_match: '(^|[\s;&|(\x60])uv\s'
    min: 0
    max: 0
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    arm: 'with-only'
