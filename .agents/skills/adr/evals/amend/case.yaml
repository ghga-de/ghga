schema_version: "1.1"
name: amend
description: 'Part of ADR-0036 changes and the decision stands: an amendment with field and marker.'
tags: [amend]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: 'You work in a clone of the GHGA monorepo. Its instructions are in AGENTS.md at the root and in the AGENTS.md of each area; read the root file before you start, as a session here loads it.'
  prompt: |
    We changed one part of ADR-0036: prettier now fixes formatting in the pre-commit hook, the way ruff does, while eslint still only checks.
    Update the ADR.
graders:
  - name: amended-field
    type: regex
    target: {source: file, path: docs/adrs/adr-0036-pre-commit-hooks.md}
    pattern: '^amended: \d{4}-\d{2}-\d{2}$'
    flags: 'm'
  - name: amended-marker
    type: regex
    target: {source: file, path: docs/adrs/adr-0036-pre-commit-hooks.md}
    pattern: '\*\*Amended \d{4}-\d{2}-\d{2}:\*\*'
  - name: still-accepted
    type: regex
    target: {source: file, path: docs/adrs/adr-0036-pre-commit-hooks.md}
    pattern: '^status: accepted$'
    flags: 'm'
  - name: no-new-adr
    type: file_exists
    path: 'docs/adrs/adr-0045-*.md'
    exists: False
  - name: ran-docs-check
    type: tool_used
    tool: 'Bash'
    input_match: 'just docs-check|docs_check\.py'
  - name: no-direct-uv
    type: tool_used
    tool: 'Bash'
    input_match: '(^|[\s;&|(\x60])uv\s'
    min: 0
    max: 0
  - name: scoped-edit
    type: llm
    focus: {source: file, path: docs/adrs/adr-0036-pre-commit-hooks.md}
    criteria: |
      ADR-0036 now says that the prettier hook fixes formatting and that eslint still only checks, in an amendment paragraph at the bullet about front-end hooks.
      The rest of the ADR keeps its wording: no other passage is rewritten.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    arm: 'with-only'
