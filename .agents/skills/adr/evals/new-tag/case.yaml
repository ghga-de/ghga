schema_version: "1.1"
name: new-tag
description: 'A new ADR whose tag is not in the list yet: the list and TAGS are extended.'
tags: [new, tag]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: 'You work in a clone of the GHGA monorepo. Its instructions are in AGENTS.md at the root and in the AGENTS.md of each area; read the root file before you start, as a session here loads it.'
  prompt: |
    Write an ADR for this decision: every service exports OpenTelemetry traces through the cluster's collector, and spans carry the correlation ID.
    Tag it `observability`; we do not have that tag yet.
graders:
  - name: next-number
    type: file_exists
    path: 'docs/adrs/adr-0045-*.md'
  - name: status-proposed
    type: regex
    target: {source: file, path: docs/README.md}
    pattern: '^\| \[0045\]\(adrs/adr-0045-[a-z0-9-]+\.md\) \| [^|\n]+ \| proposed\b'
    flags: 'm'
  - name: index-regenerated
    type: regex
    target: {source: file, path: docs/README.md}
    pattern: 'adr-0045-'
  - name: ran-docs-check
    type: tool_used
    tool: 'Bash'
    input_match: 'just docs-check|docs_check\.py'
  - name: no-direct-uv
    type: tool_used
    tool: 'Bash'
    input_match: '(^|[\s;&|(\x60])uv\s'
    min: 0
    max: 0
  - name: tag-on-adr
    type: regex
    target: {source: file, path: docs/README.md}
    pattern: '^\| \[0045\]\(adrs/adr-0045-[a-z0-9-]+\.md\) \| [^|\n]+ \| [^|\n]+ \| [^|\n]*\bobservability\b'
    flags: 'm'
  - name: tag-in-check
    type: regex
    target: {source: file, path: scripts/docs_check.py}
    pattern: '\"observability\"'
  - name: tag-in-style-guide
    type: regex
    target: {source: file, path: docs/style.md}
    pattern: 'observability'
  - name: summary
    type: llm
    focus: trace
    criteria: |
      Judge the ADR the agent wrote, docs/adrs/adr-0045-*.md, as its last Write or Edit of that file in the trace shows it.
      Its Summary is one Y-statement with all six clauses in this order: "In the context of", "facing", "we decided for", "and neglected", "to achieve", "accepting that".
      Each clause is a phrase or two, not a paragraph; fail the Summary only if it runs clearly past 150 words, the longest of the recent accepted ADRs.
      No template comment or {…} placeholder is left, and the Details section has Context, Decision, Consequences and Alternatives, each filled with content about the decision in the task.
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    arm: 'with-only'
