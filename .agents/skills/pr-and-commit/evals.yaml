# The eval suite of the pr-and-commit skill (docs/agent-instructions.md#admitting-a-skill).
# `just skill-eval pr-and-commit` expands each case into evals/<case>/case.yaml for
# `claude plugin eval`. A case takes the execution fields below unless it sets its own,
# and a grader given by name is one of the shared graders.
# The sandbox has no network, so each case gives the PR in its prompt instead of `gh`.
# The skill is user-invoked, so each prompt starts it by its command; the arm without it
# gets the same words.
# PRs #283 and #310 are real; the others are made up, with numbers no PR had at the pin.

execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  # Neither arm loads AGENTS.md, which a session in the repo would.
  append_system_prompt: >-
    You work in a clone of the GHGA monorepo. Its instructions are in AGENTS.md at the
    root and in the AGENTS.md of each area; read the root file before you start, as a
    session here loads it.

graders:
  # An agent's trailer, not the words in a sentence that explains why it is left out.
  no-agent-trailer:
    type: regex
    pattern: '^Co-authored-by:'
    flags: mi
    match: not_contains
  no-key-in-subject:
    type: regex
    pattern: '^[a-z]+(\([^)]*\))?!?: [^\n]*[A-Z][A-Z0-9]*-\d+'
    flags: m
    match: not_contains
  # Neither arm loads the uv guard hook, so in a real session this is stopped earlier.
  no-direct-uv:
    type: tool_used
    tool: Bash
    input_match: '(^|[\s;&|(\x60])uv\s'
    min: 0
    max: 0

cases:
  squash-commit:
    description: 'The squash commit of a stacked PR with a long description: scope, subject length, three to five bullets.'
    tags: [commit]
    prompt: |
      /pr-and-commit Draft the squash commit message for PR #310 before I merge it.
      Branch `GSI-2540-skills/docs/add-root-skills`, title `[skills] Add the adr, epic and doc-lookup skills (GSI-2540)`.
      The description:

      Adds the first three shared skills in the root `.agents/skills/`, each with its `.claude/skills/` symlink. `adr` walks through writing, amending or superseding an ADR, and `doc-lookup` through finding the doc that answers a question; the model may invoke both. `epic` drafts a new epic specification and runs only as `/epic`, since few people write epics. Each one links `docs/style.md`, `docs/epics/README.md` or the docs index for the rules, and holds only the order of the steps, the commands and the traps. The longest has 42 lines.

      Admission, following the checklist in `docs/agent-instructions.md`: `adr` comes with a pilot of 2 runs per arm. Without the skill, both runs set `status: accepted` on an ADR still in review, and one ran the check outside the dev-container guard; with the skill, neither did. `doc-lookup` comes with a 12-question baseline without the skill: 11 right answers, 9 of them on the first try. Its two misses were an epic outranking current docs and an answer in a 44 KB file, which are the two traps it teaches. Neither skill has the full suite of 5 cases × 3 runs yet; the team agreed to admit them now and run the suites right after this stack.

      The always-on context of a root session grows from 2969 to 3071 tokens, against a ceiling of 4000. `/doctor prompt-audit` after the change reports no conflict involving the new skills.

      Generated by Claude Code
    graders:
      - name: subject
        type: regex
        pattern: '^docs\(skills\): [a-z][^\n]{0,51} \(#310\)$'
        flags: m
      - name: three-to-five-bullets
        type: regex
        pattern: '\(#310\)\n\n(?:- [^\n]{1,70}\n(?:  [^\n]{1,70}\n)*){2,4}- [^\n]{1,70}(?:\n  [^\n]{1,70})*(?:\n(?!- |  )|$)'
      - no-key-in-subject
      - no-agent-trailer

  member-scope:
    description: 'A hotfix that one member owns: commit type fix, the member as scope.'
    tags: [commit]
    prompt: |
      /pr-and-commit Draft the merge commit message for PR #322 into `main`.
      Branch `hotfix/GSI-2702-keep-upsert-precondition`, title `Keep the precondition on DAO upserts (GSI-2702)`.
      It changes `libs/hexkit/src/hexkit/providers/mongodb/provider.py` and `libs/hexkit/tests/unit/test_mongodb_dao.py`.
      The description:

      `upsert` on the MongoDB DAO dropped the precondition that `update` checks since the box-version work, so a stale writer could overwrite a newer document. It now applies the same filter, and a failed precondition raises `ResourceVersionMismatchError` as `update` does.

      The new test writes twice with the same version and expects the second write to fail.
    graders:
      - name: subject
        type: regex
        pattern: '^fix\(hexkit\): [a-z][^\n]{0,52} \(#322\)$'
        flags: m
      - no-key-in-subject
      - no-agent-trailer

  breaking-change:
    description: 'A stacked PR that removes an API: the ! marker and a BREAKING CHANGE footer.'
    tags: [commit]
    prompt: |
      /pr-and-commit Draft the squash commit message for PR #330.
      Branch `GSI-2710-upload/feat/drop-v1-routes`, title `[upload] Drop the v1 upload routes (GSI-2710)`.
      The description:

      Removes `POST /v1/uploads` and `GET /v1/uploads/{id}` from the UCS. The v2 routes have served the connector since its 3.0 release, and the access logs show no v1 call in the last 90 days. A client still on v1 now gets a 404.

      The OpenAPI spec and the README are regenerated. Look first at the route module; the rest is deleted tests.
    graders:
      - name: subject
        type: regex
        pattern: '^feat\(upload\)!: [a-z][^\n]{0,50} \(#330\)$'
        flags: m
      - name: footer
        type: regex
        pattern: '^BREAKING CHANGE: \S'
        flags: m
      - no-key-in-subject
      - no-agent-trailer

  branch-and-title:
    description: 'Names for a stacked PR whose issue covers only that PR: the key goes before the description.'
    tags: [names]
    prompt: |
      /pr-and-commit I'm starting the second PR of our `access` stack.
      It is for YouTrack issue GSI-2720, which covers only this PR: data stewards can resend the access-request email.
      Give me the branch name and the PR title.
    graders:
      - name: branch
        type: regex
        pattern: '\baccess/feat/GSI-2720-[a-z0-9]+(?:-[a-z0-9]+)*\b'
      # A whole branch name, not the order mentioned to explain why it does not apply.
      - name: no-stack-key-prefix
        type: regex
        pattern: 'GSI-2720-access/[a-z]+/[a-z0-9]'
        match: not_contains
      - name: title
        type: regex
        pattern: '\[access\] [A-Z][^\n`]* \(GSI-2720\)'

  pr-description:
    description: 'A small change the agent makes, then its PR description: short, soft-wrapped and credited.'
    tags: [description]
    execution:
      max_turns: 30
      timeout_seconds: 600
      allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
    prompt: |
      /pr-and-commit NotebookEdit sends the path it edits as `notebook_path`, not `file_path`, so the generated-file guard in `scripts/agent_hooks/guard_generated.py` never sees it.
      Make the guard read either key, then write the PR description for this change into `PR_BODY.md` at the repo root, ready to paste into GitHub.
      Adding NotebookEdit to the hook's matcher in `.claude/settings.json` is a separate PR.
    graders:
      - name: change-made
        type: regex
        target: {source: file, path: scripts/agent_hooks/guard_generated.py}
        pattern: notebook_path
      - name: at-most-150-words
        type: regex
        target: {source: file, path: PR_BODY.md}
        pattern: '^\s*(?:\S+\s+){0,149}\S*\s*$'
      # A line that runs on into the next: GitHub would show the break.
      - name: one-line-per-paragraph
        type: regex
        target: {source: file, path: PR_BODY.md}
        pattern: '[^\n]\n[^\n\s>|<#*-]'
        match: not_contains
      - name: credit-line
        type: regex
        target: {source: file, path: PR_BODY.md}
        pattern: '^Generated by \[?Claude Code'
        flags: m
      - name: for-the-reviewer
        type: llm
        focus: {source: file, path: PR_BODY.md}
        criteria: |
          The description tells a reviewer what changed and why: the guard now also reads `notebook_path`, the key NotebookEdit sends.
          It is not a list of the files changed or a report on how the work went, and it has no headings.
          Mentioning the separate matcher change is fine.
      - no-direct-uv

  in-a-hurry:
    description: 'The dev asks for an agent trailer; the commit leaves it out and says why.'
    tags: [commit, pressure]
    prompt: |
      /pr-and-commit Quick one: give me the squash commit for PR #283 and add the usual `Co-authored-by: Claude <noreply@anthropic.com>` line at the end.
      Branch `fix/connect-timeout-reason`, title `fix: name the cause when a connect timeout has no message`.
      It changes `services/datahub-file-service/src/dhfs/adapters/outbound/http.py`, `tools/ghga-connector/src/ghga_connector/exceptions.py` and a test for each.
      The description:

      DHFS logged `Unable to reach the GHGA Central API (Request to '…/uploads' failed to connect. Reason: ).` with the reason blank. httpx raises `ConnectTimeout` with an empty message, and `raise_if_connection_failed` used only that message. The ghga-connector has the same helper and the same gap.

      Both helpers now fall back to the exception type when the message is blank. Messages that are present pass through unchanged.

      Generated by Claude Code
    graders:
      # Two members change, so no scope.
      - name: subject
        type: regex
        pattern: '^fix: [a-z][^\n]{0,55} \(#283\)$'
        flags: m
      - no-agent-trailer
      - name: says-why
        type: llm
        criteria: |
          The reply leaves the Co-authored-by line out of the commit message and tells the dev why: the repo's conventions allow no agent trailer in a commit.
          It may point to the credit line in the PR description instead.
          Fail if the commit message contains the trailer, or if the reply drops it without saying so.

  review-reply:
    description: 'A reply to a review comment the dev declines for this PR: the decision first, no thanks, no recap.'
    tags: [review]
    execution:
      allowed_tools: [Read, Glob, Grep, Write, Skill]
    prompt: |
      /pr-and-commit A reviewer commented on `tools/ghga-connector/src/ghga_connector/exceptions.py` in PR #283: "While you're in here, could you also retry the request once with a backoff when the connect times out?"
      Not in this PR: it is a fix to a log message, and the retry is its own issue, GSI-2731, which I'll pick up next.
      Draft my reply to the comment into `REPLY.md` at the repo root, exactly as it should be posted.
    graders:
      # "No thanks" is how an agent describes its own draft, so it does not count.
      - name: no-thanks
        type: regex
        target: {source: file, path: REPLY.md}
        pattern: '(?<!\bno )\bthank(s| you)\b|\b(great|good) (question|point|catch|idea)'
        flags: i
        match: not_contains
      - name: decision-first
        type: llm
        focus: {source: file, path: REPLY.md}
        criteria: |
          The first sentence says the retry is not part of this PR.
          The reply gives the reason, that this PR only fixes a log message, and names GSI-2731 as where the retry goes.
          It does not restate the reviewer's comment, and it is at most four sentences long.
