# ---- derived from workspace metadata by create_charts.py — do not edit -----------------
image:
  registry: ghcr.io
  repository: ghga-de/ghga/ifrs
configPrefix: ifrs
commandStyle: exec
commandPrefix: ''
executable: ifrs

# ---- deployment values (services/ifrs/chart-values.yaml) -----------------
# Chart values for this member (deployment knowledge only).
# Derived facts — image, executable, configPrefix, command style — are stamped
# by the chart generator from workspace metadata (deploy/src/create_charts.py).
mongodb:
  dbName: internal-file-registry
# This parameter is used as Kafka's group id
serviceName: ifrs

config:
  mongo_dsn:
  object_storages: {}
  kafka_enable_dlq: true
  enable_opentelemetry: false
  db_version_collection: "ifrsDbVersions"
  migration_wait_sec: 10

executableArgs:
- consume-events

migrationInitContainer:
  executable: ifrs
  executableArgs:
  - migrate-db


_topics:
  fileDeletedEvent:
    # as producer
    topic:
      name: file_deleted_topic
      value: file-deletions
    types:
    - name: file_deleted_type
      value: internal_file_deleted
    kafkaUser:
      operations:
      - Write
  fileRegisteredEvent:
    # as producer
    topic:
      name: file_internally_registered_topic
      value: internal-registrations
    types:
    - name: file_internally_registered_type
      value: internal_file_registered
    kafkaUser:
      operations:
      - Write
  fileStagedEvent:
    # as producer
    topic:
      name: file_staged_topic
      value: staged-files
    types:
    - name: file_staged_type
      value: internal_file_staged
    kafkaUser:
      operations:
      - Write
  filesToDelete:
    # as consumer
    topic:
      name: file_deletion_request_topic
      value: purges
    type:
      name: file_deletion_request_type
      value: file_deletion_requested
    kafkaUser:
      operations:
      - Read
  filesToStage:
    # as consumer
    topic:
      name: files_to_stage_topic
      value: staging-requests
    type:
      name: files_to_stage_type
      value: file_staging_requested
    kafkaUser:
      operations:
      - Read
  # as producer
  deadLetterQueue:
    topic:
      name: kafka_dlq_topic
      value: dlq
    kafkaUser:
      operations:
      - Write
  # as consumer
  deadLetterQueueRetry:
    topic:
      name:
      value: retry
    kafkaUser:
      operations:
      - Read
  fileUpload:
    # as consumer
    topic:
      name: file_upload_topic
      value: file-uploads
    kafkaUser:
      operations:
      - Read
