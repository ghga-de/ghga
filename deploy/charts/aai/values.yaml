# Local AAI (ADR-0007). The default profile runs Navikt mock-oauth2-server: tiny,
# fully claim-configurable, mints tokens for arbitrary subjects (the test bed's
# "log in as X"). The issuer id below yields
#   http://<svc>:<port>/<issuerId>/.well-known/openid-configuration
# Services must trust exactly this issuer URL; the umbrella templates the
# auth-service and data-portal oidc_* settings from these values.

image:
  repository: ghcr.io/navikt/mock-oauth2-server
  tag: ""  # defaults to the chart appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# Route the issuer through the demo gateway at /<issuerId> (no rewrite — see
# templates/httproute.yaml). Enabled by the umbrella.
httpRoute:
  enabled: false
  parentRefs: []
  # rewrite the Host header on this route (see templates/httproute.yaml)
  rewriteHost: ""

issuerId: ghga

# JSON_CONFIG for mock-oauth2-server. interactiveLogin shows a login form that
# accepts a subject + free-form claims (name, email, ...) — mint email-shaped
# subs to satisfy the auth-service ext_id format (see the LS-Login assessment).
jsonConfig:
  interactiveLogin: true
  httpServer: NettyWrapper
  # inject the claims the auth adapter REQUIRES in access tokens but the mock
  # does not emit by default: client_id (the mock uses azp) and scope.
  # NB: issuerId here must match .Values.issuerId above.
  tokenCallbacks:
    - issuerId: ghga
      requestMappings:
        - requestParam: client_id
          match: "*"
          claims:
            client_id: ghga-client
            scope: openid profile email
            # a matching callback replaces the mock's default audience — set it back
            aud: [default]

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
