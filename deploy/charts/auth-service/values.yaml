# ---- derived from workspace metadata by create_charts.py — do not edit -----------------
image:
  registry: ghcr.io
  repository: ghga-de/ghga/auth-service
configPrefix: auth_service
commandStyle: exec
commandPrefix: ''
executable: auth-service

# ---- deployment values (services/auth-service/chart-values.yaml) -----------------
# Chart values for this member (deployment knowledge only).
# Derived facts — image, executable, configPrefix, command style — are stamped
# by the chart generator from workspace metadata (deploy/src/create_charts.py).
apiBasePath: /auth-ext/
# Name of the database
mongodb:
  dbName: auth-service
# This parameter is used as Kafka's group id
serviceName: auth-service

config:
  mongo_dsn:
  host: 0.0.0.0
  enable_opentelemetry: false
  db_version_collection: "authDbVersions"
  migration_wait_sec: 10

executableArgs: []

_topics:
  authEvents:
    # as producer
    topic:
      name: auth_topic
      value: auth
    types:
    - name: second_factor_recreated_type
      value: second_factor_recreated
    kafkaUser:
      operations:
      - Write
  ivaEvents:
    # as producer
    topic:
      name: iva_state_changed_topic
      value: ivas
    types:
    - name: iva_state_changed_type
      value: iva_state_changed
    - name: iva_send_code_type
      value: iva_send_code
    kafkaUser:
      operations:
      - Write

  datasetChangeEvent:
    # as consumer
    topic:
      name: dataset_change_topic
      value: metadata-datasets
    types:
    - name: dataset_deletion_type
      value: dataset_deleted
    - name: dataset_upsertion_type
      value: dataset_created
    kafkaUser:
      operations:
      - Read
  userEvents:
    # as producer
    topic:
      name: user_topic
      value: users
    kafkaUser:
      operations:
      - Write
