# ---- derived from workspace metadata by create_charts.py — do not edit -----------------
image:
  registry: ghcr.io
  repository: ghga-de/ghga/ucs
configPrefix: ucs
commandStyle: exec
commandPrefix: ''
executable: ucs

# ---- deployment values (services/ucs/chart-values.yaml) -----------------
# Chart values for this member (deployment knowledge only).
# Derived facts — image, executable, configPrefix, command style — are stamped
# by the chart generator from workspace metadata (deploy/src/create_charts.py).
apiBasePath: /ucs/
# Name of the database
mongodb:
  dbName: upload-controller

# This parameter is used as Kafka's group id
serviceName: ucs-consumer

config:
  mongo_dsn:
  host: "0.0.0.0"
  object_storages: {}
  kafka_enable_dlq: true
  enable_opentelemetry: false
  db_version_collection: "ucsDbVersions"
  migration_wait_sec: 10


executableArgs:
- run-rest
# cmd: ucs consume-events

_topics:
  fileUploadValidationSuccess:
    # as producer
    topic:
      name: file_interrogations_topic
      value: interrogations
    types:
    - name: interrogation_success_type
      value: file_interrogation_success
    - name: interrogation_failure_type
      value: file_interrogation_failed
    kafkaUser:
      operations:
      - Read
  filesToRegister:
    # as consumer
    topic:
      name: file_internally_registered_topic
      value: internal-registrations
    types:
    - name: file_internally_registered_type
      value: internal_file_registered
    kafkaUser:
      operations:
      - Read
  filesToDelete:
    # as consumer
    topic:
      name: file_deletion_request_topic
      value: purges
    type:
      name: file_deletion_request_type
      value: file_deletion_requested
    kafkaUser:
      operations:
      - Read
  deadLetterQueue:
  # as producer
    topic:
      name: kafka_dlq_topic
      value: dlq
    kafkaUser:
      operations:
      - Write
  deadLetterQueueRetry:
  # as consumer
    topic:
      name:
      value: retry
    kafkaUser:
      operations:
      - Read
  fileUpload:
    # as consumer
    topic:
      name: file_upload_topic
      value: file-uploads
    kafkaUser:
      operations:
      - Write
  uploadBoxTopic:
    # as consumer
    topic:
      name: file_upload_box_topic
      value: file-upload-boxes
    kafkaUser:
      operations:
      - Write
