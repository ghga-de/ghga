# Generated by create_charts.py — do not edit. Composition (later wins):
#   1. ghga-common library defaults (exports.defaults, flattened here: helm's
#      import-values is not processed for aliased chart instances, so the
#      defaults are baked in at generation time instead)
#   2. facts derived from workspace metadata
#   3. deployment values from services/reverse-transpiler-service/chart-values.yaml
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  _topics: {}
  _consumerGroup:
    operations:
    - Read
    resource:
      patternType: literal
      type: group

    # This is the actual Kubernetes `command` field
command: ["sh", "-c"]
commandPrefix: ''
commandStyle: exec
executable: rts
executableArgs:
- run-rest

deployment:
  enabled: true

job:
  enabled: false

cronjob:
  enabled: false

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
clusterDomain: cluster.local
annotations: {}
labels: {}
commonLabels: {}
commonAnnotations: {}
image:
  registry: ghcr.io
  repository: ghga-de/ghga/rts
  tag: ""
  digest: ""
  pullPolicy:
  pullSecrets: []
replicaCount: 1
revisionHistoryLimit: 1
shareProcessNamespace: false
podSecurityContext:
  fsGroup: 1000

initContainers: []
migrationInitContainer:
  enabled: false
  image: ""
  cmd: ["sh", "-c"]
  args: []
  env: []
  resources: {}
  volumeMounts: []
  executable: rts
  executableArgs:
  - migrate-db

# executableArgs:
#   - consume-events

hostAliases: []
podLabels: {}
podAnnotations: {}
podAffinityPreset: ""
podAntiAffinityPreset: soft
nodeAffinityPreset:
  type: ""
  key: ""
  values: []
affinity: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: ""
updateStrategy:
  type: RollingUpdate

podRestartPolicy: Always
cmd: ""
ports:
  enabled: false
  ports:
  - name: http
    containerPort: 8080
    protocol: TCP

livenessProbe:
  enabled: false
  tcpSocket:
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  enabled: false
  tcpSocket:
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 15

startupProbe:
  enabled: false

containerSecurityContext:
  enabled: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL
  seccompProfile:
    type: "RuntimeDefault"
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false

lifecycleHooks: {}
resources:
  limits:
    cpu: "1500m"
    memory: "2048M"
  requests:
    cpu: "1000m"
    memory: "1024M"

extraVolumes:
- name: tmp
  emptyDir: {}
extraVolumeMounts:
- name: tmp
  mountPath: /tmp
sidecars: []
envVars: []
envVarsConfigMap: ""
envVarsSecret: ""
service:
  enabled: true
  type: ClusterIP
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: http

serviceAccount:
  create: true

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 5
  targetCPU: 80
  targetMemory: 80
  metrics: []
ingress:
  enabled: false

topicPrefix: ""
_topics:
  artifactsEvent:
    # as consumer
    topic:
      name: artifact_topic
      value: artifacts
    kafkaUser:
      operations:
      - Read
  # as producer
  deadLetterQueue:
    topic:
      name: kafka_dlq_topic
      value: dlq
    kafkaUser:
      operations:
      - Write
  # as consumer
  deadLetterQueueRetry:
    topic:
      name:
      value: retry
    kafkaUser:
      operations:
      - Read

# openpyxl serializes spreadsheets via NamedTemporaryFile: the hardened image
# runs with a read-only root filesystem, so provide a writable /tmp
_consumerGroup:
  operations:
  - Read
  resource:
    patternType: literal
    type: group
kafkaTopicsParameters: true
kafkaUser:
  enabled: false
  clusterName: kafka
  clusterNamespace: strimzi
  caCertSecretName: kafka-cluster-ca-cert

mongodb:
  dbName: reverse-transpiler
  host: mongodb.mongodb.svc.cluster.local
  service:
    namespace: mongodb
    name: mongodb


apiBasePath: /rts/
serviceName: rts-consumer
serviceInstanceId: ""
serviceNameConsumer: ""
serviceInstanceIdConsumer: ""
configMap:
  enabled: true
  mountPath: /etc/config.yaml
  subPath: config.yaml
  envVar:
    enabled: true

config:
  host: "0.0.0.0"
  service_instance_id: 'rts_1'
  service_name: rts
  kafka_enable_dlq: true
  mongo_dsn:
  db_version_collection: rtsDbVersions
  migration_wait_sec: 10
  sheet_names:
    analyses: Analysis
    analysis_methods: AnalysisMethod
    analysis_method_supporting_files: AnalysisMethodSupportingFile
    studies: Study
    individuals: Individual
    individual_supporting_files: IndividualSupportingFile
    samples: Sample
    experiment_methods: ExperimentMethod
    experiment_method_supporting_files: ExperimentMethodSupportingFile
    experiments: Experiment
    research_data_files: ResearchDataFile
    process_data_files: ProcessDataFile
    datasets: Dataset
    data_access_policies: DataAccessPolicy
    data_access_committees: DataAccessCommittee
    publications: Publication

configPrefix: rts
enableServiceLinks: true
successfulJobsHistoryLimit: 5
environment:
  name: default

cluster:
  name: default

    # Set `spec` of HTTPRoute here
    # (`port` is the backend service port used by the default rule; it is consumed by
    # the template, not copied into `spec`)
httpRoute:
  enabled: false
  port: 8080
      # strip the base path before forwarding. Services that reconstruct their own
      # public URLs (an OIDC discovery document, for example) need the full path
      # instead and rely on api_root_path to route — set this to false for them.
  rewritePath: true
  rules: []
probe:
  enabled: false
  hostname: default.ghga.dev

healthEndpoint: "/health"
destinationRule:
  enabled: false

networkPolicy:
  enabled: false
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          ghga-ingress: allow

strimziApiVersion: kafka.strimzi.io/v1
vaultAgent:
  enabled: false
  annotations:
    vault.hashicorp.com/tls-skip-verify: "false"
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/agent-init-first: "true"
    vault.hashicorp.com/agent-cache-enable: "true"
    vault.hashicorp.com/agent-pre-populate-only: "false"
    vault.hashicorp.com/agent-run-as-same-user: "true"
  role: ""
  rolePrefix: ""
  caCert: ""
  tlsSecret: ""
  service: ""
  tlsServerName: ""
  pgrepPattern: python
  secrets:
    generic: {}
    mongodb:
      enabled: false
      secretPath: ""
      connectionString: "mongodb://{{username}}:{{password}}@mongodb:27017/admin"
    service:
      enabled: false
      secretPath: ""
      pathPrefix: operational-secrets/data/unique/apps/archive
    crypt4ghInternalPub:
      enabled: false
      secretPath: "operational-secrets/data/shared/managed-keys/crypt4gh-internal"
      mountPath: /keys/crypt4gh-internal/crypt4gh.pub
      dataKey: crypt4gh.pub
      renderToFile: true
      parameterName: CRYPT4GH_PUBLIC_KEY
    crypt4ghInternalPriv:
      enabled: false
      secretPath: "operational-secrets/data/shared/managed-keys/crypt4gh-internal"
      mountPath: /keys/crypt4gh-internal/crypt4gh.sec
      dataKey: crypt4gh.sec
      renderToFile: true
      parameterName: CRYPT4GH_PRIVATE_KEY
    crypt4ghExternalPriv:
      enabled: false
      secretPath: "operational-secrets/data/shared/managed-keys/crypt4gh-external"
      mountPath: /keys/crypt4gh-external/crypt4gh.sec
      dataKey: crypt4gh.sec
      renderToFile: true
      parameterName: CRYPT4GH_PRIVATE_KEY
