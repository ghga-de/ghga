# ---- derived from workspace metadata by create_charts.py — do not edit -----------------
image:
  registry: ghcr.io
  repository: ghga-de/ghga/pcs
configPrefix: pcs
commandStyle: exec
commandPrefix: ''
executable: pcs

# ---- deployment values (services/pcs/chart-values.yaml) -----------------
# Chart values for this member (deployment knowledge only).
# Derived facts — image, executable, configPrefix, command style — are stamped
# by the chart generator from workspace metadata (deploy/src/create_charts.py).
apiBasePath: /pcs/
# Name of the database
mongodb:
  dbName: purge-controller

# This parameter is used as Kafka's group id
serviceName: pcs-rest

config:
  host: 0.0.0.0
  mongo_dsn:
  db_name: pcs
  service_instance_id: rest.1
  token_hashes: []
  enable_opentelemetry: false
  db_version_collection: "pcsDbVersions"
  migration_wait_sec: 10

executableArgs:
- run-rest

_topics:
  filesToDelete:
    # as producer
    topic:
      name: file_deletion_request_topic
      value: purges
    type:
      name: file_deletion_request_type
      value: file_deletion_requested
    kafkaUser:
      operations:
      - Write
