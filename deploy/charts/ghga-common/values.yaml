# Per-key descriptions live in the sibling values.schema.json, not here - they're
# parsed from there (deploy/src/create_charts.py's library_docs()) into every derived
# chart's own values.schema.json; keeping them here too would just drift out of sync.
exports:
  defaults:
    global:
      imageRegistry: ""
      imagePullSecrets: []
      _topics: {}

    commandPrefix: /usr/local/bin/
    commandStyle: shell

    executable: ""
    executableArgs: []

    deployment:
      enabled: true

    job:
      enabled: false

    cronjobs:
      default:
        enabled: false

    nameOverride: ""

    fullnameOverride: ""

    namespaceOverride: ""

    annotations: {}

    labels: {}

    commonLabels: {}

    commonAnnotations: {}

    image:
      registry: docker.io
      repository: ""
      tag: ""
      digest: ""
      pullPolicy: null
      pullSecrets: []

    replicaCount: 1

    revisionHistoryLimit: 1

    shareProcessNamespace: false

    podSecurityContext:
      fsGroup: 1000

    initContainers: []

    migrationInitContainer:
      enabled: false
      image: ""
      imagePullPolicy: null
      executable: ""
      executableArgs: []
      env: []
      resources: {}
      volumeMounts: []

    hostAliases: []

    podLabels: {}

    podAnnotations: {}

    podAffinityPreset: ""

    podAntiAffinityPreset: soft

    nodeAffinityPreset:
      type: ""
      key: ""
      values: []

    affinity: {}

    nodeSelector: {}

    tolerations: []

    topologySpreadConstraints: []

    priorityClassName: ""

    schedulerName: ""

    terminationGracePeriodSeconds: ""

    updateStrategy:
      type: RollingUpdate

    podRestartPolicy: Always

    # Both the container spec's own `ports:` and the Service's `ports:` (and
    # NetworkPolicy's, if enabled) are built from this single map - one place to
    # keep in sync, not two. name -> port (bare number = TCP; {port, protocol} for
    # anything else) - a map, not a list, so a chart-values.yaml overlay can add or
    # override a single named port without repeating every other one (Helm/this
    # repo's own value composition merges map keys but replaces lists wholesale).
    # That cuts the other way too: `containerPorts: {}` in an overlay does NOT
    # clear this default - merging an empty map into {http: 8080} is still
    # {http: 8080}. To turn a default port off, null it by name instead:
    # `containerPorts: {http: null}` (Helm removes a key entirely when an
    # overlay sets it to null, rather than merging null in as a value).
    containerPorts:
      http: 8080

    livenessProbe:
      enabled: false
      tcpSocket:
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 15

    readinessProbe:
      enabled: false
      tcpSocket:
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 15

    # Like livenessProbe/readinessProbe above, `enabled` alone isn't enough to render
    # anything: the template only emits a probe when there's at least one field besides
    # `enabled` to render. tcpSocket/periodSeconds/failureThreshold below exist so
    # `startupProbe.enabled: true` actually works out of the box, the same way it does
    # for its two siblings - not just a documented no-op.
    startupProbe:
      enabled: false
      tcpSocket:
        port: 8080
      periodSeconds: 10
      failureThreshold: 30

    containerSecurityContext:
      enabled: true
      runAsUser: 1000
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: "RuntimeDefault"
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      allowPrivilegeEscalation: false

    lifecycleHooks: {}

    resources:
      limits:
        cpu: "1500m"
        memory: "2048M"
      requests:
        cpu: "1000m"
        memory: "1024M"

    extraVolumes: []

    extraVolumeMounts: []

    sidecars: []

    envVars: []

    envVarsConfigMap: ""

    envVarsSecret: ""

    service:
      enabled: true
      type: ClusterIP

    serviceAccount:
      create: true

    autoscaling:
      enabled: false
      minReplicas: 3
      maxReplicas: 5
      targetCPU: 80
      targetMemory: 80
      metrics: []

    topicPrefix: ""
    _topics: {}
    _consumerGroup:
      operations:
        - Read
      resource:
        patternType: literal
        type: group
    kafkaTopicsParameters: true

    kafkaUser:
      enabled: false
      clusterName: kafka
      clusterNamespace: strimzi
      caCertSecretName: kafka-cluster-ca-cert

    mongodb:
      dbName: ""
      service:
        namespace: mongodb
        name: mongodb

    apiBasePath: ""
    serviceName: ""

    serviceInstanceId:
      fromPodName: false

    configMap:
      enabled: true
      mountPath: /etc/config.yaml
      subPath: config.yaml
      envVar:
        enabled: true

    config: {}

    configPrefix: ""

    enableServiceLinks: true

    successfulJobsHistoryLimit: 5

    environment:
      name: default

    cluster:
      name: default

    httpRoute:
      enabled: false
      port: 8080
      rewritePath: true
      rules: []

    probe:
      enabled: false
      hostname: default.ghga.dev

    healthEndpoint: "/health"

    destinationRule:
      enabled: false

    networkPolicy:
      enabled: false
      ingress:
        - from:
          - namespaceSelector:
              matchLabels:
                ghga-ingress: allow

    strimziApiVersion: kafka.strimzi.io/v1
    vaultAgent:
      enabled: false
      annotations:
        vault.hashicorp.com/tls-skip-verify: "false"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-cache-enable: "true"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-run-as-same-user: "true"
      role: ""
      rolePrefix: ""
      caCert: ""
      tlsSecret: ""
      service: ""
      tlsServerName: ""
      pgrepPattern: python
      secrets:
        generic: {}
        mongodb:
          enabled: false
          secretPath: ""
          connectionString: "mongodb://{{username}}:{{password}}@mongodb:27017/admin"
        service:
          enabled: false
          secretPath: ""
          pathPrefix: operational-secrets/data/unique/apps/archive
        crypt4ghInternalPub:
          enabled: false
          secretPath: "operational-secrets/data/shared/managed-keys/crypt4gh-internal"
          mountPath: /keys/crypt4gh-internal/crypt4gh.pub
          dataKey: crypt4gh.pub
          renderToFile: true
          parameterName: CRYPT4GH_PUBLIC_KEY
        crypt4ghInternalPriv:
          enabled: false
          secretPath: "operational-secrets/data/shared/managed-keys/crypt4gh-internal"
          mountPath: /keys/crypt4gh-internal/crypt4gh.sec
          dataKey: crypt4gh.sec
          renderToFile: true
          parameterName: CRYPT4GH_PRIVATE_KEY
        crypt4ghExternalPriv:
          enabled: false
          secretPath: "operational-secrets/data/shared/managed-keys/crypt4gh-external"
          mountPath: /keys/crypt4gh-external/crypt4gh.sec
          dataKey: crypt4gh.sec
          renderToFile: true
          parameterName: CRYPT4GH_PRIVATE_KEY
