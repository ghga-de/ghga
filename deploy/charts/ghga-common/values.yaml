# Per-key descriptions live in the sibling values.schema.json, not here - they're
# parsed from there (deploy/src/create_charts.py's library_docs()) into every derived
# chart's own values.schema.json; keeping them here too would just drift out of sync.
exports:
  defaults:
    global:
      imageRegistry: ""
      imagePullSecrets: []
      localImageIds: {}

    commandPrefix: /usr/local/bin/
    commandStyle: shell

    executable: ""
    executableArgs: []

    deployment:
      enabled: true

    job:
      enabled: false

    cronjobs:
      default:
        enabled: false

    nameOverride: ""

    fullnameOverride: ""

    namespaceOverride: ""

    # Merged onto every rendered resource's metadata - Deployment, CronJob, Job,
    # Service, HPA, DestinationRule, HTTPRoute, Probe, ConfigMap, ServiceAccount,
    # NetworkPolicy, KafkaUser. There is deliberately no separate, narrower
    # per-workload-only labels/annotations value: Service is the one resource that
    # regularly needs its own (LB/ingress-controller annotations, scrape labels,
    # ...), and that's what service.labels/service.annotations below are for: for
    # anything else, add it here.
    commonLabels: {}

    commonAnnotations: {}

    image:
      registry: docker.io
      repository: ""
      tag: ""
      digest: ""
      pullPolicy: null
      pullSecrets: []

    replicaCount: 1

    revisionHistoryLimit: 1

    shareProcessNamespace: false

    secretEnvFiles:
      enabled: false
      dir: /vault/secrets

    podSecurityContext:
      fsGroup: 1000

    initContainers: []

    migrationInitContainer:
      enabled: false
      image: ""
      imagePullPolicy: null
      executable: ""
      executableArgs: []
      env: []
      resources: {}
      volumeMounts: []

    hostAliases: []

    podLabels: {}

    podAnnotations: {}

    podAffinityPreset: ""

    podAntiAffinityPreset: soft

    nodeAffinityPreset:
      type: ""
      key: ""
      values: []

    affinity: {}

    nodeSelector: {}

    tolerations: []

    topologySpreadConstraints: []

    priorityClassName: ""

    schedulerName: ""

    terminationGracePeriodSeconds: ""

    updateStrategy:
      type: RollingUpdate

    podRestartPolicy: Always

    # Both the container spec's own `ports:` and the Service's `ports:` (and
    # NetworkPolicy's, if enabled) are built from this single map - one place to
    # keep in sync, not two. name -> port (bare number = TCP; {port, protocol} for
    # anything else) - a map, not a list, so a chart-values.yaml overlay can add or
    # override a single named port without repeating every other one (Helm/this
    # repo's own value composition merges map keys but replaces lists wholesale).
    # That cuts the other way too: `containerPorts: {}` in an overlay does NOT
    # clear this default - merging an empty map into {http: 8080} is still
    # {http: 8080}. To turn a default port off, null it by name instead:
    # `containerPorts: {http: null}` (Helm removes a key entirely when an
    # overlay sets it to null, rather than merging null in as a value).
    containerPorts:
      http: 8080

    livenessProbe:
      enabled: false
      tcpSocket:
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 15

    # Ready means answering on the health endpoint, not just accepting connections:
    # a service that crashes once its dependencies fail still opens its port first.
    # Values that set another handler, such as `tcpSocket`, replace this `httpGet`.
    readinessProbe:
      enabled: false
      httpGet:
        path: "{{ .Values.healthEndpoint }}"
        port: http
      initialDelaySeconds: 30
      periodSeconds: 15

    # Like livenessProbe/readinessProbe above, `enabled` alone isn't enough to render
    # anything: the template only emits a probe when there's at least one field besides
    # `enabled` to render. tcpSocket/periodSeconds/failureThreshold below exist so
    # `startupProbe.enabled: true` actually works out of the box, the same way it does
    # for its two siblings - not just a documented no-op.
    startupProbe:
      enabled: false
      tcpSocket:
        port: 8080
      periodSeconds: 10
      failureThreshold: 30

    containerSecurityContext:
      enabled: true
      runAsUser: 1000
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: "RuntimeDefault"
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      allowPrivilegeEscalation: false

    lifecycleHooks: {}

    resources:
      limits:
        cpu: "1500m"
        memory: "2048M"
      requests:
        cpu: "1000m"
        memory: "1024M"

    extraVolumes: []

    extraVolumeMounts: []

    sidecars: []

    envVars: []

    envVarsConfigMap: ""

    envVarsSecret: ""

    service:
      enabled: true
      type: ClusterIP
      # Also applied to DestinationRule, which shares the Service's own address.
      labels: {}
      annotations: {}

    serviceAccount:
      create: true

    autoscaling:
      enabled: false
      minReplicas: 3
      maxReplicas: 5
      targetCPU: 80
      targetMemory: 80
      metrics: []

    topicPrefix: ""
    _topics: {}
    _consumerGroup:
      operations:
        - Read
      resource:
        patternType: literal
        type: group
    kafkaTopicsParameters: true

    kafkaUser:
      enabled: false
      clusterName: kafka
      clusterNamespace: strimzi
      caCertSecretName: kafka-cluster-ca-cert

    mongodb:
      dbName: ""

    apiBasePath: ""
    serviceName: ""

    serviceInstanceId:
      fromPodName: false

    configMap:
      enabled: true
      mountPath: /etc/config.yaml
      subPath: config.yaml
      envVar:
        enabled: true

    config: {}

    configPrefix: ""

    enableServiceLinks: true

    successfulJobsHistoryLimit: 5

    # What a cronjob does when a run is still active at the next schedule.
    # Forbid skips the new run, so hung runs cannot pile up.
    concurrencyPolicy: Forbid
    # Kill a cronjob run after this many seconds; null means no limit.
    activeDeadlineSeconds: null
    # Skip a cronjob run that could not start within this many seconds of its schedule.
    startingDeadlineSeconds: null

    httpRoute:
      enabled: false
      port: 8080
      rewritePath: true
      rules: []

    probe:
      enabled: false
      hostname: default.ghga.dev

    healthEndpoint: "/health"

    destinationRule:
      enabled: false

    networkPolicy:
      enabled: false
      ingress:
        - from:
          - namespaceSelector:
              matchLabels:
                ghga-ingress: allow

    strimziApiVersion: kafka.strimzi.io/v1
