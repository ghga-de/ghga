name: auth-km-jobs
description: GHGA Auth Key Management Jobs - refreshes signing keys and re-encrypts secrets used by GHGA; runs as a Kubernetes Job, either regularly or on demand.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: "15.3.0"

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "15.3.0"

# The major version of the API. Minor versions and patches are not relevant as they do not
# introduce breaking changes.
apiVersion: v2

dependencies:
# templates only — the library's default VALUES are flattened into each generated
# chart's values.yaml by the generator (import-values breaks under helm aliases)
- name: ghga-common
  version: 2.x.x
  repository: file://../ghga-common
