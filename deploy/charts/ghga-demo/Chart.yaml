name: ghga-demo
description: Self-contained GHGA — single-command umbrella bundling the app charts,
  an Envoy Gateway edge with real ext-authz, and lightweight operator-free infra
  (ADR-0006/0012). The same artifact is the per-PR test bed.
type: application
version: 0.1.0
appVersion: "0.0.0+dev"
apiVersion: v2

dependencies:
  # ---- edge (ADR-0012): Gateway API + Envoy, no mesh, no sidecars ----------------------
  - name: gateway-helm
    alias: envoy-gateway
    version: 1.8.3
    repository: oci://docker.io/envoyproxy
    condition: envoy-gateway.enabled

  # ---- lightweight infra (ADR-0006): operator-free stand-ins ---------------------------
  # kafka/mongodb/minio are plain templates in this chart (official images) — the
  # bitnami subcharts were dropped when the 2025 catalogue gating broke their pulls
  - name: aai
    version: 0.1.0
    repository: file://../aai
    condition: aai.enabled
  # testbed profile only (values-testbed.yaml): the original GHGA test OP whose
  # POST /login mints tokens non-interactively — the BDD auth fixtures use it as-is
  - name: test-oidc-provider
    version: ">=0.0.0-0"
    repository: file://../test-oidc-provider
    condition: test-oidc-provider.enabled

  # ---- app charts (generated; grow this list as demo config wiring lands) --------------
  # auth-service deploys twice, as in prod: the ext-authz adapter and the registry
  # APIs (users/claims/access) — selected via config.provide_apis per alias.
  - name: auth-service
    alias: auth-adapter
    version: ">=0.0.0-0"
    repository: file://../auth-service
    condition: auth-adapter.enabled
  - name: auth-service
    alias: auth-rest
    version: ">=0.0.0-0"
    repository: file://../auth-service
    condition: auth-rest.enabled
  - name: auth-service
    alias: auth-claims
    version: ">=0.0.0-0"
    repository: file://../auth-service
    condition: auth-claims.enabled
  - name: wkvs
    version: ">=0.0.0-0"
    repository: file://../wkvs
    condition: wkvs.enabled
  - name: ekss
    version: ">=0.0.0-0"
    repository: file://../ekss
    condition: ekss.enabled
  - name: dcs
    version: ">=0.0.0-0"
    repository: file://../dcs
    condition: dcs.enabled
  - name: ucs
    version: ">=0.0.0-0"
    repository: file://../ucs
    condition: ucs.enabled
  - name: fis
    version: ">=0.0.0-0"
    repository: file://../fis
    condition: fis.enabled
  # one DHFS per data hub: polls FIS for files to interrogate and re-encrypts
  # them into that hub's interrogation bucket
  - name: dhfs
    alias: dhfs-primary
    version: ">=0.0.0-0"
    repository: file://../dhfs
    condition: dhfs-primary.enabled
  - name: dhfs
    alias: dhfs-secondary
    version: ">=0.0.0-0"
    repository: file://../dhfs
    condition: dhfs-secondary.enabled
  - name: ifrs
    version: ">=0.0.0-0"
    repository: file://../ifrs
    condition: ifrs.enabled
  - name: pcs
    version: ">=0.0.0-0"
    repository: file://../pcs
    condition: pcs.enabled
  - name: wps
    version: ">=0.0.0-0"
    repository: file://../wps
    condition: wps.enabled
  - name: rs
    version: ">=0.0.0-0"
    repository: file://../rs
    condition: rs.enabled
  - name: metldata
    version: ">=0.0.0-0"
    repository: file://../metldata
    condition: metldata.enabled
  - name: rts
    version: ">=0.0.0-0"
    repository: file://../rts
    condition: rts.enabled
  - name: wps
    alias: wps-consumer
    version: ">=0.0.0-0"
    repository: file://../wps
    condition: wps-consumer.enabled
  - name: mass
    alias: mass-consumer
    version: ">=0.0.0-0"
    repository: file://../mass
    condition: mass-consumer.enabled
  - name: ars
    alias: ars-consumer
    version: ">=0.0.0-0"
    repository: file://../ars
    condition: ars-consumer.enabled
  - name: dcs
    alias: dcs-consumer
    version: ">=0.0.0-0"
    repository: file://../dcs
    condition: dcs-consumer.enabled
  - name: dins
    alias: dins-consumer
    version: ">=0.0.0-0"
    repository: file://../dins
    condition: dins-consumer.enabled
  - name: rs
    alias: rs-consumer
    version: ">=0.0.0-0"
    repository: file://../rs
    condition: rs-consumer.enabled
  - name: ucs
    alias: ucs-consumer
    version: ">=0.0.0-0"
    repository: file://../ucs
    condition: ucs-consumer.enabled
  - name: fis
    alias: fis-consumer
    version: ">=0.0.0-0"
    repository: file://../fis
    condition: fis-consumer.enabled
  - name: rts
    alias: rts-consumer
    version: ">=0.0.0-0"
    repository: file://../rts
    condition: rts-consumer.enabled
  - name: ars
    version: ">=0.0.0-0"
    repository: file://../ars
    condition: ars.enabled
  - name: mass
    version: ">=0.0.0-0"
    repository: file://../mass
    condition: mass.enabled
  - name: dins
    version: ">=0.0.0-0"
    repository: file://../dins
    condition: dins.enabled
  - name: ns
    version: ">=0.0.0-0"
    repository: file://../ns
    condition: ns.enabled
  - name: nos
    version: ">=0.0.0-0"
    repository: file://../nos
    condition: nos.enabled
  - name: dlqs
    version: ">=0.0.0-0"
    repository: file://../dlqs
    condition: dlqs.enabled
  # consumes the dead-letter topic and stores the events for inspection
  - name: dlqs
    alias: dlqs-consumer
    version: ">=0.0.0-0"
    repository: file://../dlqs
    condition: dlqs-consumer.enabled
  - name: sms
    version: ">=0.0.0-0"
    repository: file://../sms
    condition: sms.enabled
  - name: data-portal
    version: ">=0.0.0-0"
    repository: file://../data-portal
    condition: data-portal.enabled
