# Local-image overlay for kind-in-devcontainer installs:
#   helm upgrade --install ghga deploy/charts/ghga-demo -f deploy/charts/ghga-demo/values-local.yaml
# Images are built by `just demo-images` as ghcr.io/ghga-de/ghga/<package>:local
# and loaded into the kind node; tag 'local' + IfNotPresent keeps the cluster
# from ever pulling them. Only the tag differs from the generated defaults.

