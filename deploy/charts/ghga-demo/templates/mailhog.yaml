{{- /*
Demo SMTP sink (ADR-0006). Same image the compose test bed used; the notification
service points at smtp://<release>-mailhog:1025, the web UI on :8025 is reachable
via port-forward (the UI does not support path-prefix serving, so it is not routed
through the gateway).
*/ -}}
{{- if .Values.mailhog.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mailhog
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mailhog
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailhog
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailhog
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mailhog
          image: {{ .Values.mailhog.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mailhog
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mailhog
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: mailhog
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
{{- end }}
