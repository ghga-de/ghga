{{- /*
SMS-gateway mock (lox24) for the notification service, mirroring the compose
test bed's wiremock + single send-sms stub. Internal only (ns calls it); the
compose /api/lox24 edge route existed for test-bed inspection and is not
carried over.
*/ -}}
{{- if .Values.lox24Mock.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-lox24-mock
  namespace: {{ .Release.Namespace }}
data:
  send-sms.json: |
    {
      "request": {
        "method": "POST",
        "urlPath": "/sms",
        "headers": {
          "Content-Type": {"contains": "application/json"},
          "X-LOX24-AUTH-TOKEN": {"matches": ".*"}
        },
        "bodyPatterns": [
          {"matchesJsonPath": "$.phone"},
          {"matchesJsonPath": "$.text"},
          {"matchesJsonPath": "$.sender_id"}
        ]
      },
      "response": {
        "status": 201,
        "headers": {"Content-Type": "application/json"},
        "jsonBody": {"status": "queued"}
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-lox24-mock
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: lox24-mock
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lox24-mock
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lox24-mock
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: wiremock
          image: {{ .Values.lox24Mock.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: mappings
              mountPath: /home/wiremock/mappings
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: mappings
          configMap:
            name: {{ .Release.Name }}-lox24-mock
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-lox24-mock
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: lox24-mock
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
