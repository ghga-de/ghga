{{- if (index .Values "envoy-gateway").enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# Proxy infrastructure settings: bare clusters (kind/minikube) have no
# LoadBalancer, so the generated envoy Service defaults to NodePort (ADR-0012).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gateway.name }}-proxy-config
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # stable in-cluster name: the auth adapter reaches the aai THROUGH the
        # gateway (hostname-rewritten) for issuer-consistent discovery/userinfo
        name: {{ .Values.gateway.name }}-gateway
        type: {{ .Values.gateway.service.type }}
        {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  nodePort: {{ .Values.gateway.service.nodePort }}
        {{- end }}
{{- end }}
