{{- /*
MinIO on Chainguard's minimal image (replaces the gated bitnami subchart). A companion
Job creates the hub buckets with mc, both shell-free — the Job has no wait loop of its
own, so backoffLimit/restartPolicy below do the retrying until MinIO answers. Ephemeral
by design; console on :9001 via port-forward.
*/ -}}
{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          imagePullPolicy: IfNotPresent
          args: [server, /data, --address, ":9000", --console-address, ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.rootPassword | quote }}
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.minio.service.type }}
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: 9000
      targetPort: api
      {{- if and (eq .Values.minio.service.type "NodePort") .Values.minio.service.nodePort }}
      nodePort: {{ .Values.minio.service.nodePort }}
      {{- end }}
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-minio-buckets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio-buckets
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.minio.mcImage }}
          imagePullPolicy: IfNotPresent
          args:
            - mb
            - --ignore-existing
            {{- range .Values.minio.buckets }}
            - local/{{ . }}
            {{- end }}
          env:
            - name: MC_HOST_local
              value: {{ printf "http://%s:%s@%s-minio:9000" (.Values.minio.rootUser | urlquery) (.Values.minio.rootPassword | urlquery) .Release.Name | quote }}
{{- end }}
