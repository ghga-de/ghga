{{- if (index .Values "envoy-gateway").enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  # proxy infrastructure (NodePort service etc.) attaches HERE: Envoy Gateway
  # reconciles Gateway-level parametersRef reliably, the GatewayClass-level
  # attachment was observed to be ignored (EG 1.8.3)
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ .Values.gateway.name }}-proxy-config
  listeners: {{- toYaml .Values.gateway.listeners | nindent 4 }}
{{- end }}
