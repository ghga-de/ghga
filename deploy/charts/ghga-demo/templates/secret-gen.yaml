{{- /*
Pre-install secret generation (ADR-0006/0016): plain K8s Secrets for the demo,
replacing the vault-based auth-km-jobs flow. Idempotent — existing secrets are
kept, so keys stay stable across upgrades. The generator runs our shell-less
auth-km-jobs image: `command:` overrides the image entrypoint, and python is on
the image PATH, so `python -c` works without a shell.
*/ -}}
{{- if .Values.secretGen.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-secret-gen
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-secret-gen
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-secret-gen
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-secret-gen
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-secret-gen
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-secret-gen
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-secret-gen
      restartPolicy: Never
      initContainers:
        - name: generate
          image: "{{ .Values.secretGen.image.repository }}:{{ .Values.secretGen.image.tag }}"
          imagePullPolicy: {{ .Values.secretGen.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              # Full demo key matrix — the compose test bed's set_env.sh fan-out is the
              # specification, with two deliberate upgrades: distinct signing pairs per
              # role (compose reused one), and per-service bearer tokens (compose reused
              # one). Raw tokens land in a harness secret for the test bed.
              import base64, json, os, pathlib
              from auth_km_jobs.jwks import generate_internal_jwk
              from auth_km_jobs.c4gh import generate_crypt4gh_key_pair
              from auth_km_jobs.tokens import generate_simple_token

              env_dir = pathlib.Path("/shared/env")
              files_dir = pathlib.Path("/shared/files")
              env_dir.mkdir(parents=True)
              files_dir.mkdir(parents=True)

              def jwk_pair():
                  key = generate_internal_jwk()
                  return key.export_private(), key.export_public()

              def write(name, **entries):
                  text = "".join(f"{k}={v}\n" for k, v in entries.items())
                  (env_dir / f"{name}.env").write_text(text)

              int_priv, int_pub = jwk_pair()      # internal auth tokens
              # ONE signing identity for the whole work-order family: wps signs
              # "view"/upload work orders that ucs validates against the REGISTRY
              # key, so wps and rs must be indistinguishable to the validators
              # (the reference deployment does the same). dhfs joins it as there.
              wot_priv, wot_pub = jwk_pair()
              wps_priv = rs_priv = dhfs_priv = wot_priv
              wps_pub = rs_pub = dhfs_pub = wot_pub
              c4gh = generate_crypt4gh_key_pair() # archive file encryption
              totp = base64.b64encode(os.urandom(32)).decode()
              tokens = {name: generate_simple_token()
                        for name in ("metldata", "fis", "sms", "pcs", "dlqs")}

              write("{{ .Release.Name }}-auth-keys-priv",
                    AUTH_SERVICE_AUTH_KEY=int_priv,
                    AUTH_SERVICE_TOTP_ENCRYPTION_KEY=totp)
              write("{{ .Release.Name }}-auth-keys-pub", AUTH_SERVICE_AUTH_KEY=int_pub)
              write("{{ .Release.Name }}-ars-keys", ARS_AUTH_KEY=int_pub)
              write("{{ .Release.Name }}-wps-keys",
                    WPS_AUTH_KEY=int_pub, WPS_WORK_PACKAGE_SIGNING_KEY=wps_priv)
              write("{{ .Release.Name }}-rs-keys",
                    RS_AUTH_KEY=int_pub, RS_WORK_ORDER_SIGNING_KEY=rs_priv)
              write("{{ .Release.Name }}-dcs-keys", DCS_AUTH_KEY=wps_pub)
              write("{{ .Release.Name }}-ucs-keys",
                    UCS_WPS_AUTH_CONFIG=json.dumps(
                        {"auth_key": wps_pub, "auth_check_claims": {}}),
                    UCS_RS_AUTH_CONFIG=json.dumps(
                        {"auth_key": rs_pub, "auth_check_claims": {}}))
              write("{{ .Release.Name }}-fis-keys",
                    FIS_TOKEN_HASHES=json.dumps([tokens["fis"].hash]),
                    FIS_DATA_HUB_AUTH_KEYS=json.dumps(
                        {"primary": dhfs_pub, "secondary": dhfs_pub}))
              write("{{ .Release.Name }}-dhfs-keys",
                    DHFS_DATA_HUB_SIGNING_KEY=dhfs_priv,
                    DHFS_CENTRAL_API_CRYPT4GH_PUBLIC_KEY=c4gh.export_public())
              write("{{ .Release.Name }}-wkvs-keys",
                    WKVS_CRYPT4GH_PUBLIC_KEYS=json.dumps(
                        {"primary": c4gh.export_public(),
                         "secondary": c4gh.export_public()}))
              write("{{ .Release.Name }}-metldata-keys",
                    METLDATA_LOADER_TOKEN_HASHES=json.dumps(
                        [tokens["metldata"].hash]))
              write("{{ .Release.Name }}-pcs-keys",
                    PCS_TOKEN_HASHES=json.dumps([tokens["pcs"].hash]))
              write("{{ .Release.Name }}-sms-keys",
                    SMS_TOKEN_HASHES=json.dumps([tokens["sms"].hash]))
              write("{{ .Release.Name }}-dlqs-keys",
                    DLQS_TOKEN_HASHES=json.dumps([tokens["dlqs"].hash]))
              write("{{ .Release.Name }}-harness-tokens",
                    **{f"{name.upper()}_TOKEN": tok.token
                       for name, tok in tokens.items()})

              def pem(kind, body):
                  return (f"-----BEGIN CRYPT4GH {kind} KEY-----\n"
                          f"{body}\n-----END CRYPT4GH {kind} KEY-----\n")

              (files_dir / "crypt4gh.sec").write_text(
                  pem("PRIVATE", c4gh.export_private()))
              (files_dir / "crypt4gh.pub").write_text(
                  pem("PUBLIC", c4gh.export_public()))
              print("demo key material written")
          volumeMounts:
            - name: shared
              mountPath: /shared
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: apply
          image: "{{ .Values.secretGen.kubectlImage.repository }}:{{ .Values.secretGen.kubectlImage.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              exists() { kubectl get secret "$1" > /dev/null 2>&1; }
              for f in /shared/env/*.env; do
                name=$(basename "$f" .env)
                if exists "$name"; then
                  echo "secret $name exists, keeping it"
                else
                  kubectl create secret generic "$name" --from-env-file="$f"
                fi
              done
              if exists {{ .Release.Name }}-c4gh-files; then
                echo "secret {{ .Release.Name }}-c4gh-files exists, keeping it"
              else
                kubectl create secret generic {{ .Release.Name }}-c4gh-files \
                  --from-file=/shared/files/crypt4gh.sec \
                  --from-file=/shared/files/crypt4gh.pub
              fi
          env:
            # kubectl cache/config land in HOME; run as a plain uid with a
            # writable one (the image defaults to root, which runAsNonRoot rejects)
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: shared
              mountPath: /shared
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: shared
          emptyDir:
            medium: Memory
{{- end }}
