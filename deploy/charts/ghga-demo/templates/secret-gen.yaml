{{- /*
Pre-install secret generation (ADR-0006/0016): plain K8s Secrets for the demo,
replacing the vault-based auth-km-jobs flow. Idempotent — existing secrets are
kept, so keys stay stable across upgrades. The generator runs our shell-less
auth-km-jobs image: `command:` overrides the image entrypoint, and python is on
the image PATH, so `python -c` works without a shell.
*/ -}}
{{- if .Values.secretGen.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-secret-gen
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-secret-gen
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-secret-gen
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-secret-gen
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-secret-gen
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-secret-gen
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-secret-gen
      restartPolicy: Never
      initContainers:
        - name: generate
          image: "{{ .Values.secretGen.image.repository }}:{{ .Values.secretGen.image.tag }}"
          imagePullPolicy: {{ .Values.secretGen.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import base64, os
              from auth_km_jobs.jwks import generate_internal_jwk
              key = generate_internal_jwk()
              totp = base64.b64encode(os.urandom(32)).decode()
              with open("/shared/auth-priv.env", "w") as f:
                  f.write(f"AUTH_SERVICE_AUTH_KEY={key.export_private()}\n")
                  f.write(f"AUTH_SERVICE_TOTP_ENCRYPTION_KEY={totp}\n")
              with open("/shared/auth-pub.env", "w") as f:
                  f.write(f"AUTH_SERVICE_AUTH_KEY={key.export_public()}\n")
              print("demo key material written")
          volumeMounts:
            - name: shared
              mountPath: /shared
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: apply
          image: "{{ .Values.secretGen.kubectlImage.repository }}:{{ .Values.secretGen.kubectlImage.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - |
              create() {
                if kubectl get secret "$1" > /dev/null 2>&1; then
                  echo "secret $1 exists, keeping it"
                else
                  kubectl create secret generic "$1" --from-env-file="$2"
                fi
              }
              create {{ .Release.Name }}-auth-keys-priv /shared/auth-priv.env
              create {{ .Release.Name }}-auth-keys-pub /shared/auth-pub.env
          volumeMounts:
            - name: shared
              mountPath: /shared
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: shared
          emptyDir:
            medium: Memory
{{- end }}
