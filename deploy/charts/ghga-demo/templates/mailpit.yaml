{{- /*
Demo SMTP sink (ADR-0028). The notification service points at
smtp://<release>-mailpit:1025, the web UI and API on :8025 are reachable via
port-forward (not routed through the gateway).
ns logs in over plain SMTP, which Mailpit refuses unless told to accept any login.
*/ -}}
{{- if .Values.mailpit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mailpit
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mailpit
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
{{- end }}
