rs-consumer:
  enabled: true
  nameOverride: rs-consumer
  executableArgs:
  - consume-events
  service:
    enabled: false
  envVarsSecret: ghga-rs-keys
  config:
    service_instance_id: consumer.1
    kafka_servers:
    - ghga-kafka:9092
    mongo_dsn: mongodb://ghga-mongodb:27017
    access_url: http://ghga-auth-claims:8080
    ucs_url: http://ghga-ucs:8080

ucs-consumer:
  enabled: true
  nameOverride: ucs-consumer
  executableArgs:
  - consume-events
  service:
    enabled: false
  envVarsSecret: ghga-ucs-keys
  config:
    service_instance_id: consumer.1
    kafka_servers:
    - ghga-kafka:9092
    mongo_dsn: mongodb://ghga-mongodb:27017
    object_storages:
      primary:
        bucket: hub1-inbox
        credentials:
          s3_endpoint_url: http://ghga-minio:9000
          s3_access_key_id: demo-access-key
          s3_secret_access_key: demo-secret-key
      secondary:
        bucket: hub2-inbox
        credentials:
          s3_endpoint_url: http://ghga-minio:9000
          s3_access_key_id: demo-access-key
          s3_secret_access_key: demo-secret-key

fis-consumer:
  enabled: true
  nameOverride: fis-consumer
  executableArgs:
  - consume-events
  service:
    enabled: false
  envVarsSecret: ghga-fis-keys
  config:
    service_instance_id: consumer.1
    kafka_servers:
    - ghga-kafka:9092
    mongo_dsn: mongodb://ghga-mongodb:27017
    ekss_api_url: http://ghga-ekss:8080
    dhfs_version_constraint: '>2.0.0'
