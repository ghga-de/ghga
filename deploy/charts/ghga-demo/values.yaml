# ghga-demo — self-contained profile (ADR-0006). Install as release "ghga":
#   helm install ghga deploy/charts/ghga-demo
# Bare clusters have no LoadBalancer: the gateway service defaults to NodePort
# (set gateway.nodePort, or use port-forward).
#
# NOTE on bitnami images: since the 2025 Bitnami catalogue changes, chart-default
# image repositories may point at gated "secure" images. If pulls fail at install
# time, override the image repositories to the bitnamilegacy/ equivalents.

# ---- edge -------------------------------------------------------------------------------
envoy-gateway:
  enabled: true

gateway:
  # GatewayClass + Gateway + (NodePort) EnvoyProxy config rendered by this chart
  className: ghga
  name: ghga
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
  service:
    type: NodePort
    # fixed NodePort for reproducible access (30080 within kind/minikube range)
    nodePort: 30080

# Envoy ext-authz against the auth adapter — mirrors the prod envoyExtAuthzHttp
# contract (headers below are verbatim from the hub's extensionProvider).
extAuth:
  enabled: true
  # HTTPRoutes to protect, by subchart alias — resource names are derived as
  # <release>-<alias>. Prod scopes ext-authz to /api/* — that covers the two auth
  # routes; wkvs (/.well-known) and the data-portal SPA (/) stay unprotected.
  targetRoutes:
    - auth-rest
    - dcs
    - ucs
    - fis
    - rs
    - wps
    - pcs
    - metldata
  backend:
    # the auth adapter's ext-authz backend (subchart alias + service port)
    chart: auth-adapter
    port: 8080
  headersToExtAuth:
    - x-authorization
    - x-csrf-token
    - cookie
    - authorization
  headersToBackend:
    - cookie
    - x-authorization
    - x-csrf-token
    - x-session
    - x-request-id
    - authorization

# ---- lightweight infra ------------------------------------------------------------------
kafka:
  enabled: true
  controller:
    replicaCount: 1
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
  extraConfig: |
    auto.create.topics.enable=true

mongodb:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

minio:
  enabled: true
  mode: standalone
  auth:
    rootUser: demo-access-key
    rootPassword: demo-secret-key
  # the compose test bed runs two localstack "hubs"; the demo collapses both onto
  # this one MinIO, keeping the hub1/hub2 bucket split
  provisioning:
    enabled: true
    buckets:
      - name: hub1-inbox
      - name: hub1-outbox
      - name: hub1-interrogations
      - name: hub1-permanent
      - name: hub2-inbox
      - name: hub2-outbox
      - name: hub2-interrogations
      - name: hub2-permanent

# demo SMTP sink (UI on :8025 via port-forward; same image as the compose test bed)
mailhog:
  enabled: true
  image: mailhog/mailhog:v1.0.1

# vault dev-mode: functional backend for ekss (KV API), NOT secret injection
vault:
  enabled: true
  image: hashicorp/vault:1.18
  rootToken: dev-token
  # AppRole bootstrap for ekss (fixed demo credentials, as in the compose test bed)
  bootstrapEkss: true
  ekssPath: testing
  ekssRoleId: 9f03d595-c964-441c-a68e-2e1534f2bb56
  ekssSecretId: a3e80b1d-86d3-4c23-85ee-589031ec2cba

aai:
  enabled: true
  # expose the issuer through the gateway at /<issuerId> so browser and cluster
  # agree on one issuer URL (no rewrite — see the aai chart)
  httpRoute:
    enabled: true
    parentRefs:
      - name: ghga

# ---- demo secrets (ADR-0006/0016) --------------------------------------------------------
# Pre-install Job generating plain K8s Secrets (internal auth JWK pair + TOTP key);
# idempotent, keys stay stable across upgrades. The generator runs the auth-km-jobs
# image; tags are set by the install tooling (locally built images or a release tag).
secretGen:
  enabled: true
  image:
    repository: ghcr.io/ghga-de/ghga/auth-km-jobs
    tag: latest
    pullPolicy: IfNotPresent
  kubectlImage:
    repository: bitnami/kubectl
    tag: "1.33.4"

# ---- app charts (demo wiring; grows service by service) ---------------------------------
# In-cluster names below assume release name "ghga" (see header): the config block
# is plain YAML — ghga-common does not template it.

# The ext-authz adapter (prod: Service ext-authz:8080). Serves the session/login
# API at /api/auth; the gateway consults it for every protected route.
auth-adapter:
  enabled: true
  nameOverride: auth-adapter
  # the private internal signing key (+ TOTP key) from the secret-gen Job
  envVarsSecret: ghga-auth-keys-priv
  httpRoute:
    enabled: true
    port: 8080
    parentRefs:
      - name: ghga
  ports:
    enabled: true
  config:
    provide_apis: ["ext_auth"]
    kafka_servers: ["ghga-kafka:9092"]
    service_instance_id: "1"
    mongo_dsn: mongodb://ghga-mongodb:27017
    # in-cluster discovery/JWKS/userinfo; the issuer string must match the iss
    # claim of browser-minted tokens, i.e. the gateway-facing URL of the aai
    oidc_authority_url: http://ghga-aai:8080/ghga/
    oidc_userinfo_endpoint: http://ghga-aai:8080/ghga/userinfo
    oidc_issuer: http://localhost:30080/ghga
    oidc_client_id: ghga-client

# The user registry / claims / access APIs.
auth-rest:
  enabled: true
  nameOverride: auth-rest
  # the portal's auth_url — compose routes /api/auth to the users instance
  apiBasePath: /api/auth
  # verification only: the public half of the internal signing key
  envVarsSecret: ghga-auth-keys-pub
  httpRoute:
    enabled: true
    port: 8080
    parentRefs:
      - name: ghga
  ports:
    enabled: true
  config:
    provide_apis: ["users", "claims", "access"]
    kafka_servers: ["ghga-kafka:9092"]
    service_instance_id: "1"
    mongo_dsn: mongodb://ghga-mongodb:27017
    oidc_authority_url: http://ghga-aai:8080/ghga/
    oidc_userinfo_endpoint: http://ghga-aai:8080/ghga/userinfo
    oidc_issuer: http://localhost:30080/ghga
    oidc_client_id: ghga-client
    # seed data steward (ADR-0006) — applied by the claims API at startup;
    # log in via the aai with exactly this email-shaped subject
    add_as_data_stewards:
      - ext_id: data.steward@ghga.dev
        name: Data Steward
        email: data.steward@ghga.dev
        iva_type: Phone
        iva_value: "+49 123 456789"

wkvs:
  enabled: true
  envVarsSecret: ghga-wkvs-keys
  httpRoute:
    enabled: true
    port: 8080
    parentRefs:
      - name: ghga
  ports:
    enabled: true

data-portal:
  enabled: true
  httpRoute:
    enabled: true
    port: 8080
    parentRefs:
      - name: ghga
  ports:
    enabled: true
  config:
    # browser-facing URLs: everything goes through the gateway NodePort
    base_url: http://localhost:30080
    oidc_authority_url: http://localhost:30080/ghga
    oidc_client_id: ghga-client
    oidc_use_discovery: true
    oidc_account_url: http://localhost:30080/ghga/debugger

# ---- file + metadata path (compose test bed configs, adapted to the demo infra) ----------
# Common substitutions: kafka -> ghga-kafka:9092, mongodb -> ghga-mongodb, the two
# localstack hubs -> the single ghga-minio, ums -> ghga-auth-rest, ekss -> ghga-ekss.
# Routes take the prod base paths from each member's chart-values, prefixed with /api.
# Topic wiring comes from each chart's _topics (prod values), not repeated here.

ekss:
  enabled: true
  ports:
    enabled: true
  config:
    host: 0.0.0.0
    port: 8080
    service_instance_id: rest.1
    vault_url: http://ghga-vault:8200
    vault_path: testing
    vault_role_id: 9f03d595-c964-441c-a68e-2e1534f2bb56
    vault_secret_id: a3e80b1d-86d3-4c23-85ee-589031ec2cba
    server_private_key_path: /keys/crypt4gh.sec
  extraVolumes:
    - name: c4gh
      secret:
        secretName: ghga-c4gh-files
  extraVolumeMounts:
    - name: c4gh
      mountPath: /keys
      readOnly: true

dcs:
  enabled: true
  apiBasePathPrefix: /api
  envVarsSecret: ghga-dcs-keys
  httpRoute:
    enabled: true
    port: 8080
    parentRefs:
      - name: ghga
  ports:
    enabled: true
  config:
    service_instance_id: "1"
    kafka_servers: ["ghga-kafka:9092"]
    mongo_dsn: mongodb://ghga-mongodb:27017
    ekss_base_url: http://ghga-ekss:8080
    drs_server_uri: drs://localhost:30080/
    presigned_url_expires_after: 30
    object_storages:
      primary:
        bucket: hub1-outbox
        credentials:
          s3_endpoint_url: http://ghga-minio:9000
          s3_access_key_id: demo-access-key
          s3_secret_access_key: demo-secret-key
      secondary:
        bucket: hub2-outbox
        credentials:
