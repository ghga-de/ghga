# ghga-demo — self-contained profile (ADR-0006). Install as release "ghga":
#   helm install ghga deploy/charts/ghga-demo
# Bare clusters have no LoadBalancer: the gateway service defaults to NodePort
# (set gateway.nodePort, or use port-forward).
#
# NOTE on bitnami images: since the 2025 Bitnami catalogue changes, chart-default
# image repositories may point at gated "secure" images. If pulls fail at install
# time, override the image repositories to the bitnamilegacy/ equivalents.

# ---- edge -------------------------------------------------------------------------------
envoy-gateway:
  enabled: true

gateway:
  # GatewayClass + Gateway + (NodePort) EnvoyProxy config rendered by this chart
  className: ghga
  name: ghga
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
  service:
    type: NodePort
    # fixed NodePort for reproducible access (30080 within kind/minikube range)
    nodePort: 30080

# Envoy ext-authz against the auth adapter — mirrors the prod envoyExtAuthzHttp
# contract (headers below are verbatim from the hub's extensionProvider).
extAuth:
  enabled: true
  # HTTPRoutes to protect, by subchart alias — resource names are derived as
  # <release>-<alias>. Prod scopes ext-authz to /api/* — that covers the two auth
  # routes; wkvs (/.well-known) and the data-portal SPA (/) stay unprotected.
  # session-based APIs only: services doing their own bearer-token auth
  # (metldata loader, fis, pcs, dlqs, sms) stay OUT of ext-auth — the adapter's
  # allow-response scrubs Authorization/X-Authorization (empty value = header
  # removal in envoy), so their tokens would never arrive
  targetRoutes:
    - auth-rest
    - dcs
    - ucs
    - rs
    - wps
    - ars
    - mass
    - dins
    - rts
  backend:
    # the auth adapter's ext-authz backend (subchart alias + service port)
    chart: auth-adapter
    port: 8080
  headersToExtAuth:
    - x-authorization
    - x-csrf-token
    - cookie
    - authorization
  headersToBackend:
    - cookie
    - x-authorization
    - x-csrf-token
    - x-session
    - x-request-id
    - authorization

# ---- lightweight infra ------------------------------------------------------------------
kafka:
  enabled: true
  # single-node KRaft on the official image; PLAINTEXT + topic auto-create as in
  # the compose test bed (see templates/kafka.yaml)
  image: apache/kafka:3.9.1
  # fixed KRaft cluster id (any base64-ish 22 chars; fixed so restarts reuse storage)
  clusterId: GhgaDemoKafkaCluster00

mongodb:
  enabled: true
  image: mongo:8.2

minio:
  enabled: true
  image: minio/minio:latest
  mcImage: minio/mc:latest
  rootUser: demo-access-key
  rootPassword: demo-secret-key
  # the compose test bed runs two localstack "hubs"; the demo collapses both onto
  # this one MinIO, keeping the hub1/hub2 bucket split
  buckets:
    - hub1-inbox
    - hub1-outbox
    - hub1-interrogations
    - hub1-permanent
    - hub2-inbox
    - hub2-outbox
    - hub2-interrogations
    - hub2-permanent

# demo SMTP sink (UI on :8025 via port-forward; same image as the compose test bed)
mailhog:
  enabled: true
  image: mailhog/mailhog:v1.0.1

# SMS-gateway mock for the notification service (wiremock + compose's stub)
lox24Mock:
  enabled: true
  image: wiremock/wiremock:3.13.2

# vault dev-mode: functional backend for ekss (KV API), NOT secret injection
vault:
  enabled: true
  image: hashicorp/vault:1.18
  rootToken: dev-token
  # AppRole bootstrap for ekss (fixed demo credentials, as in the compose test bed)
  bootstrapEkss: true
  ekssPath: testing
  ekssRoleId: 9f03d595-c964-441c-a68e-2e1534f2bb56
  ekssSecretId: a3e80b1d-86d3-4c23-85ee-589031ec2cba

# the original GHGA test OP — enabled only by the testbed profile
test-oidc-provider:
  enabled: false

aai:
  enabled: true
  # expose the issuer through the gateway at /<issuerId> so browser and cluster
  # agree on one issuer URL (no rewrite — see the aai chart)
  httpRoute:
    enabled: true
    parentRefs:
      - name: ghga
    rewriteHost: localhost

# ---- demo secrets (ADR-0006/0016) --------------------------------------------------------
# Pre-install Job generating plain K8s Secrets (internal auth JWK pair + TOTP key);
# idempotent, keys stay stable across upgrades. The generator runs the auth-km-jobs
# image; tags are set by the install tooling (locally built images or a release tag).
secretGen:
  enabled: true
  image:
    repository: ghcr.io/ghga-de/ghga/auth-km-jobs
    tag: latest
    pullPolicy: IfNotPresent
  kubectlImage:
    # alpine/k8s: kubectl + a shell (bitnami/kubectl is catalogue-gated)
    repository: alpine/k8s
    tag: "1.33.4"

# ---- app charts (demo wiring; grows service by service) ---------------------------------
# In-cluster names below assume release name "ghga" (see header): the config block
# is plain YAML — ghga-common does not template it.

# The ext-authz adapter (prod: Service ext-authz:8080). Serves the session/login
# API at /api/auth; the gateway consults it for every protected route.
auth-adapter:
  enabled: true
  nameOverride: auth-adapter
  # the private internal signing key (+ TOTP key) from the secret-gen Job
  envVarsSecret: ghga-auth-keys-priv
  httpRoute:
    enabled: true
    port: 8080
    parentRefs:
      - name: ghga
  ports:
    enabled: true
  config:
    provide_apis: ["ext_auth"]
    # Endpoints with their own auth (bearer work-package / work-order / service
    # tokens) or no auth at all must reach the backend with their Authorization
    # header INTACT — the ext-auth allow-response otherwise blanks it. Mirrors
    # the production auth-adapter config (devops-kubernetes-hub).
    allow_read_paths:
      # services or endpoints with custom auth mechanisms
      - /api/dlqs/*
      - /api/pcs/*
      - /api/wps/work-packages/*
      - /api/sms/*
      - /api/fis/storages/*
      - /api/ucs/health
      - /api/ucs/boxes/*
      # services or endpoints that do not need auth
      - /api/rts/*
      - /api/dins/*
      - /.well-known/*
      - /service-logo.png
      - /api/ga4gh/drs/v1/health
      - /api/ga4gh/drs/v1/objects/*
    allow_write_paths:
      - /api/fis/federated/*
      - /api/metldata/rpc/load-artifacts
      - /api/wps/work-packages/*
      - /api/sms/*
      - /api/pcs/*
      - /api/fis/legacy/*
      - /api/dlqs/*
      - /api/fis/storages/*
      - /api/ucs/boxes/*
    kafka_servers: ["ghga-kafka:9092"]
    service_instance_id: "1"
    mongo_dsn: mongodb://ghga-mongodb:27017
    # discovery/JWKS/userinfo go THROUGH the gateway (stable envoy service name,
    # Host rewritten to 'localhost' on the aai route) so the issuer the mock
    # derives is byte-identical for browser and cluster: http://localhost/ghga
    oidc_authority_url: http://ghga-gateway/ghga/
    oidc_userinfo_endpoint: http://ghga-gateway/ghga/userinfo
    oidc_issuer: http://localhost/ghga
    oidc_client_id: ghga-client

# The user registry / claims / access APIs.
auth-rest:
  enabled: true
  nameOverride: auth-rest
  # the portal's auth_url — compose routes /api/auth to the users instance
  apiBasePath: /api/auth
  # verification only: the public half of the internal signing key
  envVarsSecret: ghga-auth-keys-pub
  httpRoute:
    enabled: true
    port: 8080
    parentRefs:
      - name: ghga
  ports:
    enabled: true
  config:
    # users API only: the access API lives with the claims API on the internal
    # instance, so exactly ONE instance seeds the data steward (two instances
    # seeding concurrently on an empty database each create their own user for
    # the same external ID)
    provide_apis: ["users"]
    kafka_servers: ["ghga-kafka:9092"]
    service_instance_id: "1"
    mongo_dsn: mongodb://ghga-mongodb:27017
    oidc_authority_url: http://ghga-gateway/ghga/
    oidc_userinfo_endpoint: http://ghga-gateway/ghga/userinfo
    oidc_issuer: http://localhost/ghga
    oidc_client_id: ghga-client

# The claims repository API: deliberately NOT gateway-routed (prod topology —
# the testbed asserts /users/{id}/claims is unreachable from outside). Owns the
# data-steward seeding, which the claims API applies at startup.
auth-claims:
  enabled: true
  nameOverride: auth-claims
  envVarsSecret: ghga-auth-keys-pub
  ports:
    enabled: true
  config:
    provide_apis: ["claims", "access"]
    kafka_servers: ["ghga-kafka:9092"]
    service_instance_id: "1"
    mongo_dsn: mongodb://ghga-mongodb:27017
    oidc_authority_url: http://ghga-aai:8080/ghga/
    oidc_userinfo_endpoint: http://ghga-aai:8080/ghga/userinfo
    oidc_issuer: http://localhost/ghga
    oidc_client_id: ghga-client
    # seed data steward (ADR-0006) — log in via the aai with exactly this subject
    add_as_data_stewards:
      - ext_id: data.steward@ghga.dev
        name: Data Steward
        email: data.steward@ghga.dev
        iva_type: Phone
        iva_value: "+4915112345678"

wkvs:
  enabled: true
  envVarsSecret: ghga-wkvs-keys
  config:
    service_instance_id: rest.1
    # URLs wkvs SERVES to external clients (connector, DSKit): must be
    # gateway-reachable, not in-cluster names
    dcs_api_url: http://localhost/api/ga4gh/drs/v1
    ucs_api_url: http://localhost/api/ucs
    wps_api_url: http://localhost/api/wps
    storage_aliases:
      primary: http://ghga-minio:9000
      secondary: http://ghga-minio:9000
    storage_labels:
      primary: Primary
      secondary: Secondary
  httpRoute:
    enabled: true
    port: 8080
    parentRefs:
      - name: ghga
  ports:
    enabled: true

data-portal:
  enabled: true
  httpRoute:
    enabled: true
    port: 8080
    parentRefs:
      - name: ghga
  ports:
    enabled: true
  config:
    # browser-facing URLs (the kind config maps the gateway to the Mac's port 80)
    base_url: http://localhost
    oidc_authority_url: http://localhost/ghga
    oidc_client_id: ghga-client
    oidc_use_discovery: true
    oidc_account_url: http://localhost/ghga/debugger

