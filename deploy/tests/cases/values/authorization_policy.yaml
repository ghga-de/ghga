authorizationPolicy:
  enabled: true
  callers:
    caller:
      - methods: ["GET"]
        paths: ["/health"]
        ports: [8080]
    other-ns:
      - allowAll: true
    multi:
      - methods: ["POST"]
        paths: ["/items"]
      - methods: ["DELETE"]
        paths: ["/items/{*}"]
  identities:
    other-ns:
      namespace: elsewhere
      serviceAccount: other-sa
  extraRules:
    - from:
        - source:
            principals: ["cluster.local/ns/{{ .Release.Namespace }}-ingress/sa/gateway"]
    - when:
        - key: request.headers[x-test]
          values: ["yes"]
