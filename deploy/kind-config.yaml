# Local/CI integration cluster (ADR-0009/0017 as amended: kind runs in the
# devcontainer's inner docker daemon; ports are published through the nested
# chain and reach the browser on the host computer because the devcontainer
# shares the host network namespace — see .devcontainer/devcontainer.json for
# what each container runtime needs before that last hop works).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ghga
nodes:
  - role: control-plane
    extraPortMappings:
      # the demo gateway NodePort, published on the host computer's port 80: the OIDC
      # issuer authority must be byte-identical from the browser and from
      # inside the cluster, and the in-cluster path (envoy hostname rewrite)
      # cannot carry a port — a port-less authority (http://localhost) is the
      # only configuration where both sides agree.
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      # the MinIO S3 API. Published under the SAME authority the cluster uses
      # internally ('ghga-minio:9000') so the connector and DSKit can follow the
      # pre-signed URLs services hand out: the signature binds the host, so it
      # cannot be rewritten to localhost on the way out. The name is mapped to
      # 127.0.0.1 by the devcontainer (--add-host) or by `just testbed-hosts`.
      - containerPort: 30900
        hostPort: 9000
        protocol: TCP
