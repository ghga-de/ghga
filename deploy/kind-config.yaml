# Local/CI integration cluster (ADR-0009/0017 as amended: kind runs in the
# devcontainer's inner docker daemon; ports are published through the nested
# chain and reach the Mac browser via OrbStack's port forwarding).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ghga
nodes:
  - role: control-plane
    extraPortMappings:
      # the demo gateway NodePort, published on the Mac's port 80: the OIDC
      # issuer authority must be byte-identical from the browser and from
      # inside the cluster, and the in-cluster path (envoy hostname rewrite)
      # cannot carry a port — a port-less authority (http://localhost) is the
      # only configuration where both sides agree.
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
