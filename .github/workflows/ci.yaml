# CI Stage 1 — the component gate (runbook §5).
#
# Lint the whole repo, then type-check + test exactly the workspace targets affected by
# the change set, including transitive dependents of changed internal libraries
# (scripts/affected_targets.py). Python suites run their testcontainers against the
# runner's native Docker daemon. The integration gate (Stage 2) and the release workflow
# stay dormant until charts land / publish targets are decided.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Repo-wide lint: covers every member plus root-level code (scripts/, docs snippets)
  # in one cheap pass; --locked also asserts uv.lock is in sync with the pyprojects.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.affected.outputs.python }}
      frontend: ${{ steps.affected.outputs.frontend }}
      devcontainer: ${{ steps.affected.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the merge-base diff
      - id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            json=$(python3 scripts/affected_targets.py --base "$base")
          else
            # branch creation / force push: no usable base -> check everything
            json=$(python3 scripts/affected_targets.py --all)
          fi
          echo "affected: $json"
          split() { echo "$json" | python3 -c "
          import json, sys
          targets = json.load(sys.stdin)['targets']
          roots = sys.argv[1:]
          print(json.dumps([t for t in targets if t.split('/')[0] in roots]))
          " "$@"; }
          echo "python=$(split libs services tools)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(split frontend)" >> "$GITHUB_OUTPUT"
          # testbed / deploy targets are exercised by the integration gate (Stage 2).

          # The dev container is not a workspace member, so affected_targets.py does not see
          # it; diff it directly off the same base. No usable base -> check it, matching the
          # check-everything fallback above.
          if git cat-file -e "$base^{commit}" 2> /dev/null \
            && git diff --quiet "$base" -- .devcontainer; then
            echo "devcontainer=false" >> "$GITHUB_OUTPUT"
          else
            echo "devcontainer=true" >> "$GITHUB_OUTPUT"
          fi

  check-python:
    # lint is a dependency so its uv sync populates the shared uv cache once;
    # the matrix jobs then restore with an exact hit and never race to save it.
    # (Also fails fast: a lint failure doesn't burn ~30 matrix runners.)
    needs: [discover, lint]
    if: ${{ needs.discover.outputs.python != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.python) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      - name: mypy
        # the shared runner, so CI, `just typecheck` and the pre-commit hook check the
        # same thing: the member's src AND its test package(s), in one invocation
        run: uv run python scripts/typecheck.py "${{ matrix.target }}"
      - name: pytest
        # cwd = member dir: each member is its own pytest rootdir (the `tests`
        # packages collide across members otherwise)
        working-directory: ${{ matrix.target }}
        run: uv run pytest -q --durations=10

  check-frontend:
    needs: discover
    if: ${{ needs.discover.outputs.frontend != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.frontend) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: ${{ matrix.target }}/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.target }}/pnpm-lock.yaml
      - working-directory: ${{ matrix.target }}
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build
        # Playwright E2E is part of the integration gate (Stage 2), not this one.

  # The dev container is otherwise unvalidated by CI, and it is the one artifact that, when
  # broken, costs every developer their environment rather than a red check. This builds it
  # on any .devcontainer change and asserts the properties a plain `docker build` would not
  # reveal.
  #
  # Deliberately partial: `devcontainer build` applies neither runArgs nor mounts nor
  # postCreateCommand, and this runner is amd64. So it covers base-image resolution and
  # feature installation only — it would have caught the Debian 13 moby incompatibility, but
  # it cannot say anything about docker-in-docker at runtime, kind, --net=host, or the arm64
  # path. Those still need a local rebuild.
  check-devcontainer:
    needs: discover
    if: ${{ needs.discover.outputs.devcontainer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: npm install -g @devcontainers/cli
      - name: Build the dev container image
        run: devcontainer build --workspace-folder . --image-name ghga-devcontainer:ci
      # The script goes in on stdin via a quoted heredoc rather than `bash -lc '...'`:
      # inside single quotes an apostrophe in a comment silently ends the string, so the
      # rest of the assertions are never passed to the container and the failure points
      # nowhere near the cause. <<'SCRIPT' passes the body through untouched.
      - name: Assert the image provides what the repo assumes
        run: |
          docker run --rm -i ghga-devcontainer:ci bash -l -s <<'SCRIPT'
          set -eux
          # The bootstrap interpreter must carry the stdlib, not just python3-minimal:
          # the justfile image recipes and scripts/*.py import tomllib.
          python3 -c "import tomllib, json"
          node --version && pnpm --version && uv --version
          # Working tools the whole monorepo leans on: fd/rg/bat/jq for navigating and
          # inspecting a tree this size, shellcheck/shfmt for the shell the repo runs on
          # (justfile recipes, .devcontainer/post-create.sh, scripts/migration, testbed),
          # dig for the container's several competing sources of name resolution. dig
          # arrives via docker-in-docker too, so this also catches that feature dropping
          # it. One at a time: `command -v a b c` exits 0 even when some are missing.
          for t in fd bat rg jq shellcheck shfmt dig; do command -v "$t"; done
          # docker/Dockerfile uses `RUN --mount=type=cache`, so the image builds the repo
          # publishes depend on BuildKit being available, not just a docker CLI.
          docker buildx version
          docker compose version
          SCRIPT

  # TODO (ADR-0002, separable): per-library standalone matrix across supported Python
  # versions, validating the *published* combination alongside the integrated one.
