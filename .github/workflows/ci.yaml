# CI Stage 1 — the component gate (runbook §5).
#
# Lint the whole repo, then type-check + test exactly the workspace targets affected by
# the change set, including transitive dependents of changed internal libraries
# (scripts/affected_targets.py). Python suites run their testcontainers against the
# runner's native Docker daemon. A change to an image's Dockerfile additionally has that
# image built (check-images) — the only place a base-image bump is actually verified;
# images-gate is the always-reported check that makes it enforceable. Affected PyPI-lane
# members are additionally tested: the member's own wheel, plus a wheel for each internal
# dependency releasing alongside it, against every other dependency resolved from the
# index — across the supported Python range. published-combo-gate is its always-reported
# check, for the same reason images-gate is. Separately, check-pypi-drift fails the run if
# a lane member's shipped content changed without its version moving past the index, which
# is what keeps a version number denoting one thing in a platform image and on PyPI.
# Stage 2 (integration.yaml) runs as its own workflow.
#
# A step that has a `just` recipe calls it, so running the recipe locally runs the step.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

# Keyed on the branch's role, not on the event type. Releases are cut from the two
# long-lived branches (ADR-0038: final tags on `main`, release candidates on `dev`), and
# release.yaml requires the tagged commit's OWN CI run to be green — a cancelled run never
# is — so runs on both group by commit and are never cancelled. Every other ref groups by
# ref and the newest push wins: a superseded run there proves nothing about a commit anyone
# will release. Asking "is this a release branch?" rather than "is this a PR?" is what lets
# a candidate be cut from `dev` at any moment without racing the next merge into it.
concurrency:
  group: ci-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  # Repo-wide lint: covers every member plus root-level code (scripts/, docs snippets)
  # in one cheap pass; --locked also asserts uv.lock is in sync with the pyprojects.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just sync --locked
      - run: just lint

  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.affected.outputs.python }}
      frontend: ${{ steps.affected.outputs.frontend }}
      images: ${{ steps.affected.outputs.images }}
      image-builds: ${{ steps.affected.outputs.image-builds }}
      devcontainer: ${{ steps.affected.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the merge-base diff
      - id: affected
        # testbed / deploy targets are exercised by the integration gate (Stage 2), and the
        # image matrix takes bare image names, so a skipped job's check is titled plainly;
        # scripts/ci_discover.py says how each output is derived.
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 scripts/ci_discover.py --base "$BASE" | tee -a "$GITHUB_OUTPUT"

  check-python:
    # lint is a dependency so its uv sync populates the shared uv cache once;
    # the matrix jobs then restore with an exact hit and never race to save it.
    # (Also fails fast: a lint failure doesn't burn ~30 matrix runners.)
    needs: [discover, lint]
    if: ${{ needs.discover.outputs.python != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.python) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just sync --locked
      - name: mypy
        # the shared runner, so CI, `just typecheck` and the pre-commit hook check the
        # same thing: the member's src AND its test package(s), in one invocation
        run: just typecheck "${{ matrix.target }}"
      - name: pytest
        run: just test "${{ matrix.target }}"

  check-frontend:
    needs: discover
    if: ${{ needs.discover.outputs.frontend != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.frontend) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ matrix.target }}/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24  # held at the LTS line, see docs/dependencies.md
          cache: pnpm
          cache-dependency-path: ${{ matrix.target }}/pnpm-lock.yaml
      - uses: extractions/setup-just@v4
      # The fe-* recipes name the one front-end member; the matrix stays so the check
      # keeps its title.
      - run: just fe-check

  # Everything the shared pre-commit config checks that no other job covers: whitespace,
  # YAML/JSON validity, exec bits, private keys, large files. ruff, rumdl, mypy, eslint
  # and prettier are SKIPped here because `lint`, `check-python` and `check-frontend` already
  # run them -- this job must not make CI pay for them twice. no-commit-to-branch is
  # skipped because CI legitimately runs on both long-lived branches, `main` and `dev`,
  # which is exactly what that hook forbids a developer from committing to.
  #
  # Runs `pre-commit` from the workspace's own pin rather than pre-commit/action, which
  # would provision a second Python and a second pre-commit version.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      # the full sync: the chart check below imports the generator's dependencies, and
      # `uv run pre-commit` resolves against the same environment
      - run: just sync --locked
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # `hooks-all` skips no-commit-to-branch itself and adds these to it
      - run: just hooks-all --show-diff-on-failure --color=always
        env:
          SKIP: ruff,ruff-format,rumdl,mypy,fe-prettier,fe-eslint
      # check-python's matrix only covers libs/services/tools, and mypy is SKIPped above,
      # so the Python that belongs to no member would otherwise never be type-checked here.
      - name: mypy (non-member Python)
        run: just typecheck scripts deploy/src testbed
      # check-python's matrix covers members only, so the suites belonging to no
      # member run here. (testbed's suite is Stage 2's, not this job's.)
      - name: pytest (non-member Python)
        run: just test scripts/tests deploy/tests
      # The generated charts must stay a pure function of their sources: if they are not,
      # the whitespace hooks and `just charts` undo each other forever (ADR-0036).
      #
      # The version is an input to the generator (ADR-0027), so no version is pinned here:
      # a bare run reuses the committed one and fails if the member charts disagree on it.
      - name: charts are reproducible
        run: |
          just charts
          git diff --exit-code

  # The dev container is otherwise unvalidated by CI, and it is the one artifact that, when
  # broken, costs every developer their environment rather than a red check. This builds it
  # on any .devcontainer change and asserts the properties a plain `docker build` would not
  # reveal.
  #
  # Deliberately partial: `devcontainer build` applies neither runArgs nor mounts nor
  # postCreateCommand, and this runner is amd64. So it covers base-image resolution and
  # feature installation only — it would have caught the Debian 13 moby incompatibility, but
  # it cannot say anything about docker-in-docker at runtime, kind, --net=host, or the arm64
  # path. Those still need a local rebuild.
  check-devcontainer:
    needs: discover
    if: ${{ needs.discover.outputs.devcontainer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: npm install -g @devcontainers/cli
      - name: Build the dev container image
        run: devcontainer build --workspace-folder . --image-name ghga-devcontainer:ci
      - name: Assert the image provides what the repo assumes
        run: docker run --rm -i ghga-devcontainer:ci bash -l -s < .devcontainer/check-image.sh

  # Build the images whose Dockerfile changed. Nothing else in this workflow runs
  # `docker build`, so a base-image bump (Renovate editing PYTHON_BASE / NODE_BASE) is
  # otherwise verified only by the integration gate — a kind cluster plus the
  # BDD/Playwright suite, a slow and very indirect way to learn that a tag was never
  # published or that a hardened base dropped something the runtime needs.
  #
  # Build commands stay in the justfile (the same recipes dev-images, release and
  # security-scan call), so the dockerfile / context / registry-name mapping is never
  # duplicated into a workflow. Nothing is pushed: no packages: write, no GHCR login.
  check-images:
    needs: discover
    if: ${{ needs.discover.outputs.images != '[]' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      DHI_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v4
      # The hardened bases (dhi.io) are auth-gated — same pattern as dev-images.yaml:
      # skipped when the org secrets are absent, i.e. on PRs from forks. There is no
      # anonymous fallback (dhi.io answers an unauthenticated manifest request with a
      # 401), so such a PR fails at the base pull rather than building against some
      # public stand-in. A visible 401 is the readable outcome; a fork PR that cannot
      # reach the base cannot honestly report that its image builds.
      - name: Login to DHI registry
        if: ${{ env.DHI_USER != '' }}
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # --pull is the point of the check: resolve the base against the registry instead
      # of whatever manifest the runner happens to have cached. The tag is throwaway.
      - name: Build ${{ matrix.image }}
        run: just ${{ fromJSON(needs.discover.outputs.image-builds)[matrix.image] }} ci --pull

  # THE check to require in branch protection ("Protected Main" ruleset -> require status
  # checks -> `ci / images-gate`). It exists because a required check must always report:
  # this workflow runs on every pull request, but check-images above is gated by `if:`,
  # and a job that never starts can leave its check missing rather than skipped — which
  # would block every unrelated PR forever. This job always runs and translates
  # "no image affected" into an explicit pass.
  images-gate:
    needs: [discover, check-images]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        run: |
          d='${{ needs.discover.result }}'
          b='${{ needs.check-images.result }}'
          echo "discover=$d check-images=$b"
          case "$d:$b" in
            success:success) echo "every affected image built" ;;
            success:skipped) echo "no image Dockerfile changed — nothing to build" ;;
            *) echo "::error::image build gate failed ($d / $b)"; exit 1 ;;
          esac

  # The drift gate. A PyPI-lane member whose *shipped* content changed must declare a
  # version the index does not already serve. Without it a library can change, merge, and
  # ship inside a platform image — which embeds internal libs from source (ADR-0027) —
  # while PyPI keeps serving that same version number with the old content: one version
  # string denoting two different things, permanently, with no consumer ever told theirs
  # is behind. scripts/pypi_drift.py carries the full reasoning.
  check-pypi-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the merge-base diff
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Assert every member declares the version its lane allows
        # Platform-lane members declare 0.0.0, and no PyPI-lane member depends on one
        # (ADR-0046).
        run: uv run -q --script scripts/pypi_members.py --check-versions
      - name: Assert every dropped matrix cell is still blocked
        # BLOCKED_CELLS drops a (member, Python) cell because a dependency ships no
        # wheel for it. This job has no `if:`, so the check runs on every PR and the
        # entry cannot outlive its reason: the first build after the wheel appears
        # fails here, naming what to delete. Nobody has to remember.
        run: uv run -q --script scripts/pypi_members.py --check-blocked-cells
      - uses: extractions/setup-just@v4
      - name: Assert every changed lane member declares an unpublished version
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: just pypi-drift "$BASE"

  # The published-combo gate (ADR-0026): the same affected members, tested the way external
  # consumers get them. pypi-matrix.yaml drops everything outside the PyPI lane, so a
  # services-only change yields no cells and only its `test` job is skipped — `discover`
  # still runs, and still queries PyPI once per lane member.
  check-published-combo:
    needs: [discover, lint, check-pypi-drift]
    if: ${{ needs.discover.outputs.python != '[]' }}
    uses: ./.github/workflows/pypi-matrix.yaml
    with:
      paths: ${{ needs.discover.outputs.python }}

  # The check to require in branch protection for this gate, for the same reason
  # images-gate exists above: check-published-combo is `if:`-gated, and a job that never
  # starts can leave its check missing rather than skipped. `lint` and `check-pypi-drift`
  # are in `needs` because check-published-combo waits on them — without that, a failure
  # in either would skip the matrix and this job would report it as "nothing to test".
  published-combo-gate:
    needs: [discover, lint, check-pypi-drift, check-published-combo]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        run: |
          d='${{ needs.discover.result }}'
          l='${{ needs.lint.result }}'
          p='${{ needs.check-pypi-drift.result }}'
          c='${{ needs.check-published-combo.result }}'
          echo "discover=$d lint=$l check-pypi-drift=$p check-published-combo=$c"
          case "$d:$l:$p:$c" in
            success:success:success:success) echo "every affected lane member passed the published-combo matrix" ;;
            success:success:success:skipped) echo "no PyPI-lane member affected — nothing to test" ;;
            *) echo "::error::published-combo gate failed ($d / $l / $p / $c)"; exit 1 ;;
          esac
