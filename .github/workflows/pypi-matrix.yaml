# The published-combo matrix (ADR-0002) — the PyPI lane's test gate.
#
# Tests each lane member: its wheel installed into a bare environment,
# dependencies resolved from PyPI, on Python versions the workspace
# never runs. ci.yaml calls it on affected members, pypi-publish.yaml before any upload.
#
# If a dependency's version has not changed, it is resolved from PyPI.
#
# That holds for a targeted release too, without anything here having to know about one:
# --check-pypi fills a cell's train_deps from (that member's closure ∩ every candidate),
# and pypi-publish.yaml refuses a targeted release whose closure contains a candidate at
# all. So the intersection is empty and the cell resolves the whole closure from PyPI —
# which is exactly what a consumer installing that member alone would get.
#
# Members, extras, test deps and the Python range all come from scripts/pypi_members.py.
name: pypi-matrix

on:
  workflow_call:
    inputs:
      paths:
        description: 'JSON array of member paths to restrict to; "[]" = all lane members'
        type: string
        default: "[]"
  workflow_dispatch:
    inputs:
      paths:
        description: 'JSON array of member paths; "[]" = all lane members'
        required: false
        default: "[]"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
    steps:
      - uses: actions/checkout@v5
      # pypi_members.py declares its own dependency via PEP 723 and runs as
      # `uv run --script`; this job installs nothing else.
      - uses: astral-sh/setup-uv@v7
      - id: cells
        # One cell per (member, python version).
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          paths=$(printf '%s' "$PATHS" \
            | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)))")
          cells=$(uv run --script scripts/pypi_members.py --check-pypi ${paths:+--paths $paths})
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "$cells" | python3 -m json.tool

          # Warning if a member with no cells is skipped
          uv run --script scripts/pypi_members.py ${paths:+--paths $paths} --members \
            | python3 -c "
          import json, sys
          for member in json.load(sys.stdin):
              if not member['pythons']:
                  print(f\"::warning::{member['package']} has no testable version in\"
                        f\" range (declares {member['requires_python']}) — NOT covered\")
          "

  test:
    needs: discover
    if: ${{ needs.discover.outputs.cells != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.discover.outputs.cells) }}
    name: ${{ matrix.cell.package }} on ${{ matrix.cell.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Build a wheel for the package under test, plus one for each of its dependencies
      # that is being released alongside it. Every other dependency is taken from PyPI.
      - name: Build the wheel and its train
        run: |
          for path in "${{ matrix.cell.path }}" ${{ matrix.cell.train_deps }}; do
            uv build --wheel --out-dir /tmp/wheels "$path"
          done
          ls -l /tmp/wheels

      - name: Create a bare ${{ matrix.cell.python }} environment
        working-directory: /tmp
        run: uv venv --python "${{ matrix.cell.python }}" /tmp/venv

      - name: Install the wheel
        working-directory: /tmp
        env:
          EXTRAS: ${{ matrix.cell.extras }}
          PACKAGE: ${{ matrix.cell.package }}
        run: |
          # Replace dashes with underscores in names.
          wheel=$(ls /tmp/wheels/"${PACKAGE//-/_}"-*.whl)
          spec="$wheel"
          [ -n "$EXTRAS" ] && spec="${wheel}[${EXTRAS}]"
          echo "installing $spec"
          uv pip install --python /tmp/venv/bin/python \
            --find-links /tmp/wheels "$spec"

      - name: Install the test dependencies
        run: |
          uv run --script scripts/pypi_members.py --dev-requirements > /tmp/test-requirements.txt
          cat /tmp/test-requirements.txt
          uv pip install --python /tmp/venv/bin/python \
            --find-links /tmp/wheels -r /tmp/test-requirements.txt

      - name: Show the resolved environment
        run: uv pip freeze --python /tmp/venv/bin/python

      - name: Run the test suite
        working-directory: ${{ matrix.cell.path }}
        run: /tmp/venv/bin/python -m pytest -q --durations=10
