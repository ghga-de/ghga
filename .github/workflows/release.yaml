# Release — two lanes (revised ADR-0004):
#   ghga/X.Y.Z  -> PLATFORM lane: build ALL images and package ALL charts from the tagged
#                  commit, stamped with the platform version (lockstep; libs embedded from
#                  source, never PyPI) — both from the same commit, so a version number
#                  denotes one defined state.
#   name/x.y.z  -> PYPI lane: publish that component's wheel (closure-train rule for tools).
#
# A pre-release ref (ghga/X.Y.Z-rc.N) is a normal platform-lane cut for staging: same
# mechanism, same lockstep guarantee, just a SemVer pre-release identifier — not a
# separate process.
#
# MANUAL-ONLY. No tag triggers yet: every run is a deliberate `workflow_dispatch`.
# The `ref` input must name the SAME tag selected in the "Use workflow from" branch/tag
# picker — `resolve` asserts this and fails otherwise. Every checkout in this file pulls
# github.sha (the commit the picker resolved to, not the `ref` string), so dispatching
# from `main` with `ref: ghga/17.0.0` would otherwise stamp images/charts as 17.0.0 while
# actually building whatever commit `main` pointed at — silently breaking the one
# guarantee this lane exists for.
# The platform lane pushes images to Docker Hub (docker.io/ghga/<member>) and charts as
# OCI artifacts to the same namespace, each under a `-chart`-suffixed repo to avoid
# colliding with the same-named image (oci://registry-1.docker.io/ghga/<chart>-chart) —
# when the `push` input is set, authenticated with the org's stored
# DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets (the same credentials already used to pull
# the hardened dhi.io base images). The PyPI lane remains a stub.
#
# On enabling this for real: restore the tag trigger and wire the pypi lane (closure
# train + published-combo matrix are prerequisites there):
#   on:
#     push:
#       tags:
#         - "*/*.*.*"   # e.g. ghga/17.0.0, hexkit/8.7.0, ghga-connector/3.1.0
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag-style ref, e.g. ghga/17.0.0 or ghga/17.1.0-rc.1 for a staging pre-release"
        required: true
      push:
        description: "Push images and charts to Docker Hub; off = build-only dry run"
        type: boolean
        default: false

# One release run per ref at a time: two dispatches for the same version could otherwise
# interleave pushes (e.g. both racing to publish the same tag, or one pushing charts
# against images the other is still mid-push on). A workflow-level group (rather than
# per-job) serializes the whole run without touching the build-images matrix's own
# parallelism. Keyed on the raw dispatch input, not a `resolve` output — it must be known
# before any job (including `resolve`) starts.
concurrency:
  group: release-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Real publish target — matches what production already pulls from.
  REGISTRY: docker.io/ghga
  # Charts publish to the same namespace under a `-chart` suffix (see the header comment).
  # registry-1.docker.io is explicit rather than the docker.io alias: Helm's OCI (ORAS-
  # based) client does not resolve Docker Hub's hostname aliases the way the Docker CLI
  # does, so the login and the push target must agree on the literal registry host.
  CHART_REGISTRY: registry-1.docker.io/ghga

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.route.outputs.lane }}
      name: ${{ steps.route.outputs.name }}
      version: ${{ steps.route.outputs.version }}
      images: ${{ steps.route.outputs.images }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: route
        run: |
          ref="${{ github.event.inputs.ref || github.ref_name }}"   # name/x.y.z
          # The `ref` input is free text; github.ref_name is the actual branch/tag the
          # "Use workflow from" picker resolved and that every checkout in this workflow
          # pulls. They can disagree — e.g. dispatching from `main` with `ref: ghga/17.0.0`
          # would checkout main's HEAD but stamp it as 17.0.0. Require the dispatcher to
          # pick the tag itself.
          if [ "${{ github.ref_name }}" != "$ref" ]; then
            echo "::error::ref input '$ref' does not match the selected branch/tag '${{ github.ref_name }}' — pick the '$ref' tag itself in the 'Use workflow from' selector so the build runs against that exact commit."
            exit 1
          fi
          case "$ref" in
            */*) ;;
            *)
              echo "::error::ref '$ref' has no '/' separating name from version (expected name/x.y.z, e.g. ghga/17.0.0)"
              exit 1
              ;;
          esac
          name="${ref%/*}"; version="${ref##*/}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::version '$version' is not SemVer (expected x.y.z or x.y.z-prerelease)"
            exit 1
          fi
          if [ "$name" = "ghga" ]; then lane=platform; else lane=pypi; fi
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "lane=$lane"       >> "$GITHUB_OUTPUT"
          # Platform image set = services/* + frontend defaults, plus tools that opt in
          # via [tool.ghga] (ADR-0014 directory defaults + explicit markers). Convention:
          # every image member's console script is named exactly like its distribution,
          # so the package name doubles as the ENTRYPOINT (the Dockerfile's `test -e`
          # guard fails the build on any violation).
          # Member enumeration lives in scripts/image_members.py — the same source
          # the chart generator (deploy/src/create_charts.py) consumes.
          echo "images=$(python3 scripts/image_members.py)" >> "$GITHUB_OUTPUT"
      # TODO on enablement: assert the tagged commit is on main AND its CI run is green
      # (the release verifies the integrated HEAD; it does not re-test it).

  # -------- platform lane: build every image, stamped; push only on request -------------
  build-images:
    needs: resolve
    if: ${{ needs.resolve.outputs.lane == 'platform' }}
    runs-on: ubuntu-latest
    name: build ${{ matrix.member.package }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      # On a dry run (push off) a failed member is fine to leave the rest running — it's
      # just a validation pass. On a real push, the platform lane's whole point is
      # lockstep: stop dispatching new pushes the moment one member fails so a partial
      # version (some images published, others missing) isn't left standing. This does
      # NOT roll back members that already pushed before the failure — see the TODO below.
      fail-fast: ${{ inputs.push }}
      matrix:
        member: ${{ fromJSON(needs.resolve.outputs.images) }}
    env:
      DHI_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # arm64 has no native GitHub-hosted runner, so cross-building it on this amd64
      # runner needs QEMU emulation registered with the kernel, plus a buildx builder
      # that can actually target multiple platforms in one invocation (the default
      # "docker" driver can't).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The hardened base (dhi.io) is auth-gated: log in with the org's Docker Hub
      # credentials (same secrets mainline uses). Skipped if the org secrets are not
      # exposed to this repo — the build then fails at the base-image pull with a
      # clear 401, pointing here.
      - name: Login to DHI registry
        if: ${{ env.DHI_USER != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Login happens before the build (not after, as with the old single-arch `docker
      # build` + `docker push`): a multi-platform manifest list has no single-daemon
      # representation to --load, so buildx pushes straight from the build itself.
      #
      # Unlike the DHI login above, this one is NOT guarded on the secret being present:
      # a real push with no Docker Hub credentials should fail loudly here, not slide
      # through to a confusing failure later in the build/push step.
      - name: Login to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Refuse to overwrite an existing release tag
        if: ${{ inputs.push }}
        run: |
          tag="${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }}"
          if docker manifest inspect "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists — releases are immutable. Bump the version to re-run."
            exit 1
          fi
      - name: Build (stamped)
        run: |
          docker buildx build -f "${{ matrix.member.dockerfile }}" \
            --platform linux/amd64,linux/arm64 \
            --build-arg PACKAGE="${{ matrix.member.package }}" \
            --build-arg PLATFORM_VERSION="${{ needs.resolve.outputs.version }}" \
            --build-arg GIT_SHA="${GITHUB_SHA::12}" \
            --label org.opencontainers.image.version="${{ needs.resolve.outputs.version }}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA::12}" \
            -t "${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }}" \
            ${{ inputs.push && '--push' || '' }} \
            "${{ matrix.member.context }}"
      - name: Summary
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            echo "pushed ${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }}"
          else
            echo "build-only: ${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }} (push input not set)"
          fi
      # TODO on enablement: Trivy scan; the front end builds via its own Dockerfile.

  # -------- platform lane: package every chart, stamped; push only on request -----------
  package-charts:
    needs: [resolve, build-images]
    if: ${{ needs.resolve.outputs.lane == 'platform' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Regenerate charts at the release version
        run: uv run python deploy/src/create_charts.py --version "${{ needs.resolve.outputs.version }}"
      # ghga-demo is the local test bed (deploy/README.md), not a release artifact: it
      # bundles dev-only subcharts (aai's mock-oauth2-server, test-oidc-provider) and its
      # own Chart.yaml version isn't stamped by create_charts.py to the platform version
      # in the first place, so it was never a coherent thing to publish. It's still
      # generated above (`just up`/`just demo-template` need it locally) — this lane just
      # never packages or pushes it.
      #
      # ghga-common's own dependency (bitnami's `common` library) is already vendored
      # (deploy/charts/ghga-common/charts/common-2.22.0.tgz + Chart.lock are committed).
      # Every app chart declares ghga-common as a `file://` dependency (ADR-0013); `helm
      # dep up` per chart would walk into ghga-common's own bitnami dependency and
      # re-validate it against the remote bitnami index every single time — redundant
      # network I/O for a dependency that's already pinned and doesn't change between
      # charts. Package ghga-common once and copy the result into every app chart's
      # `charts/` directory instead: `helm package` only needs the .tgz physically
      # present, not a fresh resolution, so this needs no registered repo and no network
      # access at all.
      - name: Vendor ghga-common into every app chart
        run: |
          work=$(mktemp -d)
          helm package deploy/charts/ghga-common -d "$work"
          common_tgz=$(ls "$work"/*.tgz)
          for c in deploy/charts/*/; do
            name=$(basename "$c")
            { [ "$name" = "ghga-common" ] || [ "$name" = "ghga-demo" ]; } && continue
            mkdir -p "${c}charts"
            cp "$common_tgz" "${c}charts/"
          done
      # Not every chart takes the platform version: ghga-common and aai are hand-
      # maintained with their own independent version in Chart.yaml (untouched by
      # create_charts.py --version above, same as ghga-demo). A "generated" chart's
      # values.yaml carries create_charts.py's header (the same marker it uses itself
      # in current_member_version()) — anything without it is independently versioned.
      # Record (name, actual version, generated?) once here so every later step keys off
      # the version that will actually be packaged/pushed, not an assumed platform version.
      - name: Package
        run: |
          mkdir -p dist
          : > dist/manifest.txt
          for c in deploy/charts/*/; do
            name=$(basename "$c")
            [ "$name" = "ghga-demo" ] && continue
            version=$(grep -m1 '^version:' "${c}Chart.yaml" | sed -E 's/version: *"?([^"]*)"?/\1/')
            if head -1 "${c}values.yaml" | grep -q '^# Generated by create_charts.py'; then
              generated=yes
            else
              generated=no
            fi
            echo "$name $version $generated" >> dist/manifest.txt
            helm package "$c" -d dist/
          done
      # No separate `helm registry login`: Helm's OCI client reads the same
      # ~/.docker/config.json this writes — keyed by the literal registry host, so this
      # must log into registry-1.docker.io itself (see CHART_REGISTRY's comment above),
      # not docker.io as the image-build login above does.
      - name: Login to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry-1.docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Releases are immutable — but "immutable" means different things per category:
      # a generated chart's tag == the platform version, so it must be fresh every
      # release (an existing tag means a real version-reuse mistake, hard fail). An
      # independently-versioned chart's tag only changes when a human bumps its own
      # Chart.yaml version — an existing tag there is the normal steady state between
      # content changes, not an error, so it's skipped rather than failed. Either way,
      # nothing with an existing tag is ever pushed again: that's what actually prevents
      # a content change without a version bump from silently overwriting a published
      # chart (the failure mode this whole check exists for).
      - name: Refuse to overwrite an existing release tag
        if: ${{ inputs.push }}
        run: |
          : > dist/to-push.txt
          while read -r name version generated; do
            tag="${CHART_REGISTRY}/${name}-chart:${version}"
            if docker manifest inspect "$tag" >/dev/null 2>&1; then
              if [ "$generated" = "yes" ]; then
                echo "::error::$tag already exists — releases are immutable. Bump the version to re-run."
                exit 1
              fi
              echo "skipping ${name}: $tag already published (independently versioned, unchanged) — bump its Chart.yaml version to publish new content."
              continue
            fi
            echo "$name $version" >> dist/to-push.txt
          done < dist/manifest.txt
      # Docker Hub repos are exactly namespace/repo (no third path segment), and a
      # chart's name always equals its image's package name (ADR-0014) — pushing under
      # the bare name would collide tag-for-tag with the container image of the same
      # name and version in the same `ghga` namespace. helm derives the OCI push target
      # from the packaged Chart.yaml's `name:` field, so re-pack (from the already
      # ghga-common-vendored chart directory, not the dist/ tgz) a `-chart`-suffixed
      # copy purely for this push; the on-disk chart directories keep the real,
      # unsuffixed names (ghga-demo's own dependency graph still uses them via `file://`).
      - name: Push
        if: ${{ inputs.push }}
        run: |
          work=$(mktemp -d)
          while read -r name version; do
            c="deploy/charts/${name}/"
            rm -rf "${work:?}"/*
            cp -r "$c" "$work/${name}-chart"
            sed -i "s/^name: .*/name: ${name}-chart/" "$work/${name}-chart/Chart.yaml"
            helm package "$work/${name}-chart" -d "$work"
            helm push "$work/${name}-chart-"*.tgz "oci://${CHART_REGISTRY}"
          done < dist/to-push.txt
      - name: Summary
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            echo "pushed:"
            cat dist/to-push.txt
          else
            echo "build-only: packaged charts, versions per dist/manifest.txt (push input not set)"
            cat dist/manifest.txt
          fi

  # -------- pypi lane: dormant stub ------------------------------------------------------
  publish-pypi:
    needs: resolve
    if: ${{ needs.resolve.outputs.lane == 'pypi' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # TODO on enablement (ADR-0004 pypi lane):
      #  - assert tag version == the member's pyproject version at HEAD
      #  - closure train for tools: changed internal deps must be released from this
      #    commit first, and the tool pins them exactly
      #  - prerequisite: the published-combo matrix (ADR-0002) exists for this member
      # Fails on purpose: a dispatch that routes here has selected a name/x.y.z ref, and
      # this lane cannot publish it yet. Exiting 0 would report a release as done when
      # nothing was published — the worst failure mode for a release workflow.
      - run: |
          echo "::error::pypi lane is a stub — would have published ${{ needs.resolve.outputs.name }} ${{ needs.resolve.outputs.version }}, but no publish target is configured yet."
          exit 1
