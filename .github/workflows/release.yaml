# Release — two lanes (revised ADR-0004):
#   ghga/X.Y.Z  -> PLATFORM lane: build ALL images from the tagged commit, stamped with the
#                  platform version (lockstep; libs embedded from source, never PyPI).
#   name/x.y.z  -> PYPI lane: publish that component's wheel (closure-train rule for tools).
#
# MANUAL-ONLY. No tag triggers yet: every run is a deliberate `workflow_dispatch`.
# The platform lane can push images to the INTERIM registry (GHCR under this repo's
# namespace) when the `push` input is set — authenticated with the ephemeral, per-run
# GITHUB_TOKEN, so no stored credentials exist. The PyPI lane remains a stub.
#
# On the real enablement decision: restore the tag trigger, revisit REGISTRY, and wire
# the pypi lane (closure train + published-combo matrix are prerequisites there):
#   on:
#     push:
#       tags:
#         - "*/*.*.*"   # e.g. ghga/17.0.0, hexkit/8.7.0, ghga-connector/3.1.0
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag-style ref, e.g. ghga/17.0.0"
        required: true
      push:
        description: "Push images to the interim registry (GHCR); off = build-only dry run"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Interim publish target (test): repo-scoped GHCR path, private by default,
  # easy to bulk-clean. The real target is a separate, later decision.
  REGISTRY: ghcr.io/ghga-de/ghga

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.route.outputs.lane }}
      name: ${{ steps.route.outputs.name }}
      version: ${{ steps.route.outputs.version }}
      images: ${{ steps.route.outputs.images }}
    steps:
      - uses: actions/checkout@v5
      - id: route
        run: |
          ref="${{ github.event.inputs.ref || github.ref_name }}"   # name/x.y.z
          name="${ref%/*}"; version="${ref##*/}"
          if [ "$name" = "ghga" ]; then lane=platform; else lane=pypi; fi
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "lane=$lane"       >> "$GITHUB_OUTPUT"
          # Platform image set = services/* + frontend defaults, plus tools that opt in
          # via [tool.ghga] (ADR-0014 directory defaults + explicit markers).
          echo "images=$(python3 - <<'PY'
          import json, pathlib, tomllib
          members = []
          for root, default_image in (("services", True), ("tools", False)):
              for p in sorted(pathlib.Path(root).iterdir()):
                  manifest = p / "pyproject.toml"
                  if not manifest.is_file():
                      continue
                  ghga = tomllib.loads(manifest.read_text()).get("tool", {}).get("ghga", {})
                  image = ghga.get("image", default_image if ghga.get("release") != "pypi" else False)
                  if root == "tools" and not ghga:
                      image = False
                  if image:
                      data = tomllib.loads(manifest.read_text())
                      members.append({"path": str(p), "package": data["project"]["name"]})
          print(json.dumps(members))
          PY
          )" >> "$GITHUB_OUTPUT"
      # TODO on enablement: assert the tagged commit is on main AND its CI run is green
      # (the release verifies the integrated HEAD; it does not re-test it).

  # -------- platform lane: build every image, stamped; push only on request -------------
  build-images:
    needs: resolve
    if: ${{ needs.resolve.outputs.lane == 'platform' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # GHCR, via the ephemeral GITHUB_TOKEN (interim target only)
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(needs.resolve.outputs.images) }}
    steps:
      - uses: actions/checkout@v5
      - name: Build (stamped)
        run: |
          docker build -f docker/Dockerfile \
            --build-arg PACKAGE="${{ matrix.member.package }}" \
            --build-arg EXECUTABLE="${{ matrix.member.package }}" \
            --build-arg PLATFORM_VERSION="${{ needs.resolve.outputs.version }}" \
            --build-arg GIT_SHA="${GITHUB_SHA::12}" \
            -t "${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }}" .
      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: ${{ inputs.push }}
        run: docker push "${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }}"
      - name: Summary
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            echo "pushed ${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }}"
          else
            echo "build-only: ${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }} (push input not set)"
          fi
      # TODO on enablement: multi-arch via buildx, Trivy scan; the front end builds via
      # its own Dockerfile; charts are packaged and pushed as OCI artifacts with
      # version/appVersion = the platform version (Phase B).

  # -------- pypi lane: dormant stub ------------------------------------------------------
  publish-pypi:
    needs: resolve
    if: ${{ needs.resolve.outputs.lane == 'pypi' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # TODO on enablement (ADR-0004 pypi lane):
      #  - assert tag version == the member's pyproject version at HEAD
      #  - closure train for tools: changed internal deps must be released from this
      #    commit first, and the tool pins them exactly
      #  - prerequisite: the published-combo matrix (ADR-0002) exists for this member
      - run: |
          echo "DORMANT: would publish ${{ needs.resolve.outputs.name }} ${{ needs.resolve.outputs.version }} to PyPI — targets not configured."
