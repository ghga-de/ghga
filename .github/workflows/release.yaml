# Release — two lanes (revised ADR-0004):
#   ghga/X.Y.Z  -> PLATFORM lane: build ALL images and package ALL charts from the tagged
#                  commit, stamped with the platform version (lockstep; libs embedded from
#                  source, never PyPI) — both from the same commit, so a version number
#                  denotes one defined state.
#   name/x.y.z  -> PYPI lane: publish that component's wheel (closure-train rule for tools).
#
# A pre-release ref (ghga/X.Y.Z-rc.N) is a normal platform-lane cut for staging: same
# mechanism, same lockstep guarantee, just a SemVer pre-release identifier — not a
# separate process.
#
# MANUAL-ONLY. No tag triggers yet: every run is a deliberate `workflow_dispatch`.
# The `ref` input must name the SAME tag selected in the "Use workflow from" branch/tag
# picker — `resolve` asserts this and fails otherwise. Every checkout in this file pulls
# github.sha (the commit the picker resolved to, not the `ref` string), so dispatching
# from `main` with `ref: ghga/17.0.0` would otherwise stamp images/charts as 17.0.0 while
# actually building whatever commit `main` pointed at — silently breaking the one
# guarantee this lane exists for.
# The platform lane pushes images to Docker Hub (docker.io/ghga/<member>) and charts as
# OCI artifacts to the same namespace, each under a `-chart`-suffixed repo to avoid
# colliding with the same-named image (oci://registry-1.docker.io/ghga/<chart>-chart) —
# when the `push` input is set, authenticated with the org's stored
# DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets (the same credentials already used to pull
# the hardened dhi.io base images). The PyPI lane remains a stub.
#
# On the real enablement decision:
#   on:
#     push:
#       tags:
#         - "*/*.*.*"   # e.g. ghga/17.0.0, hexkit/8.7.0, ghga-connector/3.1.0
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag-style ref, e.g. ghga/17.0.0 or ghga/17.1.0-rc.1 for a staging pre-release"
        required: true
      push:
        description: "Push images and charts to Docker Hub; off = build-only dry run"
        type: boolean
        default: false

# One release run per ref at a time: two dispatches for the same version could otherwise
# interleave pushes (e.g. both racing to publish the same tag, or one pushing charts
# against images the other is still mid-push on). A workflow-level group (rather than
# per-job) serializes the whole run without touching the build-images matrix's own
# parallelism. Keyed on the raw dispatch input, not a `resolve` output — it must be known
# before any job (including `resolve`) starts.
concurrency:
  group: release-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Real publish target — matches what production already pulls from.
  REGISTRY: docker.io/ghga
  # Charts publish to the same namespace under a `-chart` suffix (see the header comment).
  # registry-1.docker.io (not the docker.io alias) is the actual backend host OCI
  # push/pull operations need to hit — but the *login* step targets docker.io, not this;
  # see package-charts' "Login to Docker Hub" step for why those two intentionally differ.
  CHART_REGISTRY: registry-1.docker.io/ghga

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to read this commit's CI run conclusion
    outputs:
      lane: ${{ steps.route.outputs.lane }}
      name: ${{ steps.route.outputs.name }}
      version: ${{ steps.route.outputs.version }}
      images: ${{ steps.route.outputs.images }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # ancestry check needs history, not just the tip

      # ADR-0004: the release VERIFIES the integrated HEAD, it does not re-test it. CI
      # already proved this commit good; the tag only snapshots that. So the two things
      # worth asserting are that the evidence exists and that it is about a commit anybody
      # reviewed — without them, a tag on an unmerged branch, or on a commit whose CI never
      # ran or went red, would build images and publish wheels exactly as a good one does.
      #
      # Enforced on every run, dispatch included: the check is worth least in the case where
      # it is easiest to skip.
      - name: Verify the commit is on main and its CI is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA::12} is not on main — releases come from main only"
            exit 1
          fi

          # `status=completed` excludes runs still in flight, so a release racing its own
          # CI reads as "no evidence" rather than passing on a partial result.
          runs=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$GITHUB_SHA&status=completed" \
            --jq '.workflow_runs[] | {created_at, conclusion, html_url}' | jq -s 'sort_by(.created_at)')

          if [ "$(echo "$runs" | jq 'length')" -eq 0 ]; then
            echo "::error::no completed CI run for ${GITHUB_SHA::12} — nothing proves this commit works"
            exit 1
          fi

          # The latest run wins: a red run that was re-run green is green.
          latest=$(echo "$runs" | jq -r 'last')
          conclusion=$(echo "$latest" | jq -r '.conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for ${GITHUB_SHA::12} concluded '$conclusion' — $(echo "$latest" | jq -r '.html_url')"
            exit 1
          fi
          echo "${GITHUB_SHA::12} is on main and its CI is green"

      - id: route
        # $REF, not an interpolated `${{ }}`: interpolation pastes the input into the
        # script as text, where shell syntax in it would run. As a variable it is data.
        env:
          REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          ref="$REF"   # name/x.y.z
          name="${ref%/*}"; version="${ref##*/}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::version '$version' is not SemVer (expected x.y.z or x.y.z-prerelease)"
            exit 1
          fi
          if [ "$name" = "ghga" ]; then lane=platform; else lane=pypi; fi
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "lane=$lane"       >> "$GITHUB_OUTPUT"
          # Platform image set = services/* + frontend defaults, plus tools that opt in
          # via [tool.ghga] (ADR-0014 directory defaults + explicit markers). Convention:
          # every image member's console script is named exactly like its distribution,
          # so the package name doubles as the ENTRYPOINT (the Dockerfile's `test -e`
          # guard fails the build on any violation).
          # Member enumeration lives in scripts/image_members.py — the same source
          # the chart generator (deploy/src/create_charts.py) consumes.
          echo "images=$(python3 scripts/image_members.py)" >> "$GITHUB_OUTPUT"
      # ADR-0004: the tag must name a lane member and match its version at HEAD. What gets
      # uploaded is pypi-publish.yaml's decision; this only stops a tag announcing a
      # release nobody made.
      - name: Check the tag against the member it names
        if: ${{ steps.route.outputs.lane == 'pypi' }}
        env:
          NAME: ${{ steps.route.outputs.name }}
          VERSION: ${{ steps.route.outputs.version }}
        run: |
          python3 scripts/pypi_members.py --members > /tmp/members.json
          python3 - <<'EOF'
          import json, os, re, sys

          def canon(name):  # PEP 503: the tag spells the distribution either way
              return re.sub(r"[-_.]+", "-", name).lower()

          name, version = os.environ["NAME"], os.environ["VERSION"]
          members = {canon(m["package"]): m for m in json.load(open("/tmp/members.json"))}
          member = members.get(canon(name))
          if member is None:
              known = ", ".join(sorted(members))
              sys.exit(f"::error::{name} is not a PyPI-lane member (lane: {known})")
          declared = member["version"]
          if declared != version:
              sys.exit(f"::error::tag says {version}, but {name} declares {declared}")
          print(f"{name} {version} matches {member['path']}")
          EOF

  # -------- platform lane: build every image, stamped; push only on request -------------
  build-images:
    needs: resolve
    if: ${{ needs.resolve.outputs.lane == 'platform' }}
    runs-on: ubuntu-latest
    name: build ${{ matrix.member.package }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      # On a dry run (push off) a failed member is fine to leave the rest running — it's
      # just a validation pass. On a real push, the platform lane's whole point is
      # lockstep: stop dispatching new pushes the moment one member fails so a partial
      # version (some images published, others missing) isn't left standing. This does
      # NOT roll back members that already pushed before the failure — see the TODO below.
      fail-fast: ${{ inputs.push }}
      matrix:
        member: ${{ fromJSON(needs.resolve.outputs.images) }}
    env:
      DHI_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # arm64 has no native GitHub-hosted runner, so cross-building it on this amd64
      # runner needs QEMU emulation registered with the kernel, plus a buildx builder
      # that can actually target multiple platforms in one invocation (the default
      # "docker" driver can't).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The hardened base (dhi.io) is auth-gated: log in with the org's Docker Hub
      # credentials (same secrets mainline uses). Skipped if the org secrets are not
      # exposed to this repo — the build then fails at the base-image pull with a
      # clear 401, pointing here.
      - name: Login to DHI registry
        if: ${{ env.DHI_USER != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Login happens before the build (not after, as with the old single-arch `docker
      # build` + `docker push`): a multi-platform manifest list has no single-daemon
      # representation to --load, so buildx pushes straight from the build itself.
      #
      # Unlike the DHI login above, this one is NOT guarded on the secret being present:
      # a real push with no Docker Hub credentials should fail loudly here, not slide
      # through to a confusing failure later in the build/push step.
      - name: Login to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Refuse to overwrite an existing release tag
        if: ${{ inputs.push }}
        run: |
          tag="${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }}"
          if docker manifest inspect "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists — releases are immutable. Bump the version to re-run."
            exit 1
          fi
      - name: Build (stamped)
        run: |
          docker buildx build -f "${{ matrix.member.dockerfile }}" \
            --platform linux/amd64,linux/arm64 \
            --build-arg PACKAGE="${{ matrix.member.package }}" \
            --build-arg PLATFORM_VERSION="${{ needs.resolve.outputs.version }}" \
            --build-arg GIT_SHA="${GITHUB_SHA::12}" \
            --label org.opencontainers.image.version="${{ needs.resolve.outputs.version }}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA::12}" \
            -t "${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }}" \
            ${{ inputs.push && '--push' || '' }} \
            "${{ matrix.member.context }}"
      - name: Summary
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            echo "pushed ${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }}"
          else
            echo "build-only: ${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }} (push input not set)"
          fi
      # TODO on enablement: Trivy scan; the front end builds via its own Dockerfile;
      # charts are packaged and pushed as OCI artifacts with version/appVersion = the
      # platform version (Phase B).

  # -------- pypi lane: delegated to pypi-publish.yaml -------------------------------------
  #
  # It calls pypi-publish.yaml, which picks the packages and runs the tests.
  publish-pypi:
    needs: resolve
    if: ${{ needs.resolve.outputs.lane == 'pypi' }}
    permissions:
      contents: read
      # For trusted publishing in the called workflow, which cannot hold more than its
      # caller grants.
      id-token: write
    uses: ./.github/workflows/pypi-publish.yaml
    with:
      publish: ${{ inputs.push }}
