# Release — a pushed tag `name/x.y.z` releases ONLY that component (ADR-0004).
#
# DORMANT, AND MUST NOT PUBLISH. Publish targets are not decided yet, so this workflow has
# no triggers, no publish steps, and no write permissions. Keep all three until the target
# registries and credentials are agreed.
#
# To enable, restore the tag trigger and the write permission:
#   on:
#     push:
#       tags:
#         - "*/*.*.*"   # e.g. hexkit/8.4.0, dcs/10.2.0, ghga/2.1.0
#   permissions:
#     contents: read
#     packages: write   # GHCR (charts)
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: |
          ref="${GITHUB_REF_NAME}"            # name/x.y.z
          echo "name=${ref%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${ref##*/}" >> "$GITHUB_OUTPUT"
      # TODO: assert the tag version == the component's version at HEAD (pyproject/Chart.yaml/package.json).

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      NAME: ${{ needs.resolve.outputs.name }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # TODO (do NOT wire up until publish targets are agreed — see the header):
      # branch by the component's [tool.ghga] capabilities:
      #  - image=true  -> docker build -f docker/Dockerfile --build-arg PACKAGE=$NAME ...
      #                   push <registry>/$NAME:$VERSION (+ DHI flavour); package the chart
      #                   and push to <oci-registry>/charts/$NAME:$VERSION
      #  - pypi=true   -> uv build --package $NAME ; publish
      - run: |
          echo "DORMANT: would release ${NAME} ${VERSION} — no publish target configured."
