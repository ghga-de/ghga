# Release — two lanes (revised ADR-0004):
#   ghga/X.Y.Z  -> PLATFORM lane: build ALL images and package ALL charts from the tagged
#                  commit, stamped with the platform version (lockstep; libs embedded from
#                  source, never PyPI) — both from the same commit, so a version number
#                  denotes one defined state.
#   name/x.y.z  -> PYPI lane: publish that component's wheel (closure-train rule for tools).
#
# A pre-release ref (ghga/X.Y.Z-rc.N) is a normal platform-lane cut for staging: same
# mechanism, same lockstep guarantee, just a SemVer pre-release identifier — not a
# separate process.
#
# MANUAL-ONLY. No tag triggers yet: every run is a deliberate `workflow_dispatch`.
# The platform lane pushes images to Docker Hub (docker.io/ghga/<member>) and charts as
# OCI artifacts to the same registry (oci://docker.io/ghga/charts/<chart>) — when the
# `push` input is set, authenticated with the org's stored
# DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets (the same credentials already used to pull
# the hardened dhi.io base images). The PyPI lane remains a stub.
#
# On enabling this for real: restore the tag trigger and wire the pypi lane (closure
# train + published-combo matrix are prerequisites there):
#   on:
#     push:
#       tags:
#         - "*/*.*.*"   # e.g. ghga/17.0.0, hexkit/8.7.0, ghga-connector/3.1.0
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag-style ref, e.g. ghga/17.0.0 or ghga/17.1.0-rc.1 for a staging pre-release"
        required: true
      push:
        description: "Push images and charts to Docker Hub; off = build-only dry run"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Real publish target — matches what production already pulls from.
  REGISTRY: docker.io/ghga

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.route.outputs.lane }}
      name: ${{ steps.route.outputs.name }}
      version: ${{ steps.route.outputs.version }}
      images: ${{ steps.route.outputs.images }}
    steps:
      - uses: actions/checkout@v5
      - id: route
        run: |
          ref="${{ github.event.inputs.ref || github.ref_name }}"   # name/x.y.z
          name="${ref%/*}"; version="${ref##*/}"
          if [ "$name" = "ghga" ]; then lane=platform; else lane=pypi; fi
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "lane=$lane"       >> "$GITHUB_OUTPUT"
          # Platform image set = services/* + frontend defaults, plus tools that opt in
          # via [tool.ghga] (ADR-0014 directory defaults + explicit markers). Convention:
          # every image member's console script is named exactly like its distribution,
          # so the package name doubles as the ENTRYPOINT (the Dockerfile's `test -e`
          # guard fails the build on any violation).
          # Member enumeration lives in scripts/image_members.py — the same source
          # the chart generator (deploy/src/create_charts.py) consumes.
          echo "images=$(python3 scripts/image_members.py)" >> "$GITHUB_OUTPUT"
      # TODO on enablement: assert the tagged commit is on main AND its CI run is green
      # (the release verifies the integrated HEAD; it does not re-test it).

  # -------- platform lane: build every image, stamped; push only on request -------------
  build-images:
    needs: resolve
    if: ${{ needs.resolve.outputs.lane == 'platform' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(needs.resolve.outputs.images) }}
    env:
      DHI_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v5
      # arm64 has no native GitHub-hosted runner, so cross-building it on this amd64
      # runner needs QEMU emulation registered with the kernel, plus a buildx builder
      # that can actually target multiple platforms in one invocation (the default
      # "docker" driver can't).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # The hardened base (dhi.io) is auth-gated: log in with the org's Docker Hub
      # credentials (same secrets mainline uses). Skipped if the org secrets are not
      # exposed to this repo — the build then fails at the base-image pull with a
      # clear 401, pointing here.
      - name: Login to DHI registry
        if: ${{ env.DHI_USER != '' }}
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Login happens before the build (not after, as with the old single-arch `docker
      # build` + `docker push`): a multi-platform manifest list has no single-daemon
      # representation to --load, so buildx pushes straight from the build itself.
      - name: Login to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # OCI labels are set on the CLI so members whose Dockerfile does not stamp them
      # itself (the mainline-synced frontend one) still carry version + revision;
      # for the shared Python Dockerfile they override its labels with equal values.
      # Build-args a member's Dockerfile does not declare only produce a warning.
      #
      # With push off (dry run) the multi-platform result is neither loadable nor
      # pushable, so buildx just builds both platforms and discards the output —
      # enough to validate the Dockerfile builds clean on each arch.
      - name: Build (stamped)
        run: |
          docker buildx build -f "${{ matrix.member.dockerfile }}" \
            --platform linux/amd64,linux/arm64 \
            --build-arg PACKAGE="${{ matrix.member.package }}" \
            --build-arg PLATFORM_VERSION="${{ needs.resolve.outputs.version }}" \
            --build-arg GIT_SHA="${GITHUB_SHA::12}" \
            --label org.opencontainers.image.version="${{ needs.resolve.outputs.version }}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA::12}" \
            -t "${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }}" \
            ${{ inputs.push && '--push' || '' }} \
            "${{ matrix.member.context }}"
      - name: Summary
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            echo "pushed ${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }}"
          else
            echo "build-only: ${REGISTRY}/${{ matrix.member.package }}:${{ needs.resolve.outputs.version }} (push input not set)"
          fi
      # TODO on enablement: Trivy scan; the front end builds via its own Dockerfile.

  # -------- platform lane: package every chart, stamped; push only on request -----------
  package-charts:
    needs: [resolve, build-images]
    if: ${{ needs.resolve.outputs.lane == 'platform' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: azure/setup-helm@v5
      - name: Regenerate charts at the release version
        run: uv run python deploy/src/create_charts.py --version "${{ needs.resolve.outputs.version }}"
      # ghga-common's own dependency (bitnami's `common` library) is already vendored
      # (deploy/charts/ghga-common/charts/common-2.22.0.tgz + Chart.lock are committed),
      # but `helm dep up` still validates the lock against a registered repo, not just
      # the vendored .tgz.
      - name: Add chart dependency repositories
        run: helm repo add bitnami https://charts.bitnami.com/bitnami
      # Vendor dependencies bottom-up — app charts before the umbrella — so every
      # packaged chart is self-contained: a checked-out `file://../ghga-common`
      # reference can't be resolved by an outside consumer.
      - name: Resolve chart dependencies
        run: |
          for c in deploy/charts/*/; do
            name=$(basename "$c")
            { [ "$name" = "ghga-common" ] || [ "$name" = "ghga-demo" ]; } && continue
            helm dep up "$c" --skip-refresh
          done
          helm dep up deploy/charts/ghga-demo --skip-refresh
      - name: Package
        run: |
          mkdir -p dist
          for c in deploy/charts/*/; do
            helm package "$c" -d dist/
          done
      # No separate `helm registry login`: Helm's OCI client reads the same
      # ~/.docker/config.json this writes.
      - name: Login to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        if: ${{ inputs.push }}
        run: |
          for tgz in dist/*.tgz; do
            helm push "$tgz" "oci://${REGISTRY}/charts"
          done
      - name: Summary
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            echo "pushed charts to oci://${REGISTRY}/charts (version ${{ needs.resolve.outputs.version }})"
          else
            echo "build-only: packaged charts at ${{ needs.resolve.outputs.version }} (push input not set)"
          fi

  # -------- pypi lane: dormant stub ------------------------------------------------------
  publish-pypi:
    needs: resolve
    if: ${{ needs.resolve.outputs.lane == 'pypi' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # TODO on enablement (ADR-0004 pypi lane):
      #  - assert tag version == the member's pyproject version at HEAD
      #  - closure train for tools: changed internal deps must be released from this
      #    commit first, and the tool pins them exactly
      #  - prerequisite: the published-combo matrix (ADR-0002) exists for this member
      - run: |
          echo "DORMANT: would publish ${{ needs.resolve.outputs.name }} ${{ needs.resolve.outputs.version }} to PyPI — targets not configured."
