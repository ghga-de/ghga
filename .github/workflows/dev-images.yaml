# Dev images — every merge to `dev` rebuilds the mono Python image and the front-end
# image and publishes them to the scratch registry ($REGISTRY below, ghcr.io/ghga-de/ghga)
# under the mutable :dev tag. That is deliberately NOT release.yaml's REGISTRY, which is
# docker.io/ghga, the production target (ADR-0027).
#
# :dev is NOT a release artifact. The mono variant packs every Python member into one
# venv (docker/Dockerfile VARIANT=mono — never a release image), and the tag tracks the
# `dev` branch — integration state, which is what it is named for. `main` deliberately
# does not feed it: `main` only moves at release time (ADR-0038) and its artifacts are
# the version-stamped release images. Consumers are the daily security-scan workflow
# (which pulls these images as its published-exposure baseline), the dev cluster
# through the charts below, and anyone wanting "latest integrated" without a release.
# Release images remain per-member and version-stamped (release.yaml, ADR-0027).
#
# The member charts are published alongside, for continuous deployment of `dev` to a
# cluster: generated with --mono, so every Python member runs the platform image, and
# pinned to the digests built here. Each run has one version (the version job), so a CD
# tool following the semver range >=0.0.0-0 rolls out every merge in order (ADR-0045).
#
# Publishing is deliberately independent of ci.yaml: merges are already gated by PR CI,
# and :dev makes no greenness promise beyond that. PLATFORM_VERSION is the run's dev
# version, so a running service reports which build it is; the revision label and
# GIT_SHA build-arg tie that to the commit.
#
# Every published tag carries an SBOM + SLSA provenance attestation (buildx-native,
# provenance=mode=max, re-published via cosign attest) and a keyless cosign signature
# over the resolved digest — see
# ADR-0037. This build goes through `docker buildx build` directly (a docker-container
# builder is required: the default docker-driver builder can't export attestations)
# rather than the justfile's `image`/`image-mono` recipes: those are also used for
# local/demo builds that load into the docker store or a kind cluster, which is
# incompatible with attestations (they turn the push into an OCI index the classic
# docker store can't represent) — see docs/adrs/adr-0037-image-signing-sbom-provenance.md.
name: dev-images

on:
  push:
    branches: [dev]

# Newest merge wins the tag; a superseded in-flight build has nothing to offer.
concurrency:
  group: dev-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/ghga-de/ghga
  # Keeps `just image`/`image-mono` tagging under $REGISTRY here too — the :dev tag is
  # deliberately separate from the release target (docker.io/ghga; see justfile's
  # image_registry and release.yaml).
  IMAGE_REGISTRY: ghcr.io/ghga-de/ghga
  CHART_REGISTRY: ghcr.io/ghga-de/ghga/charts

jobs:
  # The one version both the image tag and the charts carry. Computed once: "Re-run
  # failed jobs" never re-runs a job that succeeded, so its output survives, while a
  # re-run job reading run_attempt itself would get a new one. Numbers, not the SHA:
  # semver compares numeric prerelease fields numerically, so the newest merge, or a
  # full re-run of it, is always the highest version. run_number restarts at 1 if this
  # workflow is renamed or recreated; raise the 0.0.0 base then.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=0.0.0-dev.${{ github.run_number }}.${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # GHCR push via the ephemeral GITHUB_TOKEN
      id-token: write # keyless cosign signing (Fulcio/Rekor via OIDC)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: platform
            dockerfile: docker/Dockerfile
            context: .
            build-args: VARIANT=mono
          - image: data-portal
            dockerfile: frontend/data-portal/Dockerfile
            context: frontend/data-portal
            build-args: ""
    env:
      DHI_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DEV_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      # The hardened bases (dhi.io) are auth-gated — same pattern as release.yaml:
      # skipped when the org secrets are absent, failing the base pull with a clear 401.
      - name: Login to DHI registry
        if: ${{ env.DHI_USER != '' }}
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The default (docker-driver) builder shares the daemon's storage but can't export
      # attestations to a registry — a docker-container builder is required for that.
      - name: Create buildx builder
        run: docker buildx create --use --driver docker-container --name ci
      # --pull refreshes the floating base tags, same as the plain `docker build --pull`
      # this replaces. --metadata-file is how the CLI surfaces the pushed digest (the
      # build-push-action equivalent would be its `outputs.digest`).
      - name: Build and push (attested)
        id: build
        run: |
          build_args=(--build-arg "GIT_SHA=${SHORT_SHA}" --build-arg "PLATFORM_VERSION=${DEV_VERSION}")
          if [ -n "${{ matrix.build-args }}" ]; then
            build_args+=(--build-arg "${{ matrix.build-args }}")
          fi
          docker buildx build \
            --push \
            --pull \
            --provenance=mode=max \
            --sbom=true \
            "${build_args[@]}" \
            --label org.opencontainers.image.revision="${SHORT_SHA}" \
            --metadata-file metadata.json \
            -f "${{ matrix.dockerfile }}" \
            -t "${REGISTRY}/${{ matrix.image }}:dev" \
            -t "${REGISTRY}/${{ matrix.image }}:${DEV_VERSION}" \
            "${{ matrix.context }}"
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the published image (keyless)
        run: cosign sign --yes --recursive "${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
      # buildx's own attestations live inside the index, where cosign cannot find them.
      # In a script so release.yaml runs the identical path rather than a second copy.
      - name: Attest SBOM + provenance (keyless)
        run: scripts/attest-image.sh "${REGISTRY}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
      - name: Save digest for the charts
        run: |
          mkdir -p digests
          echo -n "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          retention-days: 1

  # Mirrors release.yaml's package-charts; see there for why ghga-common is vendored
  # rather than resolved. Only the generated member charts are pushed: aai,
  # ghga-common and ghga-demo carry their own versions and are not deployed from here.
  publish-charts:
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEV_VERSION: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: "digest-*"
          path: digests
          merge-multiple: true
      - name: Generate the charts
        run: |
          for f in digests/*; do
            jq -n --arg image "$(basename "$f")" --arg digest "$(cat "$f")" '{($image): $digest}'
          done | jq -s 'add' > digests.json
          uv run python deploy/src/create_charts.py --version "$DEV_VERSION" \
            --registry "$REGISTRY" --chart-registry "$CHART_REGISTRY" --chart-suffix "" \
            --mono --digests digests.json --require-digests
      - name: Package
        run: |
          work=$(mktemp -d)
          helm package deploy/charts/ghga-common -d "$work"
          mkdir -p dist
          for c in deploy/charts/*/; do
            head -1 "${c}values.yaml" | grep -q '^# Generated by create_charts.py' || continue
            mkdir -p "${c}charts"
            cp "$work"/ghga-common-*.tgz "${c}charts/"
            helm package "$c" -d dist/
          done
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          for chart in dist/*.tgz; do
            helm push "$chart" "oci://${CHART_REGISTRY}"
          done
