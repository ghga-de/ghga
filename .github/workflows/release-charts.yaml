# Chart release — mirrors github.com/ghga-de/charts' release-charts.yml: package every
# chart with helm/chart-releaser-action, cut a GitHub Release per chart, and publish the
# resulting index.yaml to this repo's own GitHub Pages (gh-pages branch) — the target
# `helm repo add ghga https://ghga-de.github.io/...` in deploy/chart-system.md expects.
#
# Unlike the legacy repo, generated charts here depend on ghga-common via a monorepo-local
# `file://../ghga-common` path (create_charts.py), not a published HTTP repo — so instead
# of legacy's `helm repo add ghga ...` bootstrap, dependencies are vendored locally with
# `helm dep up` before packaging.
#
# Runs on every push to main that touches deploy/ (chart-releaser's skip_existing makes
# this safe: nothing is published unless a chart's checked-in Chart.yaml version actually
# changed — see deploy/chart-system.md's "Update Chart" steps for how that happens).
#
# Prerequisite: the gh-pages branch must exist (and GitHub Pages be enabled from it) on
# this repo before the first run — chart-releaser-action does not create it.
name: release-charts

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release + push the gh-pages index
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # chart-releaser diffs against existing tags/releases

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v5

      # ghga-common's own dependency (bitnami's `common` library) is already vendored
      # (deploy/charts/ghga-common/charts/common-2.22.0.tgz + Chart.lock are committed),
      # but `cr package`/`helm package` still validates the lock against a registered
      # repo, not just the vendored .tgz — without this, packaging ghga-common fails with
      # "no repository definition for https://charts.bitnami.com/bitnami".
      - name: Add chart dependency repositories
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      # Vendor dependencies bottom-up — app charts before the umbrella — so every
      # packaged chart is self-contained: chart-releaser packages each directory as-is,
      # and a checked-out `file://../ghga-common` reference can't be resolved by an
      # outside consumer.
      - name: Resolve chart dependencies
        run: |
          for c in deploy/charts/*/; do
            name=$(basename "$c")
            { [ "$name" = "ghga-common" ] || [ "$name" = "ghga-demo" ]; } && continue
            helm dep up "$c" --skip-refresh
          done
          helm dep up deploy/charts/ghga-demo --skip-refresh

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: deploy/charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
