# Testbed configuration for the kind demo cluster reached through its gateway alone,
# the way a remote cluster is reached: no kubectl, no port-forward, no /etc/hosts edit.
# Use via:  just testbed-remote testbed/tb.local-kind.yaml
# It proves the cluster lane on a local cluster; `just testbed` with tb.kind.yaml is
# the kind lane with its prelude.
#
# Only URLs, database names, collection names and event-type names belong here.
# Every secret arrives as a TB_* environment variable (the recipe lists them) and is
# never written into this file.

external_base_url: http://localhost/api
data_portal_url: http://localhost

# kind publishes only the gateway (80) and MinIO (9000) on the host, and MailHog and
# the lox24 mock are not gateway-routed there. Reaching them here needs a forward
# started outside the recipe: `kubectl port-forward svc/ghga-mailhog 8025:8025` and
# `kubectl port-forward svc/ghga-lox24-mock 18080:8080`. A target cluster routes both
# through its gateway instead.
mail_url: http://localhost:8025
lox24_mock_url: http://localhost:18080

# route-name deltas vs the legacy compose paths
dlq_url: dlqs
wkvs_url: http://localhost/.well-known
# dcs is routed at its prod GA4GH DRS base path here, not /api/dcs
dcs_url: http://localhost/api/ga4gh/drs/v1

# ucs and the auth adapter are gateway-routed; only ekss stays internal (its path
# falls through to the SPA, which the health check counts as "not found")
internal_apis:
  - ekss
external_apis:
  - wkvs
  - dcs
  - fis
  - metldata
  - ars
  - ums
  - wps
  - mass
  - mail
  - op
  - sms
  - dins
  - pcs
  - dlq
  - rts
  - rs
  - ucs
  - auth_adapter

# the prod chart-values database names, not the compose-era ones
service_db_names:
  - access-request
  - auth-service
  - download-controller
  - internal-file-registry
  - metadata-artifacts
  - upload-controller
  - work-package
  - mass
  - notification-orchestration
  - notification
  - file-ingest
  - dataset-information
  - purge-controller
  - dlqs
  - reverse-transpiler
  - registry
ums_db_name: auth-service
dcs_db_name: download-controller
fis_db_name: file-ingest
metldata_db_name: metadata-artifacts
ars_db_name: access-request
wps_db_name: work-package
ifrs_db_name: internal-file-registry
pcs_db_name: purge-controller
dins_db_name: dataset-information
dlq_db_name: dlqs
rts_db_name: reverse-transpiler
ucs_db_name: upload-controller
rs_db_name: registry
nos_db_name: notification-orchestration

# Event type names as the current services publish and consume them (the suite's
# default predates the rename dataset_upserted -> dataset_created)
dataset_upserted_type: dataset_created
