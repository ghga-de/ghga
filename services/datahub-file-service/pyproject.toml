[build-system]
requires = [
    "setuptools>=82",
]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
authors = [
    { name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
name = "dhfs"
version = "3.1.0"
description = "Data Hub File Service - a service enabling file inspection and re-encryption at Data Hubs"
dependencies = [
    "typer >= 0.25.1",
    "ghga-service-commons[auth,http,objectstorage,transports,crypt] >= 7.0.4",
    "hexkit[s3] >= 8.2.1",
    "crypt4gh >= 1.7",
    "async-lru >= 2.1.0",
]

[project.license]
text = "Apache 2.0"

[project.urls]
Repository = "https://github.com/ghga-de/datahub-file-service"

[project.scripts]
dhfs = "dhfs.__main__:run"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.paths]
source = [
    "src",
    "/workspace/src",
    "**/lib/python*/site-packages",
]

[tool.uv.sources]
ghga-service-commons = { workspace = true }
hexkit = { workspace = true }
