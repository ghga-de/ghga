[build-system]
requires = [
    "setuptools>=82",
]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
authors = [
    { name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
name = "rs"
version = "5.0.3"
description = "GHGA Registry Service - a service for ingesting and archiving metadata from data submitters."
license = "Apache-2.0"
dependencies = [
    "typer >= 0.26",
    "ghga-service-commons[api,auth,http] >= 9.0, < 10",
    "ghga-event-schemas ~= 13.0",
    "hexkit[akafka,mongodb,opentelemetry] >= 9.0",
]

[project.urls]
Repository = "https://github.com/ghga-de/ghga"

[project.scripts]
rs = "rs.__main__:cli"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.coverage.paths]
source = [
    "src",
    "/workspace/src",
    "**/lib/python*/site-packages",
]

[tool.uv.sources]
ghga-event-schemas = { workspace = true }
ghga-service-commons = { workspace = true }
hexkit = { workspace = true }
