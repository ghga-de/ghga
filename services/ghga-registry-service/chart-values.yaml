# Chart values for this member (deployment knowledge only).
# Derived facts — image, executable, configPrefix, command style — are stamped
# by the chart generator from workspace metadata (deploy/src/create_charts.py).
apiBasePath: /rs/
# Name of the database
mongodb:
  dbName: registry

# This parameter is used as Kafka's group id
serviceName: rs-rest

migrationInitContainer:
  executable: rs
  executableArgs:
  - migrate-db

# Those values are directly injected into the service's configuration
config:
  host: 0.0.0.0
  mongo_dsn:
  kafka_enable_dlq: true
  enable_opentelemetry: false
  service_instance_id: 'rs_1'
  service_name: rs
  access_url: http://claims-repository:8080
  ucs_url: http://upload-controller:8080
  auth_key: '{}'
  work_order_signing_key: '{}'
  db_version_collection: rsDbVersions
  migration_wait_sec: 5

executableArgs:
- run-rest

_topics:

  uploadBoxTopic:
    # as consumer
    topic:
      name: file_upload_box_topic
      value: file-upload-boxes
    kafkaUser:
      operations:
      - Read
  researchDataUploadBoxTopic:
    # as consumer
    topic:
      name: research_data_upload_box_topic
      value: research-data-upload-boxes
    kafkaUser:
      operations:
      - Write
  deadLetterQueue:
  # as producer
    topic:
      name: kafka_dlq_topic
      value: dlq
    kafkaUser:
      operations:
      - Write
  deadLetterQueueRetry:
  # as consumer
    topic:
      name:
      value: retry
    kafkaUser:
      operations:
      - Read
  accessionMapTopic:
  # as producer
    topic:
      name: accession_map_topic
      value: accession-maps
    kafkaUser:
      operations:
      - Write
  auditRecordTopic:
  # as producer
    topic:
      name: audit_record_topic
      value: audit-records
    type:
      name: audit_record_type
      value: audit_record_logged
    kafkaUser:
      operations:
      - Write
  resourceChangeEvent:
    # as consumer
    topic:
      name: resource_change_topic
      value: searchable-resources
    types:
    - name: resource_deletion_type
      value: searchable_resource_deleted
    - name: resource_upsertion_type
      value: searchable_resource_upserted
    kafkaUser:
      operations:
      - Read
  studyEvent:
    # as producer
    topic:
      name: study_topic
      value: studies
    kafkaUser:
      operations:
      - Write
