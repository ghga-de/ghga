[build-system]
requires = [
    "setuptools>=80.9",
]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
authors = [
    { name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
name = "my_microservice"
version = "0.1.0"
description = "My-Microservice - a short description"
dependencies = [
    "typer >= 0.19.1",
    "ghga-service-commons[api] >= 5.0",
    "ghga-event-schemas >= 10.0",
    "hexkit[akafka,s3,mongodb] >= 7.0",
]

[project.license]
text = "Apache 2.0"

[project.urls]
Repository = "https://github.com/ghga-de/my-microservice"

[project.scripts]
my-microservice = "my_microservice.__main__:run"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.pytest.ini_options]
minversion = "8.4"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.paths]
source = [
    "src",
    "/workspace/src",
    "**/lib/python*/site-packages",
]

[tool.uv.sources]
ghga-event-schemas = { workspace = true }
ghga-service-commons = { workspace = true }
hexkit = { workspace = true }

# Capability markers (ADR-0014): still an unmodified template skeleton (project name
# 'my_microservice', dummy test suite) — EXCLUDED from all release lanes until it gets
# a real identity upstream.
[tool.ghga]
release = "none"
