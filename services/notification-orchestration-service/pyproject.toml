[build-system]
requires = [
    "setuptools>=82",
]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
authors = [
    { name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
name = "nos"
version = "0.0.0"  # placeholder: the build stamps the platform version (ADR-0046)
description = "The Notification Orchestration Service controls the creation of notification events."
license = "Apache-2.0"
dependencies = [
    "typer >= 0.24",
    "ghga-event-schemas ~= 12.0",
    "hexkit[akafka,mongodb] >= 9.0",
    "pydantic[email]>=2, <3",
]

[project.urls]
Repository = "https://github.com/ghga-de/ghga"

[project.scripts]
nos = "nos.__main__:cli"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.coverage.paths]
source = [
    "src",
    "/workspace/src",
    "**/lib/python*/site-packages",
]

[tool.uv.sources]
ghga-event-schemas = { workspace = true }
hexkit = { workspace = true }
