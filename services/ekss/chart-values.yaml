# Chart values for this member (deployment knowledge only).
# Derived facts — image, executable, configPrefix, command style — are stamped
# by the chart generator from workspace metadata (deploy/src/create_charts.py).
serviceName: ekss-rest

config:
  host: 0.0.0.0
  server_private_key_path: <Please fill>
  vault_url: http://vault:8200
  vault_path: ekss
  enable_opentelemetry: false

executableArgs: []

# In-mesh callers, only the processes that call; the platform layer adds the gateway.
# {*} matches one path segment.
authorizationPolicy:
  callers:
    # serves envelopes for downloads
    dcs:
      methods: [GET]
      paths: ["/secrets/{*}/envelopes/{*}"]
    # deletes secrets on file deletion events
    dcs-consumer:
      methods: [DELETE]
      paths: ["/secrets/{*}"]
    # deposits secrets from interrogation reports, deletes one if storing the report fails
    fis:
      operations:
        - methods: [POST]
          paths: ["/secrets"]
        - methods: [DELETE]
          paths: ["/secrets/{*}"]
