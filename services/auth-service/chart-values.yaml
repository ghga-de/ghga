# Chart values for this member (deployment knowledge only).
# Derived facts — image, executable, configPrefix, command style — are stamped
# by the chart generator from workspace metadata (deploy/src/create_charts.py).
apiBasePath: /auth-ext/
# Name of the database
mongodb:
  dbName: auth-service
# This parameter is used as Kafka's group id
serviceName: auth-service

migrationInitContainer:
  executable: auth-service
  executableArgs:
  - migrate-db

config:
  mongo_dsn:
  host: 0.0.0.0
  enable_opentelemetry: false
  kafka_enable_dlq: true
  # retry before the DLQ, so a short database outage does not park an event there
  kafka_max_retries: 3
  kafka_retry_backoff: 2
  db_version_collection: "authDbVersions"
  migration_wait_sec: 10
  # replicas waiting on another one's migration fail after this, so a stuck lock shows
  migration_max_wait_sec: 600

executableArgs:
- run-rest

# In-mesh callers of the claims repository's access API and what each may do, only
# the processes that call; the platform layer sets who they are (identities) and adds
# the gateway. The chart serves all four instances (auth-adapter, auth-users,
# auth-claims, auth-consumer), but these routes exist only on auth-claims: on the
# others the platform drops these callers or sets denyAll. {*} matches one segment.
authorizationPolicy:
  callers:
    # checks download and upload access for work packages
    wps:
      - methods: [GET]
        paths:
          - /download-access/users/{*}/datasets
          - /download-access/users/{*}/datasets/{*}
          - /upload-access/users/{*}/boxes
          - /upload-access/users/{*}/boxes/{*}
    # grants, lists and revokes download access
    ars:
      - {methods: [POST], paths: ["/download-access/users/{*}/ivas/{*}/datasets/{*}"]}
      - {methods: [GET], paths: ["/download-access/grants"]}
      - {methods: [DELETE], paths: ["/download-access/grants/{*}"]}
    # grants, lists, checks and revokes upload access
    rs:
      - {methods: [POST], paths: ["/upload-access/users/{*}/ivas/{*}/boxes/{*}"]}
      - methods: [GET]
        paths:
          - /upload-access/grants
          - /upload-access/users/{*}/boxes
          - /upload-access/users/{*}/boxes/{*}
      - {methods: [DELETE], paths: ["/upload-access/grants/{*}"]}

_topics:
  authEvents:
    # as producer
    topic:
      name: auth_topic
      value: auth
    types:
    - name: second_factor_recreated_type
      value: second_factor_recreated
    kafkaUser:
      operations:
      - Write
  ivaEvents:
    # as producer
    topic:
      name: iva_state_changed_topic
      value: ivas
    types:
    - name: iva_state_changed_type
      value: iva_state_changed
    - name: iva_send_code_type
      value: iva_send_code
    kafkaUser:
      operations:
      - Write

  datasetChangeEvent:
    # as consumer
    topic:
      name: dataset_change_topic
      value: metadata-datasets
    types:
    - name: dataset_deletion_type
      value: dataset_deleted
    - name: dataset_upsertion_type
      value: dataset_created
    kafkaUser:
      operations:
      - Read
  userEvents:
    # as producer
    topic:
      name: user_topic
      value: users
    kafkaUser:
      operations:
      - Write
  # as producer
  deadLetterQueue:
    topic:
      name: kafka_dlq_topic
      value: dlq
    kafkaUser:
      operations:
      - Write
  # as consumer
  deadLetterQueueRetry:
    topic:
      name:
      value: retry
    kafkaUser:
      operations:
      - Read
