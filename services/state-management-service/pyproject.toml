[build-system]
requires = [
    "setuptools>=82",
]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
authors = [
    { name = "German Human Genome Phenome Archive (GHGA)", email = "contact@ghga.de" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
name = "sms"
version = "0.0.0"  # placeholder: the build stamps the platform version (ADR-0046)
description = "State Management Service - Provides a REST API for basic infrastructure technology state management."
license = "Apache-2.0"
dependencies = [
    "typer >= 0.25",
    "ghga-service-commons[api] >= 7.0",
    "hexkit[mongodb,s3,akafka] >= 8.1",
    "hvac>=2",
]

[project.urls]
Repository = "https://github.com/ghga-de/ghga"

[project.scripts]
sms = "sms.__main__:run"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.coverage.paths]
source = [
    "src",
    "/workspace/src",
    "**/lib/python*/site-packages",
]

[tool.uv.sources]
ghga-service-commons = { workspace = true }
hexkit = { workspace = true }
