# Chart values for this member (deployment knowledge only).
# Derived facts — image, executable, configPrefix, command style — are stamped
# by the chart generator from workspace metadata (deploy/src/create_charts.py).
apiBasePath: /wps/
# Name of the database
mongodb:
  dbName: work-package

# This parameter is used as Kafka's group id
serviceName: wps-consumer

migrationInitContainer:
  executable: wps
  executableArgs:
  - migrate-db


config:
  auth_key: '{}'
  mongo_dsn:
  db_name: wps
  access_url: http://claims-repository:8080
  host: "0.0.0.0"
  service_instance_id: 'wps_1'
  service_name: wps
  work_package_signing_key: '{}'
  kafka_enable_dlq: true
  enable_opentelemetry: false
  db_version_collection: "wpsDbVersions"
  migration_wait_sec: 10


executableArgs:
- run-rest
# executableArgs:
#   - consume-events

_topics:
  researchDataUploadBoxTopic:
    # as consumer
    topic:
      name: research_data_upload_box_topic
      value: research-data-upload-boxes
    kafkaUser:
      operations:
      - Read
  datasetChangeEvent:
    # as consumer
    topic:
      name: dataset_change_topic
      value: metadata-datasets
    types:
    - name: dataset_upsertion_type
      value: dataset_created
    - name: dataset_deletion_type
      value: dataset_deleted
    kafkaUser:
      operations:
      - Read
  # as producer
  deadLetterQueue:
    topic:
      name: kafka_dlq_topic
      value: dlq
    kafkaUser:
      operations:
      - Write
  # as consumer
  deadLetterQueueRetry:
    topic:
      name:
      value: retry
    kafkaUser:
      operations:
      - Read
  # as consumer
  accessionMapTopic:
    topic:
      name: accession_map_topic
      value: accession-maps
    kafkaUser:
      operations:
      - Read
