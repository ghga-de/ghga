# Chart values for this member (deployment knowledge only).
# Derived facts — image, executable, configPrefix, command style — are stamped
# by the chart generator from workspace metadata (deploy/src/create_charts.py).
apiBasePath: /dlqs/
# Name of the database
mongodb:
  dbName: dlqs

# Prometheus metrics, served on their own port (dlqs.config.metrics_port default:
# 9464) - never on httpRoute.port, so the public HTTPRoute has no path to it.
# metricsNetworkPolicy is a separate, narrower NetworkPolicy scoped to just this
# port, so it's only reachable from the monitoring namespace even inside the
# cluster.
containerPorts:
  metrics: 9464
metricsNetworkPolicy:
  enabled: true

# This parameter is used as Kafka's group id
serviceName: dlqs-consumer

config:
  token_hashes: []
  mongo_dsn:
  db_name: dlqs
  host: "0.0.0.0"
  service_instance_id: 'dlqs_1'
  service_name: dlqs
  kafka_enable_dlq: false
  db_version_collection: "dlqsDbVersions"
  migration_wait_sec: 10

executableArgs:
- run-rest
# executableArgs:
#   - consume-events

_topics:
  # as consumer
  deadLetterQueue:
    topic:
      name: kafka_dlq_topic
      value: dlq
    kafkaUser:
      operations:
      - Read
  deadLetterQueueRetries:
    topic:
      name:
      value: retry-
    kafkaUser:
      operations:
      - Write
      - Describe
      resource:
        patternType: prefix
