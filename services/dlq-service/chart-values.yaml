# Chart values for this member (deployment knowledge only).
# Derived facts — image, executable, configPrefix, command style — are stamped
# by the chart generator from workspace metadata (deploy/src/create_charts.py).
apiBasePath: /dlqs/
# Name of the database
mongodb:
  dbName: dlqs

# This parameter is used as Kafka's group id
serviceName: dlqs-consumer

migrationInitContainer:
  executable: dlqs
  executableArgs:
  - migrate-db

config:
  token_hashes: []
  mongo_dsn:
  host: "0.0.0.0"
  service_instance_id: 'dlqs_1'
  service_name: dlqs
  kafka_enable_dlq: false
  db_version_collection: "dlqsDbVersions"
  migration_wait_sec: 10
  # replicas waiting on another one's migration fail after this, so a stuck lock shows
  migration_max_wait_sec: 600

executableArgs:
- run-rest
# executableArgs:
#   - consume-events

_topics:
  # as consumer
  deadLetterQueue:
    topic:
      name: kafka_dlq_topic
      value: dlq
    kafkaUser:
      operations:
      - Read
  deadLetterQueueRetries:
    topic:
      name:
      value: retry-
    kafkaUser:
      operations:
      - Write
      - Describe
      resource:
        patternType: prefix
