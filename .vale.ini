# Prose check for `just prose` (docs/style.md).
# Only the vale-ai-tells rules that flag our own text with few false positives are on,
# each as a warning; the punctuation and register rules contradict docs/style.md.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.{md,py}]
ai-tells.AIAdjectiveNounPairs = warning
ai-tells.AICompoundPhrases = warning
ai-tells.EmptyPaddingStacked = warning
ai-tells.EvasionMetaphors = warning
ai-tells.FigurativeCarries = warning
ai-tells.FigurativeDraws = warning
ai-tells.FigurativeEarns = warning
ai-tells.FigurativeFalls = warning
ai-tells.FigurativeHolds = warning
ai-tells.FigurativeLands = warning
ai-tells.FigurativeLoud = warning
ai-tells.FigurativePays = warning
ai-tells.FigurativeQuantities = warning
ai-tells.FigurativeReaches = warning
ai-tells.FigurativeRides = warning
ai-tells.FigurativeSits = warning
ai-tells.FigurativeSurfaces = warning
ai-tells.FigurativeTravels = warning
ai-tells.FillerPhrases = warning
ai-tells.IncompleteComparison = warning
ai-tells.MotionMetaphors = warning
ai-tells.OpeningCliches = warning
ai-tells.PseudoCleft = warning
ai-tells.ShellNounCopula = warning
ai-tells.StackedHedges = warning
ai-tells.StructureAnnouncements = warning
ai-tells.SycophancyMarkers = warning
